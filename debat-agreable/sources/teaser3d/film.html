<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const BAR = 60 / 128 * 4, TOTAL = 32 * BAR;
const b = x => x * BAR;
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, c, k) => a + (c - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const AMBER = 0xFFB23E, CYAN = 0x3EF2FF, MAG = 0xFF3DCB;
const inDrop = t => (t >= b(8) && t < b(16)) || (t >= b(22) && t < b(30));
const beatPulse = t => Math.exp(-((t % (BAR / 4))) * 9);

// ---------- rendu ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1920, 1080); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04050b);
scene.fog = new THREE.FogExp2(0x04050b, 0.055);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
const camera = new THREE.PerspectiveCamera(35, 1920 / 1080, 0.05, 200);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1920, 1080), 0.6, 0.45, 0.86);
composer.addPass(bloom); composer.addPass(new OutputPass());

// ---------- décor : arène ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 96), new THREE.MeshStandardMaterial({ color: 0x07080f, metalness: .5, roughness: .42 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
function arc(color, start) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.035, 12, 160, Math.PI), new THREE.MeshBasicMaterial({ color }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = start; m.position.y = 0.02; scene.add(m); return m;
}
const ringA = arc(AMBER, Math.PI / 2), ringC = arc(CYAN, -Math.PI / 2);
const inner = new THREE.Mesh(new THREE.RingGeometry(1.95, 2.0, 128), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25, side: THREE.DoubleSide }));
inner.rotation.x = -Math.PI / 2; inner.position.y = .015; scene.add(inner);
const gridTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,61,203,.55)'; g.lineWidth = 2; for (let i = 0; i <= 512; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 12); return t; })();
const gridM = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ map: gridTex, transparent: true, opacity: .16, blending: THREE.AdditiveBlending, depthWrite: false }));
gridM.rotation.x = -Math.PI / 2; gridM.position.y = .01; scene.add(gridM);
// faisceaux lumineux
const beams = [];
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2 + .2, col = i % 2 ? CYAN : AMBER;
  const g = new THREE.CylinderGeometry(0.06, 0.9, 14, 32, 1, true); g.translate(0, -7, 0);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.position.set(Math.cos(a) * 6.5, 12, Math.sin(a) * 6.5); m.rotation.z = Math.cos(a) * .35; m.rotation.x = -Math.sin(a) * .35;
  scene.add(m); beams.push({ m, a, i });
}
// panneaux holographiques en fond
const panels = [];
for (let i = 0; i < 7; i++) {
  const a = Math.PI * (0.15 + i * 0.12) + Math.PI, r = 11;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 5), new THREE.MeshBasicMaterial({ color: i % 2 ? CYAN : MAG, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
  m.position.set(Math.cos(a) * r, 3, Math.sin(a) * r); m.lookAt(0, 3, 0); scene.add(m); panels.push(m);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: i % 2 ? CYAN : MAG, transparent: true, opacity: .5 }));
  m.add(edge);
}
// particules
const PN = 2500, pg = new THREE.BufferGeometry(), pp = new Float32Array(PN * 3), seed = new Float32Array(PN);
for (let i = 0; i < PN; i++) { const r = 2 + Math.random() * 12, a = Math.random() * 6.283; pp[i * 3] = Math.cos(a) * r; pp[i * 3 + 1] = Math.random() * 8; pp[i * 3 + 2] = Math.sin(a) * r; seed[i] = Math.random(); }
pg.setAttribute('position', new THREE.BufferAttribute(pp.slice(), 3));
const pts = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xbfe9ff, size: .035, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(pts);

// ---------- lumières ----------
scene.add(new THREE.AmbientLight(0x223044, .35));
const key = new THREE.SpotLight(0xffffff, 26, 30, .55, .6, 1.4); key.position.set(0, 9, 4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; scene.add(key, key.target);
const rimA = new THREE.PointLight(AMBER, 18, 12, 1.6); rimA.position.set(-3.5, 2.6, -2); scene.add(rimA);
const rimC = new THREE.PointLight(CYAN, 18, 12, 1.6); rimC.position.set(3.5, 2.6, -2); scene.add(rimC);
const strobe = new THREE.PointLight(MAG, 0, 14, 1.4); strobe.position.set(0, 3, 2.5); scene.add(strobe);
const front = new THREE.PointLight(0xfff1e0, 6, 10, 1.8); front.position.set(0, 1.8, 4); scene.add(front);

// ---------- personnages ----------
const loader = new GLTFLoader();
const load = u => new Promise((res, rej) => loader.load(u, res, undefined, rej));
const [gH, gR, gM] = await Promise.all([load('models/Xbot.glb'), load('models/RobotExpressive.glb'), load('models/Michelle.glb')]);
function prep(gltf, height) {
  const root = gltf.scene; root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  root.updateMatrixWorld(true); const box = new THREE.Box3().setFromObject(root, true); const h = box.max.y - box.min.y;
  root.scale.multiplyScalar(height / h); const g = new THREE.Group(); g.add(root); scene.add(g); return g;
}
const human = prep(gH, 1.8), robot = prep(gR, 1.95), michelle = prep(gM, 1.72);
human.traverse(o => { if (o.isMesh) {
  if (/Joints/i.test(o.material.name)) o.material = new THREE.MeshStandardMaterial({ color: 0x331a00, emissive: AMBER, emissiveIntensity: 1.6, roughness: .3 });
  else o.material = new THREE.MeshPhysicalMaterial({ color: 0xb8875a, metalness: .25, roughness: .38, clearcoat: .4, clearcoatRoughness: .15, sheen: .5, sheenColor: new THREE.Color(AMBER) });
} });
robot.traverse(o => { if (o.isMesh) {
  const n = o.material.name;
  if (/Main/i.test(n)) o.material = new THREE.MeshPhysicalMaterial({ color: 0x9eacb9, metalness: .65, roughness: .35, clearcoat: .3 });
  else if (/Grey/i.test(n)) o.material = new THREE.MeshStandardMaterial({ color: 0x2b3542, metalness: .8, roughness: .3 });
  else if (/Black/i.test(n)) o.material = new THREE.MeshStandardMaterial({ color: 0x021015, emissive: CYAN, emissiveIntensity: .9, roughness: .4 });
} });
const head = []; robot.traverse(o => { if (o.morphTargetDictionary) head.push(o); });

  for (let clip of gltf.animations) {
    if (additive.includes(clip.name)) {
      THREE.AnimationUtils.makeClipAdditive(clip);
      if (clip.name.endsWith('_pose')) clip = THREE.AnimationUtils.subclip(clip, clip.name, 2, 3, 30);
      const a = mixer.clipAction(clip); a.blendMode = THREE.AdditiveAnimationBlendMode; a.play(); a.setEffectiveWeight(0); acts[clip.name] = a;
    } else { const a = mixer.clipAction(clip); a.play(); a.setEffectiveWeight(0); acts[clip.name] = a; }
  }

}
const RH = rig(human, gH, ['agree', 'headShake', 'sad_pose', 'sneak_pose']);
const RR = rig(robot, gR), RM = rig(michelle, gM);

// programme d'animation : [mesure, clip, boucle, vitesse]
const SCH = {
  human: [[0, 'idle', 1, 1], [4, 'walk', 1, 1], [6.1, 'idle', 1, 1]],
  humanAdd: [[0, null], [9, 'headShake'], [10, null], [11, 'sneak_pose'], [12, null], [18, 'agree'], [20, null]],
  robot: [[0, 'Idle', 1, 1], [8, 'No', 1, 1], [10, 'Punch', 0, 1], [11, 'Idle', 1, 1], [12, 'Sitting', 0, 1], [13, 'Yes', 1, 1], [13.5, 'No', 1, 1], [14, 'Idle', 1, 1], [16.6, 'Yes', 0, .8], [17.6, 'Idle', 1, 1], [19, 'ThumbsUp', 0, 1], [20.2, 'Idle', 1, 1], [22, 'Dance', 1, 1], [30, 'Wave', 1, 1]],
  michelle: [[0, 'SambaDance', 1, 1]],
  face: [[0, {}], [7.2, { Surprised: 1 }], [8, { Angry: 1 }], [11, {}], [12, { Sad: .7 }], [13, {}], [16, { Sad: .6 }], [17, {}], [19, { Surprised: .5 }], [20, {}]],
};
function seg(list, t) { let i = 0; while (i + 1 < list.length && b(list[i + 1][0]) <= t) i++; return i; }
function animate(R, list, t, xfade = .28) {
  for (const a of Object.values(R.acts)) if (a.blendMode !== THREE.AdditiveAnimationBlendMode) a.setEffectiveWeight(0);
  const i = seg(list, t), cur = list[i], prev = list[i - 1];
  const w = prev ? clamp((t - b(cur[0])) / xfade) : 1;
  const set = (s, weight) => { const a = R.acts[s[1]]; const local = (t - b(s[0])) * (s[3] || 1); const d = a.getClip().duration;
    a.time = s[2] ? local % d : Math.min(local, d - 0.001); a.setEffectiveWeight(weight + a.getEffectiveWeight()); };
  if (prev && w < 1) set(prev, 1 - w); set(cur, w);
}

  for (const a of Object.values(R.acts)) if (a.blendMode === THREE.AdditiveAnimationBlendMode) a.setEffectiveWeight(0);
  const i = seg(list, t), cur = list[i], prev = list[i - 1];
  const w = prev ? clamp((t - b(cur[0])) / .35) : 1;

}

  const i = seg(SCH.face, t), cur = SCH.face[i][1], prev = SCH.face[i - 1] ? SCH.face[i - 1][1] : {};
  const w = clamp((t - b(SCH.face[i][0])) / .3);
  for (const m of head) for (const [k, idx] of Object.entries(m.morphTargetDictionary)) m.morphTargetInfluences[idx] = lerp(prev[k] || 0, cur[k] || 0, w);

// ---------- caméra : plans ----------
const HP = V(-1.15, 0, 0), RP = V(1.15, 0, 0);
const SHOTS = [
  [0, 4, t => ({ p: V(lerp(.4, 1.0, ease(t)), lerp(.5, 1.3, ease(t)), lerp(11, 5.8, ease(t))), l: V(1.15, 1.0, 0), f: 32 })],
  [4, 6, t => ({ p: V(lerp(-2.5, -.5, t), 1.5, 6.8), l: V(lerp(-2.6, -.2, t), 1.0, 0), f: 34 })],
  [6, 8, t => ({ p: V(-3.4, 1.65, lerp(2.2, 1.8, t)), l: V(1.0, 1.1, 0), f: lerp(34, 30, t) })],
  [8, 9, t => ({ p: V(lerp(3.9, 3.5, t), .8, lerp(3.0, 2.7, t)), l: V(1.0, 1.3, 0), f: 30 })],
  [9, 10, t => ({ p: V(-3.0, 1.4, lerp(2.2, 1.9, t)), l: V(-1.1, 1.3, 0), f: 30 })],
  [10, 11, t => ({ p: V(lerp(4.2, 3.7, t), .5, 3.0), l: V(1.0, 1.1, 0), f: 34 })],
  [11, 12, t => ({ p: V(-3.3, .55, lerp(-1.4, -.6, t)), l: V(-1.1, 1.0, 0), f: 34 })],
  [12, 13, t => ({ p: V(1.3, lerp(5.2, 4.6, t), 1.4), l: V(1.15, .3, 0), f: 40 })],
  [13, 14, t => { const a = lerp(-.6, 1.2, t); return { p: V(1.15 + Math.sin(a) * 2.6, 1.4, Math.cos(a) * 2.6), l: V(1.15, 1.2, 0), f: 32 }; }],
  [14, 16, t => { const a = lerp(0, Math.PI * .9, t); return { p: V(Math.sin(a) * 5.5, lerp(4.5, 3.2, t), Math.cos(a) * 5.5), l: V(0, .8, 0), f: 34 }; }],
  [16, 18, t => ({ p: V(lerp(-1.6, -1.3, t), 1.9, lerp(2.2, 1.9, t)), l: V(1.0, 1.5, 0), f: 30 })],
  [18, 20, t => ({ p: V(lerp(-.6, .6, t), .9, 5.2), l: V(0, 1.15, 0), f: 30 })],
  [20, 22, t => ({ p: V(lerp(-2.0, -1.0, ease(t)), lerp(1.6, 5.0, ease(t)), lerp(-2.6, 6.0, ease(t))), l: V(0, .9, 0), f: 36 })],
  [22, 24, t => { const a = lerp(-1.1, 1.1, t); return { p: V(Math.sin(a) * 4.6, .7, Math.cos(a) * 4.6), l: V(0, 1.1, -.3), f: 34 }; }],
  [24, 26, t => ({ p: V(lerp(3.6, 3.1, t), lerp(.7, 1.3, t), 3.2), l: V(1.1, 1.1, 0), f: 32 })],
  [26, 28, t => ({ p: V(lerp(-.6, -.2, t), 1.3, lerp(3.0, 2.6, t)), l: V(-1.15, 1.0, 0), f: 30 })],
  [28, 30, t => { const a = lerp(0, Math.PI * .6, t); return { p: V(Math.sin(a) * 6, lerp(1.5, 6, ease(t)), Math.cos(a) * 6), l: V(0, .8, -.4), f: 36 }; }],
  [30, 32, t => ({ p: V(lerp(.8, 0, t), lerp(1.4, 1.8, t), lerp(4.2, 8.5, ease(t))), l: V(.5, 1.2, -.3), f: 32 })],
];
function cam(t) {
  const s = SHOTS.find(s => t >= b(s[0]) && t < b(s[1])) || SHOTS[SHOTS.length - 1];

// ---------- textes ----------
const TEXTS = [
  [2, 4, 'HUMAIN <span style="color:#3EF2FF">×</span> IA', 150, 470, '#FFB23E'],
  [6, 8, 'UN DÉBAT<br>COMMENCE', 140, 400, '#3EF2FF'],
  [8, 10, 'ÇA CHAUFFE.', 190, 440, '#FF3DCB'],
  [10, 11, 'LE BULLDOZER', 160, 760, '#FF3DCB'],
  [11, 12, 'LE SNIPER', 160, 760, '#FF3DCB'],
  [12, 13, 'LA TORTUE', 160, 760, '#FF3DCB'],
  [13, 14, 'LA GIROUETTE', 160, 760, '#FF3DCB'],
  [14, 16, 'ET TOI?', 220, 420, '#FFB23E'],
  [16, 18, 'ET SI ON<br>S\'ÉCOUTAIT?', 130, 680, '#3EF2FF'],
  [18, 19.6, 'DUR SUR<br>LES IDÉES.', 140, 180, '#3EF2FF'],
  [19.6, 21.5, 'DOUX AVEC<br>LES GENS.', 140, 180, '#FFB23E'],
  [22, 26, 'LA CONFRONTATION<br><span style="color:#FFB23E">AGRÉABLE</span>', 118, 170, '#3EF2FF'],
  [26, 27, 'ÉCOUTER.', 160, 800, '#FFB23E'],
  [27, 28, 'REFORMULER.', 160, 800, '#3EF2FF'],
  [28, 30, 'AVANCER<br>ENSEMBLE.', 160, 380, '#FF3DCB'],
  [30, 32, 'VENEZ JOUER.<div class="sub" style="font-size:40px;margin-top:34px;text-shadow:0 0 20px #000">ATELIER · ADULTES · AUCUN PRÉREQUIS</div>', 150, 360, '#FFB23E'],
];
const tbox = document.getElementById('texts');
const tel = TEXTS.map(([s, e, h, fs, top, g]) => { const d = document.createElement('div'); d.className = 'tx'; d.innerHTML = h; d.style.fontSize = fs + 'px'; d.style.top = top + 'px'; d.style.setProperty('--g', g); tbox.appendChild(d); return { d, s: b(s), e: b(e) }; });

// ---------- boucle ----------
const basePts = pp.slice();
window.TOTAL = TOTAL;
window.renderAt = function (t) {
  // placement des personnages
  const walkK = clamp((t - b(4)) / (b(6.1) - b(4)));
  human.position.set(lerp(-5.2, HP.x, walkK), 0, 0); human.rotation.y = Math.PI / 2;
  const turn = ease(clamp((t - b(4.5)) / .8));

  ringA.material.color.setHex(AMBER).multiplyScalar(1 + pu * 2); ringC.material.color.setHex(CYAN).multiplyScalar(1 + pu * 2);
  ringA.rotation.z = Math.PI / 2 + (t > b(22) ? (t - b(22)) * 1.2 : 0); ringC.rotation.z = -Math.PI / 2 + (t > b(22) ? (t - b(22)) * 1.2 : 0);
  inner.material.opacity = .15 + pu * .5;
  strobe.intensity = (t >= b(8) && t < b(10)) ? (Math.floor(t / (BAR / 4)) % 2 ? 80 : 0) : (inDrop(t) ? pu * 25 : 0);
  rimA.intensity = 18 + pu * 30 + (breakdown ? 8 : 0); rimC.intensity = 18 + pu * 30 + (breakdown ? 8 : 0);
  key.intensity = (t < b(1) ? lerp(3, 26, clamp(t / b(1))) : 26) * (breakdown ? .75 : 1);
  key.target.position.set(0, 1, 0);

  gridTex.offset.y = -t * .15;
  panels.forEach((p, i) => p.material.opacity = .04 + (inDrop(t) ? .06 * ((Math.floor(t / (BAR / 4)) + i) % 3 === 0 ? 1 : 0) : 0));
  const pos = pg.attributes.position.array;
  for (let i = 0; i < PN; i++) { pos[i * 3 + 1] = (basePts[i * 3 + 1] + t * (.15 + seed[i] * .35) * (breakdown ? 1.8 : 1)) % 8; }
  cam(t);
  for (let i = 0; i < PN; i++) { const dx = pos[i*3] - camera.position.x, dy = pos[i*3+1] - camera.position.y, dz = pos[i*3+2] - camera.position.z; if (dx*dx + dy*dy + dz*dz < 4) pos[i*3+1] = -50; }

  composer.render();

  tel.forEach(({ d, s, e }) => { const fi = clamp((t - s) / .18), fo = clamp((e - .2 - t) / .2), o = Math.min(fi, fo);
    d.style.opacity = t >= s && t < e ? o : 0; d.style.transform = `scale(${1.15 - .15 * ease(fi)})`; d.style.filter = fi < 1 ? `blur(${(1 - fi) * 8}px)` : 'none'; });
  // flash aux drops et fondu final
  const fl = [b(8), b(22)].reduce((m, x) => Math.max(m, t >= x ? 1 - clamp((t - x) / .4) : 0), 0);
  document.getElementById('flash').style.opacity = fl * .8;
  document.getElementById('fade').style.opacity = Math.max(clamp(1 - t / .8), clamp((t - (TOTAL - 1)) / .9));
};
window.DEBUG = () => { const r = {}; for (const [n, g] of Object.entries({ human, robot, michelle })) { g.updateMatrixWorld(true); const bx = new THREE.Box3().setFromObject(g, true); r[n] = [bx.min.toArray().map(v=>+v.toFixed(2)), bx.max.toArray().map(v=>+v.toFixed(2)), g.children[0].scale.x]; } return r; };
window.WIDE = t => { window.renderAt(t); camera.position.set(0, 1.6, 9); camera.fov = 35; camera.updateProjectionMatrix(); camera.lookAt(0, 1, 0); composer.render(); };
window.READY = true;
</script>
