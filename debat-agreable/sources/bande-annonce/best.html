<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Alfa;src:url(../fonts/AlfaSlab.ttf)}
@font-face{font-family:RS;src:url(../fonts/RSlabB.ttf);font-weight:700}
@font-face{font-family:RSK;src:url(../fonts/RSlabK.ttf)}
@font-face{font-family:Elite;src:url(../fonts/Elite.ttf)}

canvas{display:block}
</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<!-- précharge des polices -->
<div style="position:absolute;left:-9999px;font-family:Alfa">a</div><div style="position:absolute;left:-9999px;font-family:RS;font-weight:700">a</div><div style="position:absolute;left:-9999px;font-family:Elite">a</div><div style="position:absolute;left:-9999px;font-family:RSK">a</div>
<script>
const W = 1920, H = 1080, cv = document.getElementById('cv'), cx = cv.getContext('2d');
const PAPER = '#EFE6D1', INK = '#1B1714', RED = '#D2232A', OR = '#F0A12E', BROWN = '#6B4B10', LIGHT = '#FBF6EA';
const BAR = 60 / 128 * 4, BEAT = BAR / 4, TOTAL = 32 * BAR;
const b = x => x * BAR;
const clamp = x => Math.max(0, Math.min(1, x)), lerp = (a, c, k) => a + (c - a) * k;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const drop = t => (t >= b(8) && t < b(16)) || (t >= b(22) && t < b(30));
const pulse = t => drop(t) ? Math.exp(-((t % BEAT)) * 10) : 0;

// ---------- poses (boîte 100 × 125) ----------
const P = {
  stand: { h: [50, 14], n: [50, 28], hp: [50, 68], a: [[40, 48], [36, 66]], b: [[60, 48], [64, 66]], c: [[44, 92], [42, 118]], d: [[56, 92], [58, 118]] },
  talk: { h: [50, 14], n: [50, 28], hp: [50, 68], a: [[40, 48], [36, 66]], b: [[66, 40], [82, 30]], c: [[44, 92], [42, 118]], d: [[56, 92], [58, 118]] },
  point: { h: [48, 14], n: [48, 28], hp: [48, 66], a: [[36, 46], [40, 64]], b: [[66, 30], [90, 26]], c: [[42, 90], [38, 116]], d: [[56, 90], [62, 116]] },
  push: { h: [64, 20], n: [58, 32], hp: [42, 66], a: [[74, 42], [94, 40]], b: [[72, 34], [94, 30]], c: [[32, 90], [16, 114]], d: [[54, 90], [60, 116]] },
  lean: { h: [36, 22], n: [40, 34], hp: [52, 68], a: [[30, 42], [20, 34]], b: [[54, 46], [62, 40]], c: [[46, 92], [42, 118]], d: [[60, 92], [70, 118]] },
  arms: { h: [50, 16], n: [50, 30], hp: [50, 68], a: [[30, 30], [18, 14]], b: [[70, 30], [82, 14]], c: [[40, 92], [30, 116]], d: [[60, 92], [72, 116]] },
  prof: { h: [50, 14], n: [50, 28], hp: [50, 68], a: [[38, 48], [42, 62]], b: [[64, 22], [66, 0]], c: [[44, 92], [42, 118]], d: [[56, 92], [58, 118]] },
  shrug: { h: [50, 14], n: [50, 30], hp: [52, 68], a: [[30, 40], [22, 26]], b: [[70, 40], [78, 26]], c: [[44, 92], [38, 118]], d: [[60, 92], [64, 118]] },
  hide: { h: [42, 70], n: [48, 78], hp: [64, 100], a: [[40, 92], [34, 104]], b: [[56, 96], [50, 108]], c: [[48, 108], [40, 118]], d: [[66, 112], [56, 118]] },
  think: { h: [50, 16], n: [50, 30], hp: [50, 68], a: [[36, 50], [58, 52]], b: [[66, 46], [54, 22]], c: [[44, 92], [42, 118]], d: [[58, 92], [62, 118]] },
  jump: { h: [52, 4], n: [50, 18], hp: [48, 54], a: [[34, 8], [22, -8]], b: [[66, 8], [80, -8]], c: [[36, 72], [40, 92]], d: [[60, 72], [72, 88]] },
  hand: { h: [50, 14], n: [50, 28], hp: [50, 68], a: [[40, 48], [36, 66]], b: [[66, 44], [86, 48]], c: [[44, 92], [42, 118]], d: [[56, 92], [58, 118]] },
  small: { h: [50, 34], n: [50, 46], hp: [50, 78], a: [[42, 60], [44, 74]], b: [[58, 60], [56, 74]], c: [[46, 98], [44, 118]], d: [[54, 98], [56, 118]] },
};
const J = ['h', 'n', 'hp'];
function mix(p1, p2, k) {
  const o = {}; for (const j of J) o[j] = [lerp(p1[j][0], p2[j][0], k), lerp(p1[j][1], p2[j][1], k)];
  for (const j of ['a', 'b', 'c', 'd']) o[j] = p1[j].map((q, i) => [lerp(q[0], p2[j][i][0], k), lerp(q[1], p2[j][i][1], k)]);
  return o;
}
// piste d'animation : [[temps, pose], ...] interpolée
function track(keys, t) {
  if (t <= keys[0][0]) return P[keys[0][1]];
  for (let i = 0; i < keys.length - 1; i++) if (t < keys[i + 1][0]) {
    const k = eio(clamp((t - keys[i][0]) / Math.min(.35, keys[i + 1][0] - keys[i][0])));
    return mix(P[keys[i][1]], P[keys[i + 1][1]], k);
  }
  return P[keys[keys.length - 1][1]];
}
// silhouette « risographie » : calque orange décalé + encre
function fig(p, x, y, s, { ink = INK, flip = 1, alpha = 1, extra } = {}) {
  const m = q => [x + (q[0] - 50) * s * flip, y + (q[1] - 118) * s];
  const draw = (col, dx, dy) => {
    cx.save(); cx.translate(dx, dy); cx.strokeStyle = col; cx.fillStyle = col; cx.lineCap = cx.lineJoin = 'round';
    const L = (pts, w) => { cx.lineWidth = w * s; cx.beginPath(); pts.map(m).forEach((q, i) => i ? cx.lineTo(...q) : cx.moveTo(...q)); cx.stroke(); };
    L([p.n, p.hp], 17); L([p.n, ...p.a], 8); L([p.n, ...p.b], 8); L([p.hp, ...p.c], 10); L([p.hp, ...p.d], 10);
    cx.beginPath(); cx.arc(...m(p.h), 9.5 * s, 0, 6.29); cx.fill();
    if (extra) extra(m, s, col, p);
    cx.restore();
  };
  cx.save(); cx.globalAlpha = alpha;
  draw(OR, 4 * s * .5, 3 * s * .5);
  draw(ink, 0, 0);
  cx.restore();
  return m;
}
// ---------- texte ----------
function wrap(text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t2 = cur ? cur + ' ' + w : w; if (cx.measureText(t2).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t2; }
  if (cur) lines.push(cur); return lines;
}
function bubble(text, x, y, tailX, tailY, t0, t, { size = 46, maxW = 620, color = INK, bg = LIGHT, big = false } = {}) {
  const p = clamp((t - t0) / .25); if (p <= 0) return;
  const n = Math.floor(clamp((t - t0 - .08) / Math.max(.25, text.length * .022)) * text.length);
  cx.save(); cx.font = `${size}px Elite`;
  const lines = wrap(text, maxW); const lh = size * 1.18;
  const w = Math.max(...lines.map(l => cx.measureText(l).width)) + 56, h = lines.length * lh + 40;
  const sc = .6 + .4 * back(p);
  cx.translate(x, y); cx.scale(sc, sc); cx.translate(-x, -y);
  const bx = x - w / 2, by = y - h / 2;
  // ombre orange
  cx.fillStyle = OR; rr(bx + 8, by + 8, w, h, 22); cx.fill();
  cx.fillStyle = bg; cx.strokeStyle = INK; cx.lineWidth = 5;
  cx.beginPath(); cx.moveTo(lerp(bx, bx + w, .35), by + h - 2); cx.lineTo(tailX, tailY); cx.lineTo(lerp(bx, bx + w, .55), by + h - 2); cx.closePath(); cx.fill(); cx.stroke();
  rr(bx, by, w, h, 22); cx.fill(); cx.stroke();
  cx.fillStyle = bg; cx.fillRect(lerp(bx, bx + w, .35) + 3, by + h - 6, lerp(0, w, .2) - 6, 8);
  cx.fillStyle = color; cx.textBaseline = 'top';
  let left = n;
  lines.forEach((l, i) => { const s2 = l.slice(0, Math.max(0, left)); left -= l.length + 1; cx.fillText(s2, bx + 28, by + 22 + i * lh); });
  cx.restore();
}
function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
function title(text, x, y, size, t0, t, { color = RED, rot = -2, align = 'left', font = 'Alfa' } = {}) {
  const p = clamp((t - t0) / .3); if (p <= 0) return;
  cx.save(); cx.translate(x, y); cx.rotate(rot * Math.PI / 180); const s = .7 + .3 * back(p); cx.scale(s, s);
  cx.globalAlpha = clamp(p * 2); cx.font = `${size}px ${font}`; cx.textAlign = align; cx.textBaseline = 'middle';
  cx.fillStyle = OR; cx.fillText(text, 5, 5); cx.globalCompositeOperation = 'multiply'; cx.fillStyle = color; cx.fillText(text, 0, 0);
  cx.restore();
}
function tag(label, text, x, y, t0, t) {
  const p = clamp((t - t0) / .3); if (p <= 0) return;
  cx.save(); cx.globalAlpha = clamp(p * 2); cx.translate(x - 30 * (1 - eo(p)), y);
  cx.font = '30px Alfa'; const lw = cx.measureText(label).width;
  cx.font = '40px RS'; cx.font = '700 40px RS'; const tw = cx.measureText(text).width;
  cx.fillStyle = INK; cx.fillRect(0, -30, lw + 34, 60); cx.fillStyle = PAPER; cx.font = '30px Alfa'; cx.textBaseline = 'middle'; cx.fillText(label, 17, 2);
  cx.fillStyle = OR; cx.fillRect(lw + 34, -30, tw + 40, 60); cx.fillStyle = INK; cx.font = '700 40px RS'; cx.fillText(text, lw + 54, 2);
  cx.restore();
}
// ---------- décor ----------
const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
(() => { const g = grain.getContext('2d'); const d = g.createImageData(W, H); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = 90; d.data[i + 1] = 70; d.data[i + 2] = 40; d.data[i + 3] = v < 200 ? 0 : (v - 200) * .9; } g.putImageData(d, 0, 0); })();
function ground(y = 900) { cx.save(); cx.strokeStyle = INK; cx.lineWidth = 5; cx.beginPath(); cx.moveTo(80, y); for (let x = 80; x <= W - 80; x += 40) cx.lineTo(x, y + Math.sin(x * .05) * 2); cx.stroke(); cx.restore(); }
function bg(col = PAPER) { cx.fillStyle = col; cx.fillRect(0, 0, W, H); }
function bigNum(n, x, y, t0, t) { title(n, x, y, 300, t0, t, { color: INK, rot: 0, align: 'left' }); }

// ---------- scènes ----------
const GY = 900, S = 3.6; // sol, échelle des personnages
const SC = [];
const scene = (b0, b1, fn) => SC.push({ s: b(b0), e: b(b1), fn });

// 0. Titre
scene(0, 2, (lt, t) => {
  bg(); const j = Math.abs(Math.sin(t * 3.35)) * 30;
  fig(P.jump, 1720, 800 - j, 3.6);
  title('LA', 140, 300, 120, .2, lt, { rot: 0 });
  title('CONFRONTATION', 140, 440, 132, .5, lt, { rot: 0 });
  title('AGRÉABLE', 140, 590, 132, .8, lt, { rot: 0 });
  title('Dur sur les idées. Doux avec les gens.', 146, 740, 44, 1.6, lt, { color: INK, rot: 0, font: 'RSK' });
});
// 1. Dans chaque débat…
scene(2, 4, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'stand'], [.6, 'talk'], [1.6, 'stand'], [2.2, 'talk']], lt), 700, GY, S);
  fig(track([[0, 'stand'], [1, 'talk'], [2, 'stand']], lt), 1220, GY, S, { flip: -1, ink: RED });
  title('Dans chaque débat…', 960, 200, 110, .1, lt, { align: 'center', rot: -1 });
});
scene(4, 6, (lt, t) => {
  bg(); title('8', 960, 470, 520, 0, lt, { align: 'center', rot: 0, color: RED });
  title('CRÉATURES', 960, 820, 130, .5, lt, { align: 'center', rot: -2, color: INK });
});
scene(6, 8, (lt, t) => {
  bg(INK);
  title('LAQUELLE', 960, 400, 190, .1, lt, { align: 'center', rot: -2, color: PAPER });
  title('ES-TU?', 960, 640, 230, .6, lt, { align: 'center', rot: 2, color: OR });
});

// ---- DROP 1 : 4 créatures × 2 mesures ----
// Bulldozer : coupe la parole et pousse
scene(8, 10, (lt, t) => {
  bg(); ground();
  const adv = eo(clamp((lt - .9) / 1.2));
  const bx = lerp(1250, 1420, adv);
  fig(track([[0, 'talk'], [1.0, 'lean']], lt), bx, GY, S, { flip: -1, ink: RED });
  fig(track([[0, 'stand'], [.8, 'push']], lt), lerp(560, 860, adv), GY, S);
  bubble('Je pense que…', 1430, 330, 1360, 470, .15, lt, { size: 38 });
  bubble('LAISSE-MOI FINIR!', 760, 330, 820, 480, .9, lt, { size: 66, maxW: 900 });
  title('LE BULLDOZER', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'coupe la parole et pousse', 90, 1000, 1.2, lt);
});
// Brouillard : noie le sujet dans le brouillard
scene(10, 12, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'point']], lt), 1300, GY, S, { flip: -1, ink: RED });
  bubble('Ta réponse, c\'est quoi?', 1350, 300, 1310, 450, .1, lt, { size: 40 });
  const f = eo(clamp((lt - .9) / 1.4));
  fig(track([[0, 'stand'], [.9, 'arms']], lt), 640, GY, S, { alpha: 1 - f * .55 });
  cx.save(); cx.globalAlpha = .82 * f;
  for (let i = 0; i < 16; i++) { const a = i / 16 * 6.28 + lt * .4, r = 120 + 140 * hash(i) ; cx.fillStyle = i % 3 ? '#cfc6b4' : '#bdb3a0';
    cx.beginPath(); cx.arc(640 + Math.cos(a) * r * f, 700 + Math.sin(a) * r * .7 * f, (70 + 60 * hash(i + 9)) * f, 0, 6.29); cx.fill(); }
  cx.restore();
  bubble('Oui, mais le VRAI problème, c\'est…', 620, 300, 640, 470, 1.0, lt, { size: 50, maxW: 760 });
  title('LE BROUILLARD', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'change de sujet quand ça chauffe', 90, 1000, 1.3, lt);
});
// Sniper : vise la personne
scene(12, 14, (lt, t) => {
  bg(); ground();
  const shrink = eo(clamp((lt - 1.5) / .8));
  fig(track([[0, 'talk'], [1.5, 'small']], lt), 1300, GY, S, { flip: -1, ink: RED });
  fig(track([[0, 'stand'], [.5, 'point']], lt), 560, GY, S);
  bubble('Le télétravail, ça marche.', 1320, 300, 1290, 470, .05, lt, { size: 38 });
  // mire sur la tête de l'autre
  const c = clamp((lt - .8) / .4); if (c > 0) { const hx = 1300, hy = GY - (118 - lerp(14, 34, shrink)) * S;
    cx.save(); cx.strokeStyle = RED; cx.lineWidth = 6; cx.globalAlpha = c; const r = lerp(160, 70, eo(c));
    cx.beginPath(); cx.arc(hx, hy, r, 0, 6.29); cx.stroke(); cx.beginPath(); cx.moveTo(hx - r - 30, hy); cx.lineTo(hx + r + 30, hy); cx.moveTo(hx, hy - r - 30); cx.lineTo(hx, hy + r + 30); cx.stroke(); cx.restore(); }
  bubble('Venant de toi, franchement…', 660, 300, 600, 470, 1.0, lt, { size: 54, maxW: 700 });
  title('LE SNIPER', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'vise la personne, pas l\'idée', 90, 1000, 1.3, lt);
});
// Professeur : brandit l'autorité
scene(14, 16, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'stand'], [1.8, 'talk']], lt), 1360, GY, S, { flip: -1, ink: RED });
  fig(track([[0, 'stand'], [.4, 'prof']], lt), 640, GY, S);
  // pile de livres qui monte
  const nb = Math.floor(clamp((lt - .5) / 1.4) * 8);
  for (let i = 0; i < nb; i++) { const y = GY - 34 - i * 34; cx.fillStyle = i % 2 ? RED : INK; cx.fillRect(330 + (hash(i) - .5) * 30, y, 150, 30); cx.fillStyle = PAPER; cx.fillRect(345 + (hash(i) - .5) * 30, y + 12, 120, 4); }
  bubble('Les études montrent que…', 700, 280, 680, 440, .5, lt, { size: 56, maxW: 760 });
  bubble('Lesquelles?', 1400, 380, 1370, 470, 2.2, lt, { size: 40 });
  title('LE PROFESSEUR', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'brandit l\'autorité', 90, 1000, 1.3, lt);
});

// ---- PAUSE : 3 créatures × 2 mesures ----
// Girouette : se tourne vers le dernier qui parle
scene(16, 18, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'talk'], [1.9, 'stand']], lt), 360, GY, S * .9, { ink: RED });
  fig(track([[0, 'stand'], [1.9, 'talk']], lt), 1560, GY, S * .9, { flip: -1, ink: RED });
  const turn = Math.cos(clamp((lt - 1.6) / .6) * Math.PI); // 1 → -1
  fig(track([[0, 'shrug']], lt), 960, GY, S, { flip: turn });
  // girouette au-dessus de la tête
  cx.save(); cx.translate(960, GY - 118 * S - 60); cx.strokeStyle = INK; cx.lineWidth = 5; cx.beginPath(); cx.moveTo(0, 60); cx.lineTo(0, 0); cx.stroke();
  cx.rotate(lt * 5); cx.fillStyle = RED; cx.beginPath(); cx.moveTo(-70, 0); cx.lineTo(60, 0); cx.lineTo(40, -20); cx.lineTo(80, 0); cx.lineTo(40, 20); cx.lineTo(60, 0); cx.closePath(); cx.fill(); cx.fillRect(-70, -3, 130, 6); cx.restore();
  bubble('T\'as raison!', 640, 330, 860, 470, .3, lt, { size: 50 });
  bubble('Toi aussi, t\'as raison!', 1280, 330, 1060, 470, 2.0, lt, { size: 50, maxW: 640 });
  title('LA GIROUETTE', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'suit le dernier qui parle', 90, 1000, 1.0, lt);
});
// Tortue : se cache avec la meilleure idée
scene(18, 20, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'talk'], [1, 'point']], lt), 380, GY, S * .9, { ink: RED });
  fig(track([[0, 'point'], [1, 'talk']], lt), 1560, GY, S * .9, { flip: -1, ink: RED });
  bubble('BLA BLA BLA!', 460, 330, 420, 470, .1, lt, { size: 40 });
  bubble('BLA BLA!', 1460, 330, 1520, 470, .4, lt, { size: 40 });
  const hd = eo(clamp((lt - .3) / .6));
  fig(mix(P.stand, P.hide, hd), 960, GY, S);
  // carapace
  if (hd > .5) { cx.save(); cx.globalAlpha = (hd - .5) * 2; cx.fillStyle = '#3E6E5A'; cx.strokeStyle = INK; cx.lineWidth = 6; cx.beginPath(); cx.ellipse(1000, GY - 70, 150, 120, 0, Math.PI, 0); cx.fill(); cx.stroke();
    cx.beginPath(); for (let i = -2; i <= 2; i++) { cx.moveTo(1000 + i * 55, GY - 70); cx.lineTo(1000 + i * 45, GY - 150); } cx.stroke(); cx.restore(); }
  // bulle de pensée avec ampoule
  const th = clamp((lt - 1.4) / .4); if (th > 0) { cx.save(); cx.globalAlpha = th; cx.fillStyle = LIGHT; cx.strokeStyle = INK; cx.lineWidth = 5;
    [[1060, 640, 18], [1100, 580, 28]].forEach(([x, y, r]) => { cx.beginPath(); cx.arc(x, y, r, 0, 6.29); cx.fill(); cx.stroke(); });
    cx.beginPath(); cx.ellipse(1190, 460, 120, 90, 0, 0, 6.29); cx.fill(); cx.stroke();
    cx.fillStyle = OR; cx.beginPath(); cx.arc(1190, 445, 38, 0, 6.29); cx.fill(); cx.stroke(); cx.fillStyle = INK; cx.fillRect(1175, 480, 30, 22);
    cx.strokeStyle = OR; cx.lineWidth = 6; for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; cx.beginPath(); cx.moveTo(1190 + Math.cos(a) * 52, 445 + Math.sin(a) * 52); cx.lineTo(1190 + Math.cos(a) * 70, 445 + Math.sin(a) * 70); cx.stroke(); }
    cx.restore(); }
  title('LA TORTUE', 90, 120, 104, .05, lt, { rot: -2 });
  tag('FAIT', 'se tait… avec la meilleure idée', 90, 1000, 1.4, lt);
});
// Avocat du diable : contredit tout
scene(20, 22, (lt, t) => {
  bg(); ground();
  fig(track([[0, 'talk'], [2, 'shrug']], lt), 1320, GY, S, { flip: -1, ink: RED });
  const horns = (m, s, col, p) => { const [hx, hy] = m(p.h); cx.fillStyle = col; [-1, 1].forEach(k => { cx.beginPath(); cx.moveTo(hx + k * 4 * s, hy - 7 * s); cx.lineTo(hx + k * 12 * s, hy - 22 * s); cx.lineTo(hx + k * 10 * s, hy - 5 * s); cx.closePath(); cx.fill(); }); };
  fig(track([[0, 'think'], [1.2, 'point']], lt), 640, GY, S, { extra: lt > .6 ? horns : null });
  bubble('Il fait beau aujourd\'hui.', 1360, 300, 1330, 460, .1, lt, { size: 40 });
  bubble('Juste pour jouer l\'avocat du diable… prouve-le!', 640, 280, 650, 450, 1.0, lt, { size: 50, maxW: 760 });
  title('L\'AVOCAT DU DIABLE', 90, 120, 96, .05, lt, { rot: -2 });
  tag('FAIT', 'contredit tout, même ce qu\'il pense', 90, 1000, 1.4, lt);
});

// ---- DROP 2 ----
// Bâtisseur : reformule et construit un pont
scene(22, 24, (lt, t) => {
  bg(); ground();
  const done = lt > 2.6;
  const j = done ? Math.abs(Math.sin(t * 6.7)) * 50 : 0;
  fig(track([[0, 'talk'], [1.2, 'stand'], [2.6, 'jump']], lt), 470, GY - j, S);

window.TOTAL = TOTAL;
window.renderAt = function (t) {
  const sc = SC.find(s => t >= s.s && t < s.e) || SC[SC.length - 1];
  const lt = t - sc.s;
  cx.save();
  // pulsation au rythme pendant les drops
  const z = 1 + pulse(t) * .012 + (t - sc.s) * .004;
  cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2);
  sc.fn(lt, t);
  cx.restore();
  // transition : bande rouge qui balaie au début de chaque scène
  const w = clamp(lt / .22);
  if (w < 1 && t > .1) { cx.fillStyle = RED; cx.fillRect(lerp(0, W, eo(w)), 0, W, H); }
  cx.drawImage(grain, 0, 0);
  // fondus
  const f = Math.max(clamp(1 - t / .5), clamp((t - (TOTAL - .8)) / .8));
  if (f > 0) { cx.fillStyle = `rgba(239,230,209,${f})`; cx.fillRect(0, 0, W, H); }
};
