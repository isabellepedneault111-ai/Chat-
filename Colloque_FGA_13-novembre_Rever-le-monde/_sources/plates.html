<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Caveat;src:url(fonts/Caveat-SemiBold.ttf)}
@font-face{font-family:Marker;src:url(fonts/PermanentMarker-Regular.ttf)}
body{margin:0;background:transparent;font-family:Anton}
.plate{display:inline-block;padding:0;margin:20px;background:transparent}
svg text{font-family:Anton;fill:#1E1A22}
.hand{font-family:Caveat}
.mk{font-family:Marker}
.ink{stroke:#1E1A22;stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.ink4{stroke:#1E1A22;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#1E1A22" stroke-width="3"/></pattern>
  <pattern id="hatchL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1E1A22" stroke-width="2"/></pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.6" fill="#1E1A22"/></pattern>
  <pattern id="dotsP" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.4" fill="#5B2A86"/></pattern>
  <pattern id="dotsY" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#E7B91A"/></pattern>
 </defs>
</svg>

<!-- 1. Affiche de couverture : soleil rayonnant -->
<div class="plate" id="cover">
<svg width="1200" height="700" viewBox="0 0 1200 700">
 <rect x="8" y="8" width="1184" height="684" fill="#5B2A86" class="ink"/>
 <g transform="translate(600,760)">
  <g id="rays"></g>
 </g>
 <rect x="8" y="8" width="1184" height="684" fill="url(#dots)" opacity=".18"/>
 <!-- soleil / globe -->
 <circle cx="600" cy="700" r="250" fill="#F2C230" class="ink"/>
 <path d="M370 640 A250 250 0 0 1 520 470" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".8"/>
 <path d="M600 450 A250 250 0 0 1 850 700 L780 700 A180 180 0 0 0 600 520 Z" fill="url(#hatch)"/>
 <!-- continents stylisés -->
 <g fill="none" class="ink4"><ellipse cx="600" cy="700" rx="110" ry="250"/><line x1="600" y1="450" x2="600" y2="700"/><path d="M372 600 Q600 650 828 600"/><path d="M420 530 Q600 570 780 530"/></g>
 <path d="M500 610 q30 -50 80 -40 q30 10 20 40 q-20 25 -50 20 q-35 5 -50 -20z" fill="#5B2A86" class="ink4"/>
 <!-- papillons adhésifs -->
 <g transform="translate(150,90) rotate(-8)"><rect width="210" height="150" fill="#F2C230" class="ink"/><rect x="0" y="150" width="210" height="14" fill="#1E1A22" opacity=".25"/><text x="18" y="62" class="hand" font-size="40" style="font-family:Caveat">ça me</text><text x="18" y="112" class="hand" font-size="48" style="font-family:Caveat">dérange…</text></g>
 <g transform="translate(850,70) rotate(7)"><rect width="230" height="160" fill="#FBF8EF" class="ink"/><rect x="0" y="160" width="230" height="14" fill="#1E1A22" opacity=".25"/><text x="20" y="70" font-size="46" style="font-family:Caveat">on l’a</text><text x="20" y="128" font-size="58" style="font-family:Caveat;fill:#5B2A86">fait !</text></g>
 <!-- flèche BD -->
 <path d="M380 210 C 520 120, 690 120, 820 180" fill="none" class="ink" stroke-width="10"/>
 <path d="M800 150 L850 192 L790 214 Z" fill="#1E1A22"/>
 <g stroke="#FBF8EF" stroke-width="5" stroke-linecap="round"><line x1="520" y1="105" x2="540" y2="70"/><line x1="600" y1="98" x2="604" y2="58"/><line x1="680" y1="105" x2="696" y2="68"/></g>
</svg></div>

<!-- 2. Fiche Mon premier pas -->
<div class="plate" id="billet">
<svg width="1100" height="420" viewBox="0 0 1100 420">
 <rect x="26" y="26" width="1060" height="380" fill="url(#hatchL)"/>
 <rect x="10" y="10" width="1060" height="370" fill="#FBF8EF" class="ink"/>
 <rect x="10" y="10" width="1060" height="78" fill="#5B2A86" class="ink"/>
 <text x="36" y="70" font-size="52" style="fill:#F2C230">MON PREMIER PAS</text>
 <text x="455" y="68" font-size="32" style="font-family:Caveat;fill:#FBF8EF">moi, comme intervenant·e, de retour dans mon milieu</text>
 <g transform="translate(36,0)">
  <circle cx="22" cy="150" r="22" fill="#F2C230" class="ink4"/><text x="22" y="162" font-size="30" text-anchor="middle">1</text>
  <text x="62" y="142" font-size="22" style="fill:#6B6472;letter-spacing:3px">MON ACTION (UN VERBE !)</text>
  <line x1="62" y1="200" x2="980" y2="200" stroke="#C3BACB" stroke-width="3" stroke-dasharray="4 8"/>
  <circle cx="22" cy="262" r="22" fill="#F2C230" class="ink4"/><text x="22" y="274" font-size="30" text-anchor="middle">2</text>
  <text x="62" y="254" font-size="22" style="fill:#6B6472;letter-spacing:3px">QUAND</text>
  <line x1="62" y1="310" x2="420" y2="310" stroke="#C3BACB" stroke-width="3" stroke-dasharray="4 8"/>
  <circle cx="482" cy="262" r="22" fill="#F2C230" class="ink4"/><text x="482" y="274" font-size="30" text-anchor="middle">3</text>
  <text x="522" y="254" font-size="22" style="fill:#6B6472;letter-spacing:3px">AVEC QUI (MON ALLIÉ)</text>
  <line x1="522" y1="310" x2="800" y2="310" stroke="#C3BACB" stroke-width="3" stroke-dasharray="4 8"/>
 </g>
 <g transform="translate(960,300) rotate(-12)">
  <circle r="66" fill="#F2C230" class="ink"/><circle r="52" fill="none" class="ink4" stroke-dasharray="6 6"/>
  <text x="0" y="-6" font-size="22" text-anchor="middle">COLLOQUE</text>
  <text x="0" y="22" font-size="22" text-anchor="middle" style="fill:#5B2A86">13·11·26</text>
 </g>
</svg></div>

<!-- 3. Maison à 3 étages -->
<div class="plate" id="maison">
<svg width="900" height="900" viewBox="0 0 900 900">
 <path d="M170 880 L700 880 L760 830 L760 330 L700 380 Z" fill="url(#hatch)" class="ink"/>
 <path d="M140 300 L450 70 L760 300 Z" fill="#5B2A86" class="ink"/>
 <path d="M450 70 L760 300 L700 330 L450 140 Z" fill="url(#hatch)" opacity=".6"/>
 <!-- étages -->
 <rect x="170" y="300" width="530" height="190" fill="#F2C230" class="ink"/>
 <rect x="170" y="490" width="530" height="190" fill="#5B2A86" class="ink"/>
 <rect x="170" y="680" width="530" height="200" fill="#FBF8EF" class="ink"/>
 <!-- escalier -->
 <path d="M600 880 h40 v-40 h40 v-40 h20 M600 680 h40 v-40 h40 v-40 h20" stroke="#FBF8EF M600 490 h40 v-40 h40 v-40 h20" fill="none" class="ink4"/>
 <!-- tiroirs 3e -->
 <g transform="translate(200,340)">
  <rect width="110" height="120" fill="#FBF8EF" class="ink4"/><line x1="0" y1="40" x2="110" y2="40" class="ink4"/><line x1="0" y1="80" x2="110" y2="80" class="ink4"/>
  <circle cx="55" cy="20" r="5" fill="#1E1A22"/><circle cx="55" cy="60" r="5" fill="#1E1A22"/><circle cx="55" cy="100" r="5" fill="#1E1A22"/>
 </g>
 <text x="340" y="370" font-size="44">3E ÉTAGE</text>
 <text x="340" y="420" font-size="36" style="font-family:Caveat">j’apprends, je classe</text>
 <text x="340" y="460" font-size="36" style="font-family:Caveat">dans mes tiroirs</text>
 <!-- cœur 2e -->
 <path d="M255 600 c-60 -40 -60 -90 -20 -95 c20 -2 30 10 35 22 c5 -12 15 -24 35 -22 c40 5 40 55 -20 95 z" transform="translate(-30,-30) scale(1.1)" fill="#F2C230" class="ink4"/>
 <text x="340" y="560" font-size="44" style="fill:#F2C230">2E ÉTAGE</text>
 <text x="340" y="610" font-size="36" style="font-family:Caveat;fill:#FBF8EF">je me sens bien,</text>
 <text x="340" y="650" font-size="36" style="font-family:Caveat;fill:#FBF8EF">j’ai ma place</text>
 <!-- lit + assiette 1er -->
 <g transform="translate(195,760)"><rect width="110" height="34" fill="#5B2A86" class="ink4"/><rect x="0" y="-26" width="34" height="26" fill="#FBF8EF" class="ink4"/><line x1="0" y1="34" x2="0" y2="60" class="ink4"/><line x1="110" y1="34" x2="110" y2="60" class="ink4"/></g>
 <ellipse cx="250" cy="730" rx="40" ry="14" fill="#F2C230" class="ink4"/>
 <text x="340" y="750" font-size="44">1ER ÉTAGE</text>
 <text x="340" y="800" font-size="36" style="font-family:Caveat">j’ai dormi, mangé,</text>
 <text x="340" y="840" font-size="36" style="font-family:Caveat">je suis en sécurité</text>
 <!-- porte -->
 <rect x="560" y="780" width="0" height="0"/>
 <text x="60" y="890" font-size="0">.</text>
</svg></div>

<!-- 4. Du GN au GV -->
<div class="plate" id="gngv">
<svg width="1200" height="520" viewBox="0 0 1200 520">
 <rect x="30" y="80" width="470" height="300" fill="url(#hatchL)"/>
 <rect x="16" y="66" width="470" height="300" fill="#FBF8EF" class="ink"/>
 <text x="40" y="120" font-size="30" style="fill:#5B2A86;letter-spacing:2px">RÉSULTAT = UN NOM (GN)</text>
 <text x="40" y="190" font-size="40" style="font-family:Caveat">une</text>
 <rect x="104" y="150" width="190" height="56" fill="#F2C230" class="ink4"/>
 <text x="116" y="192" font-size="44" style="font-family:Caveat;font-weight:700">cafétéria</text>
 <text x="304" y="190" font-size="40" style="font-family:Caveat">sans déchets</text>
 <text x="40" y="250" font-size="40" style="font-family:Caveat">où chacun mange à sa faim</text>
 <text x="160" y="145" font-size="18" style="fill:#5B2A86" text-anchor="middle">NOYAU</text>
 <path d="M300 205 q60 30 140 0" fill="none" class="ink4" stroke-dasharray="6 6"/>
 <text x="320" y="300" font-size="20" style="fill:#5B2A86">EXPANSIONS</text>
 <text x="40" y="345" font-size="30" style="font-family:Caveat;fill:#6B6472">→ le rêve, la vision</text>
 <!-- flèche BD -->
 <path d="M510 230 L640 230 L640 190 L720 250 L640 310 L640 270 L510 270 Z" fill="#F2C230" class="ink"/>
 <g stroke="#1E1A22" stroke-width="5" stroke-linecap="round"><line x1="520" y1="180" x2="580" y2="180"/><line x1="500" y1="330" x2="560" y2="330"/></g>
 <text x="520" y="400" font-size="34" style="font-family:Caveat">trouver le nom d’action :</text>
 <text x="520" y="440" font-size="34" style="font-family:Caveat"><tspan style="fill:#5B2A86;font-weight:700">réduction</tspan> → <tspan style="fill:#5B2A86;font-weight:700">réduire</tspan></text>
 <rect x="752" y="80" width="430" height="300" fill="url(#hatchL)"/>
 <rect x="738" y="66" width="430" height="300" fill="#F2C230" class="ink"/>
 <text x="762" y="120" font-size="30" style="fill:#5B2A86;letter-spacing:2px">ACTION = UN VERBE (GV)</text>
 <text x="762" y="190" font-size="40" style="font-family:Caveat">Notre groupe</text>
 <rect x="972" y="150" width="150" height="56" fill="#5B2A86" class="ink4"/>
 <text x="984" y="193" font-size="46" style="font-family:Caveat;fill:#FBF8EF;font-weight:700">réduit</text>
 <text x="762" y="250" font-size="40" style="font-family:Caveat">les déchets de la cafétéria</text>
 <text x="762" y="300" font-size="40" style="font-family:Caveat">d’ici le 20 décembre.</text>
 <text x="762" y="345" font-size="30" style="font-family:Caveat;fill:#6B6472">→ qui ? fait quoi ? quand ?</text>
</svg></div>

<!-- 5. Pyramide de l'apprentissage -->
<div class="plate" id="pyramide">
<svg width="980" height="700" viewBox="0 0 980 700">
 <path d="M430 40 L820 660 L40 660 Z" fill="url(#hatchL)" transform="translate(12,12)"/>
 <clipPath id="tri"><path d="M430 40 L820 660 L40 660 Z"/></clipPath>
 <g clip-path="url(#tri)">
  <rect x="0" y="40" width="900" height="106" fill="#FBF8EF"/><rect x="0" y="146" width="900" height="94" fill="#FBF8EF"/>
  <rect x="0" y="240" width="900" height="94" fill="#FBF8EF"/><rect x="0" y="240" width="900" height="94" fill="url(#dotsY)"/><rect x="0" y="334" width="900" height="94" fill="#F2C230"/>
  <rect x="0" y="428" width="900" height="94" fill="#F2C230"/><rect x="0" y="428" width="900" height="94" fill="url(#hatch)" opacity=".35"/><rect x="0" y="522" width="900" height="138" fill="#5B2A86"/>
 </g>
 <path d="M430 40 L820 660 L40 660 Z" fill="none" class="ink4"/>
 <g stroke="#1E1A22" stroke-width="2.5" opacity=".5"><line x1="363" y1="146" x2="497" y2="146"/><line x1="304" y1="240" x2="556" y2="240"/><line x1="245" y1="334" x2="615" y2="334"/><line x1="186" y1="428" x2="674" y2="428"/><line x1="127" y1="522" x2="733" y2="522"/></g>
 <g font-size="27" text-anchor="middle">
  <text x="430" y="128">ÉCOUTER</text><text x="430" y="203">LIRE</text><text x="430" y="297">VOIR, OBSERVER</text>
  <text x="430" y="391">DISCUTER</text><text x="430" y="485">FAIRE, PRATIQUER</text><text x="430" y="602" style="fill:#FBF8EF">ENSEIGNER AUX AUTRES</text>
 </g>
 <!-- flèche passif -> actif -->
 <path d="M880 110 L880 600" class="ink4" stroke-width="5"/><path d="M862 590 L880 630 L898 590 Z" fill="#5B2A86"/>
 <text x="905" y="140" font-size="30" style="font-family:Caveat;fill:#6B6472">passif</text>
 <text x="905" y="620" font-size="34" style="font-family:Caveat;fill:#5B2A86;font-weight:700">actif</text>
 <text x="40" y="40" font-size="32" style="font-family:Caveat;fill:#5B2A86">plus on fait, plus on retient</text>
</svg></div>

<!-- 6. Les 4 sphères -->
<div class="plate" id="spheres">
<svg width="1000" height="840" viewBox="0 0 1000 840">
 <ellipse cx="500" cy="380" rx="420" ry="250" fill="none" class="ink4" stroke-dasharray="10 10"/>
 <ellipse cx="500" cy="380" rx="250" ry="140" fill="none" class="ink4" stroke-dasharray="10 10"/>
 <!-- étoile centrale -->
 <path d="M500 300 L522 356 L582 358 L535 394 L552 452 L500 418 L448 452 L465 394 L418 358 L478 356 Z" fill="#F2C230" class="ink"/>
 <text x="500" y="500" font-size="34" text-anchor="middle">L’ÉLÈVE</text>
 <g id="planets"></g>
</svg></div>

<!-- 7. Escalier de l'Incubateur -->
<div class="plate" id="escalier">
<svg width="1200" height="620" viewBox="0 0 1200 620">
 <g id="steps"></g>
 <g transform="translate(1090,90)"><line x1="0" y1="0" x2="0" y2="40" class="ink"/><path d="M0 0 L90 22 L0 50 Z" fill="#F2C230" class="ink4"/></g>
 <text x="760" y="60" font-size="44" style="font-family:Marker;fill:#5B2A86">on l’a fait !</text>
</svg></div>

<!-- 8. Jetons -->
<div class="plate" id="jetons">
<svg width="900" height="300" viewBox="0 0 900 300">
 <g id="coins"></g>
</svg></div>

<script>
// rayons du soleil (couverture)
const rays=document.getElementById('rays');
for(let i=0;i<18;i++){const a=Math.PI+i*Math.PI/17.5, a2=a+Math.PI/38;
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',`M0 0 L${Math.cos(a)*1200} ${Math.sin(a)*1200} L${Math.cos(a2)*1200} ${Math.sin(a2)*1200} Z`);
 p.setAttribute('fill',i%2?'#7A45AB':'#4A1F70');rays.appendChild(p);}
// planètes
const pl=[['AFFECTIVE','motivation, confiance',190,170,'#F2C230'],['COGNITIVE','stratégies actives',810,190,'#5B2A86'],['COMPORTEMENTALE','persévérance, régularité',190,600,'#5B2A86'],['CITOYENNE','agir dans son milieu',800,590,'#F2C230']];
const g=document.getElementById('planets');
pl.forEach(([n,s,x,y,c])=>{g.insertAdjacentHTML('beforeend',`
 <circle cx="${x+10}" cy="${y+10}" r="92" fill="url(#hatchL)"/>
 <circle cx="${x}" cy="${y}" r="92" fill="${c}" class="ink"/>
 <path d="M${x+20} ${y-90} A92 92 0 0 1 ${x+20} ${y+90} A70 92 0 0 0 ${x+20} ${y-90}Z" fill="url(#hatch)" opacity=".75"/>
 <path d="M${x-55} ${y-40} q15 -30 45 -38" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
 <text x="${x}" y="${y+130}" font-size="36" text-anchor="middle">${n}</text>
 <text x="${x}" y="${y+166}" font-size="28" text-anchor="middle" style="font-family:Caveat">${s}</text>`)});
// escalier
const st=[['ÇA ME DÉRANGE','choisir'],['JE RÊVE','se fixer un but'],['JE CIBLE','décider'],['J’AGIS','résoudre'],['JE REGARDE LE CHEMIN','s’autoévaluer']];
const sg=document.getElementById('steps');
st.forEach(([t,s],i)=>{const w=200,x=40+i*210,h=170+i*75,y=600-h;
 const c=i%2?'#5B2A86':'#F2C230', tc=i%2?'#FBF8EF':'#1E1A22', nc=i%2?'#F2C230':'#5B2A86';
 sg.insertAdjacentHTML('beforeend',`<rect x="${x+12}" y="${y+12}" width="${w}" height="${h}" fill="url(#hatchL)"/>
 <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" class="ink"/>
 <rect x="${x+w-40}" y="${y}" width="40" height="${h}" fill="url(#hatch)" opacity="${i%2?0:.7}"/>
 <text x="${x+18}" y="${y+76}" font-size="74" style="fill:${nc}">${i+1}</text>
 <text x="${x+18}" y="${y+h-48}" font-size="${t.length>14?20:26}" style="fill:${tc}">${t}</text>
 <text x="${x+18}" y="${y+h-16}" font-size="30" style="font-family:Caveat;fill:${tc}">${s}</text>`)});
// jetons
const co=[['IMPACT','#F2C230','I'],['FAISABILITÉ','#D9541E','F'],['ORIGINALITÉ','#5B2A86','O']];
const cg=document.getElementById('coins');
co.forEach(([n,c,l],i)=>{const x=150+i*300;
 cg.insertAdjacentHTML('beforeend',`<ellipse cx="${x+8}" cy="${138}" rx="100" ry="100" fill="url(#hatchL)"/>
 <circle cx="${x}" cy="130" r="100" fill="${c}" class="ink"/><circle cx="${x}" cy="130" r="78" fill="none" stroke="${i==0?'#1E1A22':'#FBF8EF'}" stroke-width="4" stroke-dasharray="7 7"/>
 <text x="${x}" y="168" font-size="110" text-anchor="middle" style="fill:${i==0?'#1E1A22':'#FBF8EF'}">${l}</text>
 <text x="${x}" y="280" font-size="34" text-anchor="middle">${n}</text>`)});
</script>
</body></html>
