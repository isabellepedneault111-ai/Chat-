<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Affiche · Mur d’enjeux</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Caveat;src:url(fonts/Caveat-SemiBold.ttf)}
@page{size:11in 17in;margin:0}
:root{--ink:#1E1A22;--paper:#FBF8EF;--mauve:#5B2A86;--gold:#F2C230;--orange:#D9541E}
*{box-sizing:border-box}
html,body{margin:0;width:11in;height:17in;background:var(--paper);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:11in;height:17in;overflow:hidden;padding:.55in .6in .5in;display:flex;flex-direction:column;
  background-image:radial-gradient(rgba(91,42,134,.13) 1.3px,transparent 1.5px);background-size:12px 12px}
.band{position:absolute;inset:0 0 auto;height:.32in;background:var(--mauve);border-bottom:5px solid var(--ink)}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:.12in;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:13pt;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve)}
.top b{background:var(--ink);color:var(--gold);padding:4px 10px;letter-spacing:.1em}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;margin:.14in 0 0;line-height:1.02;font-size:70pt;letter-spacing:.005em}
h1 .l2{display:block;font-size:112pt;color:var(--mauve);line-height:1.02}
h1 .l3{display:block}
h1 .hl{background:var(--gold);padding:0 .1in;border:5px solid var(--ink);box-shadow:10px 10px 0 var(--ink);display:inline-block;transform:rotate(-1.5deg);margin-top:.08in}
.how{display:flex;gap:.25in;margin:.3in 0 0;font-family:Caveat,cursive;font-size:28pt;line-height:1}
.how span{display:flex;align-items:center;gap:.1in}
.how i{font-style:normal;font-family:Anton;font-size:22pt;width:.5in;height:.5in;display:grid;place-items:center;background:var(--ink);color:var(--gold);border-radius:50%}
.venn{flex:1;position:relative;margin-top:.05in}
.venn svg{position:absolute;inset:0;width:100%;height:100%}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:Arial,sans-serif;font-size:11pt;color:#4A4352}
.foot .logos{display:flex;gap:.15in;align-items:center}
.foot img{height:.62in;background:#fff;border:3px solid var(--ink);padding:4px 7px}
.foot .h{font-family:Caveat,cursive;font-size:26pt;color:var(--mauve)}
</style></head><body><div class="page">
<div class="band"></div>
<div class="top"><span>Colloque régional FGA · 13 novembre 2026</span><b>Mur d’enjeux</b></div>
<h1><span class="l1">Qu’est-ce qui</span><span class="l2">vous dérange</span><span class="l3">dans le monde,</span><span class="hl">ici ou ailleurs ?</span></h1>
<div class="how"><span><i>1</i>Un enjeu par post-it</span><span><i>2</i>Collez-le dans le cercle qui lui ressemble</span></div>
<div class="venn"><svg viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" aria-label="Trois cercles : école, communauté, environnement">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="2.2" fill="#1E1A22" opacity=".16"/></pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1E1A22" stroke-width="2" opacity=".18"/></pattern>
  </defs>
  <g stroke="#1E1A22" stroke-width="7">
    <circle cx="320" cy="310" r="300" fill="#F2C230"/>
    <circle cx="680" cy="310" r="300" fill="#5B2A86" fill-opacity=".85"/>
    <circle cx="500" cy="590" r="300" fill="#FFFDF7" fill-opacity=".88"/>
  </g>
  <g fill="none" stroke="#1E1A22" stroke-width="7">
    <circle cx="320" cy="310" r="300"/><circle cx="680" cy="310" r="300"/><circle cx="500" cy="590" r="300"/>
  </g>
  <circle cx="320" cy="310" r="300" fill="url(#dots)"/>
  <circle cx="500" cy="590" r="300" fill="url(#hatch)"/>
  <g font-family="Anton" text-anchor="middle">
    <g transform="translate(235 150)"><rect x="-120" y="-44" width="240" height="62" fill="#1E1A22"/><text y="6" font-size="46" fill="#F2C230" letter-spacing="2">ÉCOLE</text></g>
    <text x="235" y="212" font-family="Caveat" font-size="34" fill="#1E1A22">le centre, la classe</text>
    <g transform="translate(765 150)"><rect x="-170" y="-44" width="340" height="62" fill="#1E1A22"/><text y="6" font-size="46" fill="#F2C230" letter-spacing="2">COMMUNAUTÉ</text></g>
    <text x="765" y="212" font-family="Caveat" font-size="34" fill="#FFFFFF">le quartier, la ville</text>
    <g transform="translate(500 820)"><rect x="-200" y="-44" width="400" height="62" fill="#1E1A22"/><text y="6" font-size="46" fill="#F2C230" letter-spacing="2">ENVIRONNEMENT</text></g>
    <text x="500" y="762" font-family="Caveat" font-size="34" fill="#1E1A22">la nature, le territoire</text>
    <g transform="translate(500 420) rotate(-4)"><rect x="-88" y="-38" width="176" height="62" fill="#D9541E" stroke="#1E1A22" stroke-width="5"/><text y="10" font-size="40" fill="#FFFFFF" letter-spacing="1">LES TROIS</text></g>
  </g>
</svg></div>
<div class="foot"><span class="h">Ce que vous venez de faire, c’est la première marche.</span><div class="logos"><img src="img/logo_cfga.png" alt="CFGA De La Jonquière"><img src="img/logo_csi.png" alt="Centre de solidarité internationale"></div></div>
</div></body></html>
