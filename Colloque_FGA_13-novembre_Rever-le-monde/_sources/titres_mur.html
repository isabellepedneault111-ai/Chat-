<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}@font-face{font-family:Caveat;src:url(fonts/Caveat-SemiBold.ttf)}
@page{size:17in 11in;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:#1E1A22;-webkit-print-color-adjust:exact;print-color-adjust:exact}

<section class="p"><p class="k">Colloque régional FGA · 13 novembre 2026</p><h1>Ce qui me<br><span>préoccupe</span></h1><p class="s">ou me dérange, dans mon milieu</p><p class="f">Un post-it, une idée.</p></section>
<section class="p"><p class="k">Colloque régional FGA · 13 novembre 2026</p><h1>Mon monde<br><span>idéal</span></h1><p class="s">Sans limite.</p><p class="l"><span>de territoire</span><span>de ressources humaines</span><span>de ressources matérielles</span></p></section>
