<style>
/* Générateur d'invite Copilot : utilisé sur la diapo 14 et dans la page Ressources */
.cg{--c-ink:#1E1A22;--c-paper:#FFFDF7;--c-mauve:#5B2A86;--c-gold:#F2C230;--c-muted:#5E566A;--c-hair:#D8CFE3;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(14px,2.4vw,28px);align-items:start;font-family:"Cambria","Georgia",serif;color:var(--c-ink);text-align:left}
.cg *{box-sizing:border-box}
.cg-step{border:3px solid var(--c-ink);background:var(--c-paper);margin:0 0 14px;padding:12px 14px 14px;min-width:0}
.cg-step legend{display:flex;align-items:center;gap:8px;padding:0 6px;font-family:"Anton","Impact",sans-serif;font-size:20px;letter-spacing:.02em;text-transform:uppercase;color:var(--c-mauve)}
.cg-step legend b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c-mauve);color:#fff;font-weight:400;font-size:17px}
.cg-help{margin:0 0 8px;font-size:15.5px;line-height:1.35;color:var(--c-muted)}
.cg-help strong{color:var(--c-ink)}
.cg-lab{display:block;margin:10px 0 4px;font-family:"Arial",sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c-ink)}
.cg input[type=text],.cg select,.cg textarea{width:100%;font-family:"Arial",sans-serif;font-size:16px;line-height:1.35;color:var(--c-ink);background:#fff;border:2px solid var(--c-ink);padding:8px 10px;border-radius:0}
.cg textarea{resize:vertical}
.cg input:focus,.cg select:focus,.cg textarea:focus{outline:3px solid var(--c-gold);outline-offset:1px}
.cg-chips{display:flex;flex-wrap:wrap;gap:6px}
.cg-chips button{font-family:"Arial",sans-serif;font-size:14px;line-height:1.2;background:#fff;color:var(--c-ink);border:2px dashed var(--c-muted);padding:5px 10px;cursor:pointer;text-align:left}
.cg-chips button:hover{border-color:var(--c-ink)}
.cg-chips button[aria-pressed=true]{background:var(--c-gold);border:2px solid var(--c-ink);font-weight:700}
.cg-chips button[aria-pressed=true]::before{content:"✓ "}
.cg-row{display:flex;gap:6px}
.cg-row input{flex:1}
.cg-btn{font-family:"Anton","Impact",sans-serif;font-size:17px;letter-spacing:.02em;background:var(--c-gold);color:var(--c-ink);border:3px solid var(--c-ink);padding:6px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--c-ink);text-decoration:none;display:inline-block}
.cg-btn.alt{background:#fff}
.cg-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--c-ink)}
.cg-tags{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cg-tag{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:2px solid var(--c-ink);background:#F7EFFC;padding:6px 8px}
.cg-tag b{font-family:"Arial",sans-serif;font-size:15px}
.cg-tag small{grid-column:1;font-family:"Arial",sans-serif;font-size:13px;color:var(--c-muted)}
.cg-tag small a{color:var(--c-mauve);font-weight:700}
.cg-tag button{grid-row:1 / span 2;grid-column:2;border:2px solid var(--c-ink);background:#fff;font-size:15px;width:30px;height:30px;cursor:pointer}
.cg-try{margin:10px 0 0;font-family:"Arial",sans-serif;font-size:14px}
.cg-try a{color:var(--c-mauve);font-weight:700;margin-right:8px;white-space:nowrap;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cg-browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px;max-height:320px;overflow:auto}
.cg-browse button{text-align:left;font-family:"Arial",sans-serif;font-size:13.5px;line-height:1.25;background:#fff;border:2px solid var(--c-hair);padding:6px 8px;cursor:pointer;color:var(--c-ink)}
.cg-browse button:hover{border-color:var(--c-ink);background:#FFF6D6}
.cg-browse button b{display:block;color:var(--c-mauve)}
.cg-tf{margin-top:8px;border-left:4px solid var(--c-gold);padding:4px 0 6px 12px;background:#FFFBEA}
.cg-tfh{margin:4px 0 2px;font-family:"Arial",sans-serif;font-weight:700;font-size:13.5px;color:var(--c-mauve)}
.cg-tf:empty{display:none}
.cg details{margin-top:10px}
.cg summary{cursor:pointer;font-family:"Arial",sans-serif;font-weight:700;font-size:14px;color:var(--c-mauve)}
.cg-formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-bottom:8px}
.cg-formats button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;background:#fff;border:2px dashed var(--c-muted);cursor:pointer;font-family:"Arial",sans-serif;font-size:14px;font-weight:700;color:var(--c-ink);text-align:center;line-height:1.15}
.cg-formats button i{font-style:normal;font-size:24px;line-height:1}
.cg-formats button[aria-pressed=true]{background:var(--c-gold);border:3px solid var(--c-ink);box-shadow:3px 3px 0 var(--c-ink)}
.cg-out{position:sticky;top:12px}
.cg-prog{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;padding:0;list-style:none}
.cg-prog button{font-family:"Arial",sans-serif;font-weight:700;font-size:13.5px;background:#fff;border:2px solid var(--c-ink);padding:5px 9px;cursor:pointer;color:var(--c-ink)}
.cg-prog button.done{background:var(--c-gold)}
.cg-prog button[aria-current=step]{background:var(--c-mauve);color:#fff;box-shadow:3px 3px 0 var(--c-ink)}
.cg-form .cg-step{display:none}.cg-form .cg-step.on{display:block}
.cg-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 0}
.cg-nav span{font-family:"Arial",sans-serif;font-weight:700;font-size:14px;color:var(--c-mauve)}
.cg-blab{margin:10px 0 4px;font-family:"Arial",sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.cg-pdf{margin-top:12px;border:2px dashed var(--c-ink);padding:8px 10px;background:#FFF6D6}
.cg-pdf ol{margin:8px 0 0;padding-left:1.3em;font-size:15px;line-height:1.4}
.cg-out.flash .cg-pre{outline:4px solid var(--c-gold)}
.cg-pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:"Consolas","Courier New",monospace;font-size:14px;line-height:1.45;background:#fff;border:3px solid var(--c-ink);padding:12px 14px;max-height:min(68vh,640px);overflow:auto;box-shadow:6px 6px 0 var(--c-mauve)}
.cg-pre .pl{display:block;white-space:pre-wrap;margin-bottom:10px;border-left:4px solid transparent;padding-left:6px;transition:background .6s,border-color .6s}
.cg-pre .pl b{color:var(--c-mauve)}
.cg-pre .pl.hot{background:#FFF3C4;border-left-color:var(--c-gold)}
.cg-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.cg-msg{font-family:"Arial",sans-serif;font-weight:700;color:var(--c-mauve)}
.cg-next{border:2px solid var(--c-ink);background:#FFF6D6;padding:10px 12px;font-size:15px}
.cg-next b{font-family:"Anton","Impact",sans-serif;font-weight:400;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.cg-next ul{margin:6px 0 0;padding-left:1.1em}
.cg-warn{font-size:14px;color:var(--c-muted);margin:10px 0 0}
@media (max-width:860px){.cg{grid-template-columns:1fr}.cg-out{position:static}}
</style>

        <span class="cg-lab">Notre enjeu ou notre projet</span><input type="text" id="${id}e" placeholder="ex. nos élèves ne connaissent pas les organismes du quartier">
        <span class="cg-lab">Le temps qu’on a, en classe</span><div class="cg-chips" data-g="tps">${chips(TEMPS, 'tps')}</div></fieldset>
      <fieldset class="cg-step"><legend><b>3</b>Mes sigles</legend>

        <details class="cg-pdf"><summary>Mon sigle dit « Contenu à joindre » : comment joindre le PDF ?</summary><ol><li>Sur l’étiquette du sigle, touchez « page officielle ↗ ». Ex. : FRA-2101 ouvre la page du français.</li><li>Téléchargez le programme d’études et la DDE de votre sigle.</li><li>Dans Copilot, touchez le trombone (ou le +), puis « Charger » : choisissez les deux PDF.</li><li>Collez votre invite, puis envoyez.</li></ol></details></fieldset>
      <fieldset class="cg-step"><legend><b>4</b>La tâche</legend>

        <input type="text" id="${id}kx" placeholder="Écrivez votre tâche" hidden>
        <div class="cg-tf" id="${id}tf"></div>
        <span class="cg-lab">Autre chose à savoir (facultatif)</span><textarea id="${id}n" rows="2" placeholder="ex. Deux élèves lisent difficilement ; le local a un TNI."></textarea>

      <fieldset class="cg-step"><legend><b>5</b>Cliquez le format attendu</legend>
        <div class="cg-formats">${FORMATS.map(([n, ic], i) => `<button type="button" data-fmt="${i}" aria-pressed="${i === 0}"><i aria-hidden="true">${ic}</i>${esc(n)}</button>`).join('')}</div>
        <span class="cg-lab">La mise en forme demandée (modifiable)</span><textarea id="${id}f" rows="3"></textarea></fieldset>
      <fieldset class="cg-step"><legend><b>6</b>Ce qu’on demande en plus à Copilot</legend>
        <p class="cg-help">Ces consignes s’adressent à l’IA. <strong>Ouvrir</strong> pour chercher plus large, <strong>resserrer</strong> pour choisir et vérifier. Un bon échange fait les deux, dans cet ordre.</p>
        <span class="cg-lab">↔ Ouvrir (expansion)</span><div class="cg-chips" data-g="trucs">${TRUCS.map((t, i) => t[2] === 'e' ? `<button type="button" data-trucs="${i}" aria-pressed="false">${esc(t[0])}</button>` : '').join('')}</div>
        <span class="cg-lab">→← Resserrer (restriction)</span><div class="cg-chips" data-g="trucs">${TRUCS.map((t, i) => t[2] === 'r' ? `<button type="button" data-trucs="${i}" aria-pressed="false">${esc(t[0])}</button>` : '').join('')}</div></fieldset>
    </div>
    <div class="cg-out"><pre class="cg-pre" id="${id}o" aria-live="polite"></pre>
      <div class="cg-acts"><button type="button" class="cg-btn" id="${id}c">Copier l’invite</button><a class="cg-btn alt" href="https://m365.cloud.microsoft/chat" target="_blank" rel="noopener">Ouvrir Copilot ↗</a><span class="cg-msg" id="${id}m"></span></div>
      <div class="cg-next"><b>Après sa réponse, relancez</b><ul><li>« Plus court. »</li><li>« Pour un élève qui lit difficilement. »</li><li>« Qu’est-ce qui manque pour que ce soit évaluable ? »</li><li>« Ajoute un exemple réussi et un exemple à améliorer. »</li></ul></div>
      <p class="cg-warn">Jamais de nom d’élève, de diagnostic ni de résultat identifiable dans une invite. Copilot propose, vous disposez : vérifiez chaque lien avec le programme.</p></div></div>`;
    const q = s => root.querySelector(s), $id = s => q('#' + id + s);
    let plain = '';
    $id('f').value = st.fmtTxt;
    const sync = () => { root.querySelectorAll('[data-g] button').forEach(b => { const g = b.parentNode.dataset.g, i = +b.dataset[g]; const on = g === 'trucs' ? st[g].has(i) : st[g] === i; b.setAttribute('aria-pressed', String(on)); });
      root.querySelectorAll('[data-fmt]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.fmt === st.fmt))); };
    function drawTags() { $id('t').innerHTML = st.sig.map(k => { const e = SIG[k]; return `<div class="cg-tag"><b>${esc(k === 'PPS' || k === 'DHS' ? e.n : k + ' · ' + (e ? e.n : 'hors banque'))}</b><small>${e && e.r ? 'Contenu à joindre · ' : ''}${e && e.x ? 'Extrait à valider · ' : ''}${e && e.u ? `<a href="${esc(e.u)}" target="_blank" rel="noopener">programme ↗</a> · ` : ''}${e && e.d ? `<a href="${esc(e.d)}" target="_blank" rel="noopener">DDE ↗</a>` : `<a href="${esc(pageOf(k))}" target="_blank" rel="noopener">page officielle ↗</a>`}${e && (e.pv || e.nx) ? `<br>${e.pv ? `avant : <a role="button" tabindex="0" data-try="${e.pv}">${e.pv}</a> ` : ''}${e.nx ? `après : <a role="button" tabindex="0" data-try="${e.nx}">${e.nx}</a>` : ''}` : ''}</small><button type="button" data-rm="${k}" aria-label="Retirer ${k}">×</button></div>`; }).join(''); }
    function addSig(raw) { const k = raw.trim().toUpperCase().replace(/\s+/g, '').replace(/^([A-Z]{3})(\w{4})$/, '$1-$2').replace(/-(\w{4})-\d$/, '-$1'); if (!k || st.sig.includes(k)) return; st.sig.push(k);
      if (st.dirty) $id('x').value += '\n\n' + extract(k); else $id('x').value = st.sig.map(extract).join('\n\n'); drawTags(); upd('Extrait du programme'); }
    function rmSig(k) { st.sig = st.sig.filter(s => s !== k); if (!st.dirty) $id('x').value = st.sig.map(extract).join('\n\n'); drawTags(); upd('Extrait du programme'); }
    function drawTF() { const v = $id('k').value, box = $id('tf'); if (v === 'x') { box.innerHTML = ''; return; }
      const ks = TACHES[+v][2] || []; box.innerHTML = ks.length ? '<p class="cg-tfh">Pour cette tâche, Copilot a besoin de :</p>' + ks.map(k => { const [l, ph, area, opts] = F[k];
        if (opts) return `<span class="cg-lab">${esc(l)}</span><div class="cg-chips" data-tf="${k}">${opts.map(o => `<button type="button" data-tfv="${esc(o)}" aria-pressed="${st.tf[k] === o}">${esc(o)}</button>`).join('')}</div>`;
        return `<span class="cg-lab">${esc(l)}</span>` + (area ? `<textarea data-tf="${k}" rows="2" placeholder="${esc(ph)}">${esc(st.tf[k] || '')}</textarea>` : `<input type="text" data-tf="${k}" placeholder="${esc(ph)}" value="${esc(st.tf[k] || '')}">`); }).join('') : ''; }
    function upd(focus) {
      const role = $id('r').value === 'x' ? ($id('rx').value.trim() || '…') : ROLES[+$id('r').value];
      const ctx = ['Mes élèves : ' + (st.el >= 0 ? ELEVES[st.el] : 'des adultes en formation générale des adultes (FGA)') + '.', st.org >= 0 ? 'Organisation : ' + ORGA[st.org] + '.' : '', 'Notre enjeu ou notre projet : ' + ($id('e').value.trim() || '[notre enjeu]') + '.', st.tps >= 0 ? TEMPS[st.tps][1] : ''].filter(Boolean).join(' ');
      const sigs = st.sig.map(k => (k === 'PPS' || k === 'DHS') ? SIG[k].n : k + (SIG[k] ? ' ' + SIG[k].n : '')).join(' ; ');
      const regroup = st.sig.length > 1 ? COMMUN : '';
      const notes = $id('n').value.trim(); const kv = $id('k').value; const need = kv === 'x' ? [] : (TACHES[+kv][2] || []);
      const besoin = need.map(k => F[k][0] + ' : ' + ((st.tf[k] || '').trim() || '[à préciser]')).join('\n');
      const tache = kv === 'x' ? ($id('kx').value.trim() || '…') : TACHES[+kv][1];
      const TE = [...st.trucs].filter(i => TRUCS[i][2] === 'e').sort((a, b) => a - b).map(i => '• ' + TRUCS[i][1]), TR = [...st.trucs].filter(i => TRUCS[i][2] === 'r').sort((a, b) => a - b).map(i => '• ' + TRUCS[i][1]);
      const T = [TE.length ? 'D’abord, ouvre :\n' + TE.join('\n') : '', TR.length ? (TE.length ? 'Puis resserre :\n' : 'Resserre :\n') + TR.join('\n') : ''].filter(Boolean).join('\n');
      const Lx = [['Rôle', role + ' Tu maîtrises la formation générale des adultes au Québec et la pédagogie par projet.'], ['Contexte', ctx], sigs ? ['Sigles visés', sigs] : null,
        ['Source à respecter', 'Appuie-toi uniquement sur l’extrait du programme d’études officiel de la FGA (ministère de l’Éducation du Québec) fourni ci-dessous ou en pièce jointe. Cite le sigle et le nom exact des savoirs. N’ajoute aucune compétence ni aucun savoir absent de l’extrait ; s’il manque quelque chose, écris « à valider dans le programme ».'],
        ['Extrait du programme', $id('x').value.trim() || '[collez ici l’extrait du programme ou joignez le PDF du programme et la DDE de votre sigle]'], besoin ? ['Ce que tu dois savoir pour cette tâche', besoin] : null, notes ? ['Autre chose à savoir', notes] : null, regroup ? ['Plusieurs sigles', regroup] : null, ['Tâche', tache], ['Ancrage pédagogique', ANCRAGE],
        ['Démarche', '1. Repère dans l’extrait les savoirs et les situations de vie qui collent le mieux au projet. 2. Relie chaque marche du projet (ça me dérange, je rêve, je cible, j’agis, je regarde le chemin) à ces savoirs. 3. Vérifie que tout est réalisable par des adultes en FGA dans le temps disponible.'],
        ['Format attendu', $id('f').value.trim() || 'Un tableau clair.'], T ? ['Consignes', T] : null].filter(Boolean);
      plain = Lx.map(([k, t]) => k + ' :\n' + t).join('\n\n');
      $id('o').innerHTML = Lx.map(([k, t]) => `<span class="pl${k === focus ? ' hot' : ''}"><b>${esc(k)} :</b>\n${esc(t)}</span>`).join('');
      if (focus) { const h = $id('o').querySelector('.hot'); if (h) { $id('o').scrollTop = h.offsetTop - 8; setTimeout(() => h.classList.remove('hot'), 1500); } } }
    const form = q('.cg-form'), steps = [...form.querySelectorAll('.cg-step')];
    const prog = document.createElement('ol'); prog.className = 'cg-prog'; prog.setAttribute('aria-label', 'Les étapes');
    prog.innerHTML = steps.map((s, i) => `<li><button type="button" data-step="${i}">${i + 1}. ${['Qui je suis', 'Contexte', 'Sigles', 'Tâche', 'Format', 'Consignes'][i] || ''}</button></li>`).join(''); form.prepend(prog);
    const nav = document.createElement('div'); nav.className = 'cg-nav'; nav.innerHTML = '<button type="button" class="cg-btn alt" data-nav="-1">← Retour</button><span></span><button type="button" class="cg-btn" data-nav="1">Suivant →</button>'; form.appendChild(nav);
    let cur = 0;
    function go(n) { cur = Math.max(0, Math.min(steps.length - 1, n)); steps.forEach((s, i) => s.classList.toggle('on', i === cur));
      prog.querySelectorAll('button').forEach((b, i) => { b.setAttribute('aria-current', i === cur ? 'step' : 'false'); b.classList.toggle('done', i < cur); });
      nav.querySelector('span').textContent = 'Étape ' + (cur + 1) + ' sur ' + steps.length; nav.children[0].style.visibility = cur ? 'visible' : 'hidden';
      nav.children[2].textContent = cur === steps.length - 1 ? '✓ Copier mon invite' : 'Suivant →'; }
    root.addEventListener('click', e => { const b = e.target.closest('button,[data-try]'); if (!b || !root.contains(b)) return;
      if (b.dataset.step !== undefined) { go(+b.dataset.step); return; }
      if (b.dataset.nav) { if (+b.dataset.nav > 0 && cur === steps.length - 1) { $id('c').click(); const o = q('.cg-out'); o.classList.add('flash'); setTimeout(() => o.classList.remove('flash'), 1600); if (o.getBoundingClientRect().top > innerHeight - 80) o.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
        else { go(cur + +b.dataset.nav); if (form.getBoundingClientRect().top < 0) form.scrollIntoView({ block: 'start' }); } return; }
      if (b.dataset.try) { addSig(b.dataset.try); return; }
      if (b.dataset.rm) { rmSig(b.dataset.rm); return; }
      if (b.dataset.fmt !== undefined) { st.fmt = +b.dataset.fmt; $id('f').value = FORMATS[st.fmt][2]; sync(); upd('Format attendu'); return; }
      const g = b.parentNode.dataset && b.parentNode.dataset.g; if (g) { const i = +b.dataset[g]; if (g === 'trucs') { st[g].has(i) ? st[g].delete(i) : st[g].add(i); } else st[g] = st[g] === i ? -1 : i; sync(); upd({ el: 'Contexte', org: 'Contexte', tps: 'Contexte', trucs: 'Consignes' }[g]); } });
    root.addEventListener('keydown', e => { if (e.target.dataset && e.target.dataset.try && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); addSig(e.target.dataset.try); } if (e.target === $id('s') && e.key === 'Enter') { e.preventDefault(); if (hits.length && $id('s').value.trim()) { addSig(hits[0]); $id('s').value = ''; search(); } } });
    const norm = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(), GN = Object.fromEntries(GROUPS);
    let hits = [];
    function search() { const raw = $id('s').value.trim(), n = norm(raw), nc = n.replace(/[\s-]/g, '');
      if (!n) hits = TRY.filter(k => SIG[k]);
      else hits = Object.keys(SIG).filter(k => { const kk = norm(k).replace(/-/g, ''); return kk.startsWith(nc) || norm(SIG[k].n).includes(n) || norm(GN[k.split('-')[0]] || '').includes(n); }).sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
      $id('bl').textContent = !n ? 'Les plus utilisés' : hits.length ? hits.length + (hits.length > 1 ? ' sigles trouvés' : ' sigle trouvé') + (hits.length > 16 ? ' : précisez, ex. « MAT-2 »' : '') : 'Aucun sigle trouvé : collez son extrait plus bas.';
      $id('b').innerHTML = hits.slice(0, 16).map(k => `<button type="button" data-try="${k}"><b>${k === 'PPS' || k === 'DHS' ? k : k}</b> ${esc(SIG[k].n)}</button>`).join(''); }
    $id('s').addEventListener('input', search);
    $id('r').onchange = () => { $id('rx').hidden = $id('r').value !== 'x'; upd('Rôle'); }; $id('rx').oninput = () => upd('Rôle');
    $id('k').onchange = () => { $id('kx').hidden = $id('k').value !== 'x'; drawTF(); upd('Ce que tu dois savoir pour cette tâche'); };
    $id('tf').addEventListener('input', e => { const k = e.target.dataset.tf; if (!k) return; st.tf[k] = e.target.value; upd('Ce que tu dois savoir pour cette tâche'); });
    $id('tf').addEventListener('click', e => { const b = e.target.closest('[data-tfv]'); if (!b) return; const k = b.parentNode.dataset.tf; st.tf[k] = st.tf[k] === b.dataset.tfv ? '' : b.dataset.tfv; b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b && st.tf[k] === b.dataset.tfv))); upd('Ce que tu dois savoir pour cette tâche'); }); $id('kx').oninput = () => upd('Tâche');
    $id('e').oninput = () => upd('Contexte');
    $id('n').oninput = () => upd('Autre chose à savoir');
    $id('x').oninput = () => { st.dirty = true; upd('Extrait du programme'); };
    $id('f').oninput = () => upd('Format attendu');
    $id('c').onclick = () => { const msg = $id('m'); const ok = () => { msg.textContent = 'Copiée !'; setTimeout(() => msg.textContent = '', 2500); };
      const fb = () => { const r = document.createRange(); r.selectNodeContents($id('o')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = 'Sélectionnée : faites Ctrl+C'; };
      try { navigator.clipboard.writeText(plain).then(ok, fb); } catch (err) { fb(); } };
    sync(); drawTF(); upd(); search(); go(0);
  }
  return { mount };
})();
