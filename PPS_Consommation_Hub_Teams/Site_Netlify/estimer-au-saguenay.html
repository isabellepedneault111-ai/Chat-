<!doctype html>
<html lang="fr-CA">
<head>

<title>Estimer au Saguenay</title>
<style>
@font-face{font-family:PH;src:url(fonts/PatrickHand-Regular.ttf)}
@font-face{font-family:NU;src:url(fonts/Nunito-VF.ttf);font-weight:200 1000}
:root{--ard:#4A4F55;--men:#DDF5F2;--rose:#F6D1D6;--mou:#E3BF6A;--beige:#D8C7BB;--or:#C9733A;--or2:#FBE9DC;
--er:#F5C6C2;--erf:#A9372B;--bo:#F6E3A6;--bof:#8A6100;--sa:#CFE9D7;--saf:#2E6B45;--bon:#2E6B45;--mal:#A9372B}
*{box-sizing:border-box}
html,body{background:#FFFDF9}
body{margin:0;font-family:NU,Nunito,Calibri,Arial,sans-serif;color:var(--ard);font-size:19px;line-height:1.45;overflow-x:hidden}
.blob{position:fixed;border-radius:47% 53% 61% 39%/45% 41% 59% 55%;z-index:-1;opacity:.8;pointer-events:none}
main{max-width:860px;margin:0 auto;padding:14px 16px 70px}
h1,h2,h3,.hand{font-family:PH,'Patrick Hand','Segoe Print',cursive;font-weight:400}
h1{font-size:48px;margin:4px 0;line-height:1.08}h2{font-size:32px;margin:2px 0 8px;line-height:1.15}h3{font-size:25px;margin:4px 0}
p{margin:8px 0}.small{font-size:15px}.ctr{justify-content:center}.mt{margin-top:14px}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:16px;padding:12px 20px;background:var(--men);color:var(--ard);box-shadow:0 4px 0 #BFCFCC;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #BFCFCC}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.bin:focus-visible{outline:4px solid var(--or);outline-offset:3px}
button.go{background:var(--or);color:#fff;box-shadow:0 4px 0 #8f4f24}
button.say{background:#fff;border:2px solid var(--beige);box-shadow:none;padding:5px 12px;font-size:15px;white-space:nowrap}
button.truc{background:var(--or2);box-shadow:0 4px 0 #e2c3aa}
button.lien{background:none;box-shadow:none;text-decoration:underline;padding:4px 6px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.big{font-size:30px;min-width:130px;padding:14px 24px}
button.bonne{background:#BFE3C9!important;box-shadow:0 4px 0 #7fb08e!important}
button.mauvaise{background:#F3C0BA!important;box-shadow:0 4px 0 #c98a83!important}
.card{background:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(74,79,85,.09);margin:14px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.pill{display:inline-block;border-radius:99px;padding:3px 14px;font-weight:800;font-size:15px}
.bar{height:10px;background:#EEE6DE;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--or);border-radius:99px;transition:width .6s}
.consigne{font-weight:700;margin:12px 0 6px}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:22px;padding:10px 14px;border:3px solid var(--beige);border-radius:14px;background:#fff;color:var(--ard)}
textarea{width:100%;min-height:130px;font-size:19px}
/* entrée */
.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.monte{animation:monte .45s ease-out both}
@keyframes monte{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fox{animation:flotte 3s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-6px)}}
.saute{animation:saute .7s}
@keyframes saute{30%{transform:translateY(-26px) rotate(-6deg)}60%{transform:translateY(0)}75%{transform:translateY(-8px)}}
.cf{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:50;pointer-events:none;animation:tombe linear forwards}
@keyframes tombe{to{transform:translateY(110vh) rotate(720deg)}}
/* reçu */
.recu{background:#FFFEFA;border:2px dashed var(--beige);border-radius:14px;padding:10px 16px;max-width:460px;margin:10px auto;font-size:20px}
.rl{display:flex;justify-content:space-between;gap:16px;padding:4px 0;border-bottom:1px dotted #e6dcd2;animation:monte .35s ease-out both}
.rl:last-of-type{border-bottom:0}.rl b{white-space:nowrap}
.rn{font-size:15px;font-style:italic;text-align:center;margin-top:4px}
.rl .arr{color:var(--or);font-weight:900;margin-left:10px}
/* droite */
svg.dr{width:100%;max-width:640px;display:block;margin:6px auto;overflow:visible}
.dl{font-family:PH;font-size:32px;text-anchor:middle;fill:#4A4F55}
.dm{font-size:15px;text-anchor:middle;fill:#8a7f76;font-weight:700}
.mkt{font-size:22px;font-weight:900;text-anchor:middle;fill:#fff}
.mk{animation:glisse 1.3s cubic-bezier(.3,1.25,.5,1) .2s both}
@keyframes glisse{from{transform:translateX(0)}to{transform:translateX(var(--x))}}
.fl{opacity:0;animation:fade .5s 1.5s forwards}.midS{animation:pulse 1.2s 3}
@keyframes fade{to{opacity:1}}@keyframes pulse{50%{transform:scale(1.4)}}
/* tri */
.tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:54px;margin:8px 0}
.tag{background:#FFF6D8;box-shadow:0 3px 0 #e4d3a0;font-size:18px;padding:9px 14px}
.tag.sel{outline:4px solid var(--or);transform:scale(1.06)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:3px dashed var(--beige);border-radius:18px;padding:10px;min-height:150px;text-align:center;cursor:pointer;background:#FFFCF7}
.bin.vise{border-color:var(--or);background:var(--or2)}
.bin .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
/* jetons */
.jrow{border-bottom:2px dotted #e6dcd2;padding:10px 0}
.jl{display:flex;justify-content:space-between;font-size:21px}
.jc{display:flex;align-items:center;gap:10px;margin-top:6px}
.pm{font-size:28px;width:56px;height:56px;padding:0;border-radius:50%}
.tray{flex:1;min-height:52px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#FBF6EE;border-radius:14px;padding:4px 8px}
.coin{width:44px;height:44px}.coin.drop{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}}
.tot{font-weight:800;text-align:center;font-size:22px}
/* portefeuille */
.wallet{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#EFE6DA;border-radius:20px;padding:12px;margin:10px auto;max-width:520px}
.bill{width:120px;height:58px}
/* ordre */
.ord button{display:block;width:100%;text-align:left;margin:8px 0;font-weight:700;background:#FFF6D8;box-shadow:0 3px 0 #e4d3a0}
.ord .num{display:inline-block;width:34px;height:34px;border-radius:50%;background:var(--or);color:#fff;text-align:center;line-height:34px;margin-right:10px}
/* curseur */
.cv{font-family:PH;font-size:64px;text-align:center;color:var(--or);line-height:1}
input[type=range]{width:100%;height:44px;accent-color:var(--or)}
/* explication */
.expl{border-radius:18px;padding:14px 18px;margin-top:14px;animation:monte .4s both}
.expl.bon{background:#E3F3E8}.expl.pasbon{background:#FBEDE4}
.expl ol{margin:8px 0 10px;padding-left:24px}.expl li{margin:5px 0}
.oups{background:#FBEDE4;border-radius:14px;padding:10px 14px;font-weight:700}
.hint{display:flex;gap:14px;align-items:flex-start;background:var(--or2);border-radius:18px;padding:12px 16px;margin-top:12px;animation:monte .4s both}
.hint svg.fx{flex:none;width:90px;height:auto}
.hint ul{margin:4px 0;padding-left:20px}
.fini button:not(.say):not(.go){pointer-events:none}
/* carte */
svg.map{width:100%;display:block}
.stop circle{transition:fill .4s}
#tok{transition:transform 1.5s cubic-bezier(.5,0,.3,1)}
/* capsule */
.cap{background:#fff;border-radius:24px;padding:16px;box-shadow:0 8px 24px rgba(74,79,85,.1)}
.cap-v{min-height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.cap-txt{font-size:24px;text-align:center;font-weight:700;min-height:70px}
.eq{font-family:PH;font-size:46px;text-align:center}
.taxb{width:100%;max-width:560px;margin:auto}
.taxb .seg{height:54px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border-radius:10px;animation:grandit .7s ease-out both;transform-origin:left;vertical-align:top}
@keyframes grandit{from{transform:scaleX(0)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.cols>div{border-radius:16px;padding:10px 14px}
/* bilan */
.el{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:2px dotted #eadfd4}
.meter{display:flex;gap:4px}.meter i{width:26px;height:16px;border-radius:5px;background:#EEE6DE}.meter i.on{background:var(--or)}
.dots span{display:inline-block;width:18px;height:18px;border-radius:50%;margin:2px;border:3px solid var(--or)}
.dots .d1{background:var(--or)}.dots .d2{background:linear-gradient(90deg,var(--or) 50%,#fff 50%)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.choix{border-radius:22px;padding:18px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.08);display:block;width:100%}
.choix b{display:block;font-family:PH;font-size:27px;font-weight:400}
.cat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cat button{text-align:left;font-weight:700;background:#FFFCF7;border:2px solid var(--beige);box-shadow:none;font-size:17px}
.cat button.pris{background:#E3F3E8;border-color:#7fb08e}
.av{display:flex;gap:8px;flex-wrap:wrap}.av button{font-size:16px;padding:8px 12px}
.av button.on{background:var(--or);color:#fff;box-shadow:0 4px 0 #8f4f24}
table.t{border-collapse:collapse;width:100%;font-size:15px}table.t td,table.t th{border:1px solid #e6dcd2;padding:6px 8px;text-align:left;vertical-align:top}table.t th{background:#F5EEE6}
@media (max-width:560px){.fox svg{width:84px;height:auto}h1{font-size:38px}h2{font-size:27px}button.big{font-size:24px;min-width:100px}.bins{grid-template-columns:1fr}.cap-txt{font-size:20px}.bill{width:96px;height:46px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

<main id="app" aria-live="polite"></main>
<script src="lib/jspdf.umd.min.js"></script>
<script>

const FOX=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="150" height="143"><g transform="translate(5,0) scale(1.0)">

const app=document.getElementById("app");
const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fr=n=>n.toFixed(2).replace(".",",")+" $";
const fm=v=>(Math.abs(v%1)>1e-9?v.toFixed(2).replace(".",","):String(v))+" $";
const rond=p=>Math.floor(p+0.5+1e-9);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------------- voix (seulement au clic) ---------------- */
const voix=()=>{try{const v=speechSynthesis.getVoices();return v.find(x=>x.lang==="fr-CA")||v.find(x=>x.lang&&x.lang.startsWith("fr"))}catch(e){return null}};
function pourVoix(t){return String(t).replace(/<[^>]+>/g," ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"")
 .replace(/→/g,", ").replace(/×/g," fois ").replace(/−/g," moins ").replace(/≈/g," environ ").replace(/%/g," pour cent").replace(/¢/g," cents")
 .replace(/(\d+),(\d\d) \$/g,"$1 dollars $2").replace(/(\d+) \$/g,"$1 dollars")}
function dire(t,fin){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(pourVoix(t));u.lang="fr-CA";const v=voix();if(v)u.voice=v;u.rate=.92;if(fin){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)}catch(e){if(fin)setTimeout(fin,2500+String(t).length*45)}}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{}}
const SAY={};let sayN=0;
function say(t,lab){const k="s"+(sayN++);SAY[k]=t;return `<button class="say" onclick="dire(SAY['${k}'])" aria-label="Écouter">🔊 ${lab||"Écouter"}</button>`}

 B:{n:"Bouleau",c:"var(--bo)",f:"var(--bof)",d:"J’estime un total et je compare"},
 S:{n:"Sapin",c:"var(--sa)",f:"var(--saf)",d:"J’estime avec les taxes et les rabais"}};

const DESC={arr:["Arrondit seul et explique « plus proche de ».","Arrondit avec un rappel (droite, truc du renard).","Arrondit seulement avec beaucoup d’aide.","N’arrondit pas encore."],
 est:["Additionne ses arrondis et obtient un total raisonnable, seul.","Y arrive avec un rappel de la démarche.","Y arrive étape par étape, avec de l’aide.","Calcule au sou près ou devine."],
 cmp:["Conclut « assez » ou « pas assez » seul; vérifie quand c’est serré.","Conclut après un rappel ou un 2e essai.","Conclut avec beaucoup d’aide.","Ne fait pas encore le lien avec l’argent disponible."],
 tax:["Ajoute environ 15 % et sait quels articles sont taxables.","Ajoute les taxes avec un rappel du repère.","Sait qu’il y a des taxes, sans les estimer.","Ne tient pas compte des taxes."],
 exp:["Explique avec ses mots.","Explique quand on le questionne.","Montre sans pouvoir l’expliquer.","Ne peut pas encore montrer comment."]};
const ECH=["Avec facilité","Un peu de soutien","Beaucoup d’aide","N’y arrive pas"];
const ELEVE=["Je le fais seul","Je le fais avec un peu d’aide","J’ai besoin de beaucoup d’aide","À retravailler"];

const ST=[
 {n:"Tim Hortons",l:"boulevard Harvey, Jonquière",lv:"E",c:"#B5121B",txt:"Avant le cours, tu arrêtes déjeuner. Le renard te montre comment trouver le dollar le plus proche."},
 {n:"Dépanneur du quartier",s:"Dépanneur",l:"rue Saint-Dominique, Jonquière",lv:"E",c:"#3B6EA5",txt:"Tu passes au dépanneur. Tu tries les prix : plus proches de 4 $ ou de 5 $ ?"},
 {n:"Dollarama",l:"Jonquière",lv:"E",c:"#2E7D32",txt:"Halloween approche ! Tu prépares tes pièces de 1 $ pour quelques achats."},
 {n:"Maxi",l:"Jonquière",lv:"B",c:"#D7261E",txt:"C’est l’épicerie de la semaine. Tu estimes ton panier sans calculatrice."},
 {n:"Cinéma Jonquière",s:"Cinéma",l:"Jonquière",lv:"B",c:"#5B3F8C",txt:"Soirée cinéma avec des amis. Les prix affichés incluent les taxes. As-tu assez d’argent ?"},
 {n:"Pizzéria du coin",s:"Pizzéria",l:"Jonquière",lv:"B",c:"#C0551F",txt:"Après le film, une pizza ! Les prix incluent les taxes. Tu expliques ta façon de faire à un ami."},
 {n:"Centre Georges-Vézina",s:"Saguenéens",l:"Chicoutimi · match des Saguenéens",lv:"B",c:"#1F3A93",txt:"Direction Chicoutimi pour voir jouer les Saguenéens ! Les prix incluent les taxes."},
 {n:"Walmart",l:"Jonquière",lv:"S",c:"#0B6FC4",txt:"Niveau Sapin : les taxes. Qu’est-ce qui est taxé ? Et ce reçu est-il correct ?"},
 {n:"Jean Coutu",l:"Jonquière",lv:"S",c:"#00539B",txt:"À la pharmacie, les produits de soins sont taxés. Tu estimes avec le repère de 15 %."},
 {n:"Place du Royaume",l:"Chicoutimi",lv:"S",c:"#7A4E2D",txt:"L’hiver s’en vient : manteau et bottes en solde. Rabais d’abord, taxes ensuite !"},
 {n:"Party d’Halloween",s:"Halloween",l:"chez toi",lv:"S",c:"#D9661B",txt:"Grande finale : tu organises un party d’Halloween avec 30 $."}
];

const Q=[
 {id:"E1",st:0,el:"arr",type:"droite",truc:"t1",a:2,p:2.39,titre:"Un café moyen coûte <b>2,39 $</b>. Il est plus proche de quel dollar ?",court:"Café 2,39 $ : dollar le plus proche",
  ex:["Le prix est entre 2 $ et 3 $.","Je regarde les cents : 39 ¢.","39 ¢, c’est moins que 50 ¢.","Je garde le même dollar : environ 2 $."]},
 {id:"E2",st:0,el:"arr",type:"droite",truc:"t1",a:1,p:1.79,titre:"Un beigne glacé coûte <b>1,79 $</b>. Il est plus proche de quel dollar ?",court:"Beigne 1,79 $ : dollar le plus proche",
  ex:["Le prix est entre 1 $ et 2 $.","Je regarde les cents : 79 ¢.","79 ¢, c’est plus que 50 ¢.","Je monte au dollar suivant : environ 2 $."]},
 {id:"E3",st:0,el:"arr",type:"droite",truc:"t1",a:3,p:3.49,titre:"Un bagel au fromage à la crème coûte <b>3,49 $</b>. Il est plus proche de quel dollar ?",court:"Bagel 3,49 $ : dollar le plus proche",

 {id:"E4",st:0,el:"arr",type:"droite",truc:"t1",a:2,p:2.50,titre:"Un muffin aux bleuets coûte <b>2,50 $</b>. On l’arrondit à quel dollar ?",court:"Muffin 2,50 $ : le milieu",

 {id:"E5",st:1,el:"arr",type:"tri",truc:"t1",titre:"Trie les prix : plus proches de 4 $ ou de 5 $ ?",court:"Trier 6 prix entre 4 $ et 5 $",
  bins:["Plus proche de 4 $","Plus proche de 5 $"],items:[["Croustilles 4,29 $",0],["Lait au chocolat 4,59 $",1],["Pain tranché 4,49 $",0],["Gomme 4,05 $",0],["Boisson gazeuse 4,79 $",1],["Sac de bonbons 4,50 $",1]],

 {id:"E6",st:2,el:"est",type:"jetons",truc:"t2",titre:"Pour chaque article, mets le bon nombre de pièces de 1 $.",court:"Pièces de 1 $ : bonbons, maquillage, citrouille",

/* ---------------- visuels ---------------- */
function droite(a,p,o={}){
 const W=640,x0=50,x1=590,y=100,X=t=>x0+(t-a)*(x1-x0);
 let s=`<svg viewBox="0 0 ${W} 180" class="dr" role="img" aria-label="Droite de ${a} $ à ${a+1} $"><defs><marker id="ah${a}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9733A"/></marker></defs>`;
 s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#4A4F55" stroke-width="6" stroke-linecap="round"/>`;
 for(let k=0;k<=10;k++){const xx=X(a+k/10),big=k%5==0;s+=`<line x1="${xx}" y1="${y-(big?22:11)}" x2="${xx}" y2="${y+(big?22:11)}" stroke="#4A4F55" stroke-width="${big?5:3}"/>`}
 s+=`<text x="${x0}" y="${y+62}" class="dl">${a} $</text><text x="${x1}" y="${y+62}" class="dl">${a+1} $</text>`;
 s+=`<text x="${X(a+.5)}" y="${y+50}" class="dm">milieu</text>`;
 if(o.mid)s+=`<circle cx="${X(a+.5)}" cy="${y}" r="13" fill="#E3BF6A" class="midS" style="transform-origin:${X(a+.5)}px ${y}px"/>`;
 if(p!=null){const xp=X(p),near=p-a>=.5-1e-9?a+1:a;
  if(o.fleche){const xn=X(near),d=xn>xp?-1:1;s+=`<g class="fl"><line x1="${xp}" y1="${y-14}" x2="${xn+d*10}" y2="${y-14}" stroke="#C9733A" stroke-width="6" marker-end="url(#ah${a})"/><text x="${(xp+xn)/2}" y="${y+40}" class="dm" style="fill:#C9733A">plus proche de ${near} $</text></g>`}
  s+=`<g class="mk" style="--x:${(xp-x0).toFixed(1)}px"><g transform="translate(${x0},0)"><path d="M0,${y-10} l-13,-24 h26 z" fill="#C9733A"/><rect x="-50" y="${y-74}" width="100" height="40" rx="11" fill="#C9733A"/><text x="0" y="${y-46}" class="mkt">${fr(p)}</text></g></g>`}
 return s+"</svg>"}
function recu(items,note){return `<div class="recu">${items.map((it,k)=>`<div class="rl" style="animation-delay:${k*.1}s"><span>${E(it[0])}</span><b>${typeof it[1]=="number"?fr(it[1]):E(it[1])}</b></div>`).join("")}${note?`<div class="rn">${E(note)}</div>`:""}</div>`}
function recuArr(items){return `<div class="recu">${items.map((it,k)=>`<div class="rl" style="animation-delay:${k*.25}s"><span>${E(it[0])}</span><b>${fr(it[1])}<span class="arr">→ ${rond(it[1])} $</span></b></div>`).join("")}</div>`}
const coin=(cl="")=>`<svg class="coin ${cl}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#D9AE45" stroke="#8a6d1f" stroke-width="3"/><circle cx="22" cy="22" r="14" fill="none" stroke="#b58d2c" stroke-width="1.5"/><text x="22" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#5a4410" font-family="Arial">1 $</text></svg>`;
const BILL={50:"#C2453D",20:"#4E9A5B",10:"#7B5AA6",5:"#3D7CC9"};
function billets(m){let r=m,out=[];for(const b of [50,20,10,5]){while(r>=b){out.push(b);r-=b}}
 return `<div class="wallet">${out.map((b,k)=>`<svg class="bill pop" style="animation-delay:${k*.15}s" viewBox="0 0 120 58" aria-hidden="true"><rect width="120" height="58" rx="7" fill="${BILL[b]}"/><rect x="5" y="5" width="110" height="48" rx="5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><circle cx="34" cy="29" r="15" fill="#fff" fill-opacity=".3"/><text x="86" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff" font-family="Arial">${b} $</text></svg>`).join("")}<span class="hand" style="font-size:26px">Dans mon portefeuille : ${m} $</span></div>`}
function taxBar(base,step){const t10=base/10,t5=base/20,tot=base+t10+t5,W=v=>(v/tot*100).toFixed(1)+"%";
 return `<div class="taxb"><div style="white-space:nowrap"><span class="seg" style="width:${W(base)};background:#8a7f76">${fm(base)}</span>${step>=1?`<span class="seg" style="width:${W(t10)};background:#C9733A;animation-delay:.2s">${step>=1?fm(t10):""}</span>`:""}${step>=2?`<span class="seg" style="width:${W(t5)};background:#E3BF6A;animation-delay:.2s;color:#4A4F55">${fm(t5)}</span>`:""}</div>
 <div class="row sp small" style="margin-top:6px"><span>prix</span>${step>=1?"<span>+ 10 %</span>":""}${step>=2?"<span>+ la moitié</span>":""}</div>${step>=3?`<p class="eq pop">≈ ${fm(tot)}</p>`:""}</div>`}
function facade(st){const c=st.c;let aw="";for(let k=0;k<10;k++)aw+=`<path d="M${20+k*32},70 h32 v16 q-16,12 -32,0 z" fill="${k%2?"#fff":c}"/>`;
 return `<svg viewBox="0 0 360 210" style="width:100%;max-width:420px;display:block;margin:auto" class="pop" role="img" aria-label="${E(st.n)}">
 <rect x="20" y="40" width="320" height="160" rx="8" fill="#F3E7DA"/><rect x="8" y="18" width="344" height="52" rx="12" fill="${c}"/>
 <text x="180" y="55" text-anchor="middle" font-family="PH,cursive" font-size="${st.n.length>18?24:30}" fill="#fff">${E(st.n)}</text>${aw}
 <rect x="42" y="104" width="86" height="62" rx="6" fill="#CFE7F1"/><path d="M50,112 l24,0 l-18,30 z" fill="#fff" opacity=".6"/>
 <rect x="232" y="104" width="86" height="62" rx="6" fill="#CFE7F1"/><path d="M240,112 l24,0 l-18,30 z" fill="#fff" opacity=".6"/>
 <rect x="150" y="100" width="60" height="100" rx="6" fill="#8a7f76"/><rect x="156" y="106" width="48" height="60" rx="4" fill="#CFE7F1"/><circle cx="198" cy="160" r="3" fill="#FFFDF9"/>
 <rect x="0" y="198" width="360" height="12" rx="4" fill="#D8C7BB"/></svg>`}
function foxFace(w){return FOX.replace(/width="\d+"/,`width="${w}" class="fx"`).replace(/height="\d+"/,"")}
