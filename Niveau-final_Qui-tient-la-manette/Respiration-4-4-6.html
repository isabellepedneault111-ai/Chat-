<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respiration 4 · 4 · 6</title>
<style>
:root{--nuit:#0F1430;--cyan:#2EC4E6;--jaune:#FFC531;--vert:#3DDC97;--blanc:#F4F6FF;--gris:#8B93B8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--nuit);color:var(--blanc);font-family:Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;cursor:pointer;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
.haut{position:fixed;top:3vh;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(12px,1.4vw,22px);color:var(--gris)}
.haut b{color:var(--jaune)}
.scene{position:relative;width:min(62vh,80vw);height:min(62vh,80vw);display:flex;align-items:center;justify-content:center}
.anneau{position:absolute;inset:0;border-radius:50%;border:clamp(4px,.6vh,8px) solid #2C3360}
.bulle{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.18),transparent 60%),var(--c,var(--cyan));transform:scale(.55);opacity:.9;transition:transform linear,background-color .6s}
.chiffre.petit{font-size:min(7vh,8vw);letter-spacing:.02em}
.chiffre{position:relative;font-size:min(17vh,20vw);font-weight:900;line-height:1;color:var(--nuit);font-variant-numeric:tabular-nums}
.etape{margin-top:4vh;font-size:clamp(28px,6vh,72px);font-weight:900;letter-spacing:-.02em;min-height:1.2em;text-align:center}
.sous{margin-top:1vh;font-size:clamp(16px,2.4vh,30px);color:var(--gris);text-align:center;min-height:1.4em}
.points{position:fixed;bottom:4vh;display:flex;gap:14px}
.points span{width:18px;height:18px;border-radius:50%;border:3px solid #2C3360}
.points span.ok{background:var(--vert);border-color:var(--vert)}
.coin{position:fixed;bottom:3vh;right:3vw;display:flex;gap:10px}
.coin button{font:inherit;font-size:14px;font-weight:700;color:var(--gris);background:transparent;border:1.5px solid #2C3360;border-radius:99px;padding:6px 12px;cursor:pointer}
.coin button[aria-pressed=true]{color:var(--nuit);background:var(--jaune);border-color:var(--jaune)}
</style>
</head>
<body>
<div class="haut"><span><b>Niveau final</b> · je reste dans ma zone</span><span id="cycle"></span></div>
<div class="scene"><div class="anneau"></div><div class="bulle" id="bulle"></div><div class="chiffre petit" id="chiffre">4 · 4 · 6</div></div>
<div class="etape" id="etape">Cliquez pour commencer</div>
<div class="sous" id="sous">3 respirations · personne ne le voit · ça marche aussi en évaluation</div>
<div class="points" id="points"></div>
<div class="coin" onclick="event.stopPropagation()">
 <button id="nb" title="Nombre de respirations">3 fois</button>
 <button id="son" aria-pressed="false" title="Un petit son à chaque étape">Son</button>
 <button id="ecran" title="Plein écran (touche F)">Plein écran</button>
</div>
<script>
const PHASES=[{t:"J'inspire",s:"par le nez",d:4,scale:1,c:"#2EC4E6"},{t:"Je bloque",s:"doucement",d:4,scale:1,c:"#FFC531"},{t:"J'expire",s:"lentement, par la bouche",d:6,scale:.55,c:"#3DDC97"}];
let N=3,actif=false,minuteur=null,sonOn=false,ctx=null;
const $=id=>document.getElementById(id),bulle=$("bulle");
function points(fait){$("points").innerHTML=Array.from({length:N},(_,i)=>`<span class="${i<fait?"ok":""}"></span>`).join("")}
function bip(f){if(!sonOn)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.6);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.65)}catch(e){}}
function arreter(){actif=false;clearInterval(minuteur);minuteur=null}
function depart(){
 arreter();actif=true;let cycle=0,ph=0,reste;points(0);
 const lancer=()=>{const p=PHASES[ph];reste=p.d;bulle.style.setProperty("--c",p.c);bulle.style.transitionDuration=(ph===1?0:p.d)+"s";bulle.style.transform=`scale(${p.scale})`;
  $("etape").textContent=p.t;$("sous").textContent=p.s;$("chiffre").textContent=reste;$("cycle").textContent=`Respiration ${cycle+1} / ${N}`;bip([440,520,392][ph])};
 $("chiffre").classList.remove("petit");bulle.style.transitionDuration="0s";bulle.style.transform="scale(.55)";
 requestAnimationFrame(()=>requestAnimationFrame(lancer));
 minuteur=setInterval(()=>{reste--;if(reste>0){$("chiffre").textContent=reste;return}
  ph++;if(ph===PHASES.length){ph=0;cycle++;points(cycle);if(cycle===N){fin();return}}lancer()},1000)}
function fin(){arreter();$("chiffre").classList.remove("petit");$("chiffre").textContent="✓";bulle.style.setProperty("--c","#3DDC97");bulle.style.transitionDuration="1.2s";bulle.style.transform="scale(.7)";
 $("etape").textContent="Vous êtes dans votre zone.";$("sous").textContent="Cliquez pour recommencer";$("cycle").textContent="";bip(660)}
document.body.addEventListener("click",()=>{if(actif){arreter();$("etape").textContent="En pause";$("sous").textContent="Cliquez pour recommencer";return}depart()});
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="Enter"){e.preventDefault();document.body.click()}if(e.key==="f"||e.key==="F")plein()});
function plein(){const d=document.documentElement;if(!document.fullscreenElement)(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);else document.exitFullscreen&&document.exitFullscreen()}
$("ecran").onclick=plein;
$("son").onclick=()=>{sonOn=!sonOn;$("son").setAttribute("aria-pressed",sonOn);if(sonOn)bip(520)};
$("nb").onclick=()=>{N=N===3?5:N===5?1:3;$("nb").textContent=N+(N>1?" fois":" fois");points(0)};
points(0);
</script>
</body>
</html>
