/* ================= outils ================= */
const app=document.getElementById("app");
const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const nb=(n,d)=>(d==null?(Math.abs(n%1)>1e-9?2:0):d);
const fmU=(v,u)=>{const t=v.toFixed(nb(v)).replace(".",",");return u?t+" "+u:t};
const fr=n=>n.toFixed(2).replace(".",",")+(U?" "+U:"");
const fm=v=>fmU(v,U);
const rond=p=>Math.floor(p+0.5+1e-9);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const haut=()=>window.scrollTo({top:0,behavior:"smooth"});
const voix=()=>{try{const v=speechSynthesis.getVoices();return v.find(x=>x.lang==="fr-CA")||v.find(x=>x.lang&&x.lang.startsWith("fr"))}catch(e){return null}};
function pourVoix(t){return String(t).replace(/<[^>]+>/g," ").replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").replace(/→/g,", ").replace(/×/g," fois ").replace(/−/g," moins ").replace(/≈/g," environ ").replace(/%/g," pour cent").replace(/¢/g," cents").replace(/(\d+),(\d\d) \$/g,"$1 dollars $2").replace(/(\d+) \$/g,"$1 dollars").replace(/(\d)\s?mg\b/g,"$1 milligrammes").replace(/(\d)\s?mL\b/g,"$1 millilitres").replace(/(\d)\s?g\b/g,"$1 grammes").replace(/\bVQ\b/g,"valeur quotidienne")}
function dire(t,fin){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(pourVoix(t));u.lang="fr-CA";const v=voix();if(v)u.voice=v;u.rate=.92;if(fin){u.onend=fin;u.onerror=fin}speechSynthesis.speak(u)}catch(e){if(fin)setTimeout(fin,2500+String(t).length*45)}}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=()=>{}}
const SAY={};let sayN=0;
function say(t,lab){const k="s"+(sayN++);SAY[k]=t;return `<button class="say" onclick="dire(SAY['${k}'])" aria-label="Écouter">🔊 ${lab||"Écouter"}</button>`}
function mascotte(w){if(!MASCOTTE)return "";return MASCOTTE.replace(/width="\d+"/,`width="${w}" class="fx"`).replace(/height="\d+"/,"")}

/* ================= visuels ================= */
function droite(a,p,o={}){
 const W=640,x0=50,x1=590,y=100,X=t=>x0+(t-a)*(x1-x0),u=U?" "+U:"";
 let s=`<svg viewBox="0 0 ${W} 180" class="dr" role="img" aria-label="Droite de ${a} à ${a+1}"><defs><marker id="ah${a}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C9733A"/></marker></defs>`;
 s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#4A4F55" stroke-width="6" stroke-linecap="round"/>`;
 for(let k=0;k<=10;k++){const xx=X(a+k/10),big=k%5==0;s+=`<line x1="${xx}" y1="${y-(big?22:11)}" x2="${xx}" y2="${y+(big?22:11)}" stroke="#4A4F55" stroke-width="${big?5:3}"/>`}
 s+=`<text x="${x0}" y="${y+62}" class="dl">${a}${u}</text><text x="${x1}" y="${y+62}" class="dl">${a+1}${u}</text><text x="${X(a+.5)}" y="${y+50}" class="dm">milieu</text>`;
 if(o.mid)s+=`<circle cx="${X(a+.5)}" cy="${y}" r="13" fill="#E3BF6A" class="midS" style="transform-origin:${X(a+.5)}px ${y}px"/>`;
 if(p!=null){const xp=X(p),near=p-a>=.5-1e-9?a+1:a;
  if(o.fleche){const xn=X(near),d=xn>xp?-1:1;s+=`<g class="fl"><line x1="${xp}" y1="${y-14}" x2="${xn+d*10}" y2="${y-14}" stroke="#C9733A" stroke-width="6" marker-end="url(#ah${a})"/><text x="${(xp+xn)/2}" y="${y+40}" class="dm" style="fill:#C9733A">plus proche de ${near}${u}</text></g>`}
  s+=`<g class="mk" style="--x:${(xp-x0).toFixed(1)}px"><g transform="translate(${x0},0)"><path d="M0,${y-10} l-13,-24 h26 z" fill="#C9733A"/><rect x="-50" y="${y-74}" width="100" height="40" rx="11" fill="#C9733A"/><text x="0" y="${y-46}" class="mkt">${fr(p)}</text></g></g>`}
 return s+"</svg>"}
const valU=(v,u)=>typeof v=="number"?(u==="$"?v.toFixed(2).replace(".",",")+" $":fmU(v,u)):E(v);const val=v=>valU(v,U);
function recu(items,note,u){return `<div class="recu">${items.map((it,k)=>`<div class="rl" style="animation-delay:${k*.1}s"><span>${E(it[0])}</span><b>${valU(it[1],u==null?U:u)}</b></div>`).join("")}${note?`<div class="rn">${E(note)}</div>`:""}</div>`}
function recuArr(items){return `<div class="recu">${items.map((it,k)=>`<div class="rl" style="animation-delay:${k*.25}s"><span>${E(it[0])}</span><b>${fr(it[1])}<span class="arr">→ ${rond(it[1])}${U?" "+U:""}</span></b></div>`).join("")}</div>`}
const coin=(cl="")=>`<svg class="coin ${cl}" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#D9AE45" stroke="#8a6d1f" stroke-width="3"/><circle cx="22" cy="22" r="14" fill="none" stroke="#b58d2c" stroke-width="1.5"/><text x="22" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#5a4410" font-family="Arial">1 $</text></svg>`;
const BILL={50:"#C2453D",20:"#4E9A5B",10:"#7B5AA6",5:"#3D7CC9"};
function billets(m){let r=m,out=[];for(const b of [50,20,10,5]){while(r>=b){out.push(b);r-=b}}
 return `<div class="wallet">${out.map((b,k)=>`<svg class="bill pop" style="animation-delay:${k*.15}s" viewBox="0 0 120 58" aria-hidden="true"><rect width="120" height="58" rx="7" fill="${BILL[b]}"/><rect x="5" y="5" width="110" height="48" rx="5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><circle cx="34" cy="29" r="15" fill="#fff" fill-opacity=".3"/><text x="86" y="38" text-anchor="middle" font-size="24" font-weight="900" fill="#fff" font-family="Arial">${b} $</text></svg>`).join("")}<span class="hand" style="font-size:26px">Dans mon portefeuille : ${m} $</span></div>`}
function taxBar(base,step){const t10=base/10,t5=base/20,tot=base+t10+t5,W=v=>(v/tot*100).toFixed(1)+"%";
 return `<div class="taxb"><div style="white-space:nowrap"><span class="seg" style="width:${W(base)};background:#8a7f76">${fm(base)}</span>${step>=1?`<span class="seg" style="width:${W(t10)};background:#C9733A;animation-delay:.2s">${fm(t10)}</span>`:""}${step>=2?`<span class="seg" style="width:${W(t5)};background:#E3BF6A;animation-delay:.2s;color:#4A4F55">${fm(t5)}</span>`:""}</div>
 <div class="row sp small" style="margin-top:6px"><span>prix</span>${step>=1?"<span>+ 10 %</span>":""}${step>=2?"<span>+ la moitié</span>":""}</div>${step>=3?`<p class="eq pop">≈ ${fm(tot)}</p>`:""}</div>`}
/* visuel déclaratif (config) -> HTML */
function vis(v){if(!v)return "";if(typeof v==="string")return v;switch(v.type){
 case"droite":return droite(v.a,v.p==null?null:v.p,{fleche:v.fleche,mid:v.milieu});
 case"recu":return recu(v.articles,v.note);case"recuArrondi":return recuArr(v.articles);
 case"billets":return billets(v.montant);case"taxes":return taxBar(v.base,v.etape==null?3:v.etape);
 case"grand":return `<div class="eq pop">${v.html}</div>`;
 case"colonnes":return `<div class="cols">${v.colonnes.map((c,k)=>`<div style="background:${c.couleur||(k?"#FBEDE4":"#E3F3E8")}"><b>${E(c.titre)}</b><br>${E(c.texte)}</div>`).join("")}</div>`;
 case"mascotte":return mascotte(v.taille||140)+(v.html?`<div class="eq">${v.html}</div>`:"");
 case"decor":return decor(v.decor,{n:v.nom||"",c:v.couleur});
 case"image":return `<img src="${E(v.src)}" alt="${E(v.alt||"")}" style="max-width:100%;max-height:260px;border-radius:14px">`;
 case"tableauNutritif":return tableauNutritif(v);
 case"comparer":return `<div class="cmpx">${v.tableaux.map(t=>`<div>${t.nom?`<div class="hand" style="font-size:22px;text-align:center">${E(t.nom)}</div>`:""}${tableauNutritif(t)}</div>`).join("")}</div>`;
 case"html":return v.html;default:return ""}}
function tableauNutritif(v){const r=v.lignes||[],c=p=>p==null?"":p>=15?"background:#FBE2CE;color:#8f4f24":p<=5?"background:#E3F3E8;color:#2E6B45":"";
 return `<div class="tvn pop"><div class="tvn-t">${E(v.titre||"Valeur nutritive")}</div><div class="small">${E(v.portion||"")}</div><div class="tvn-cal"><b>Calories ${E(v.calories==null?"":v.calories)}</b><span class="small">% valeur quotidienne*</span></div>
 ${r.map(l=>`<div class="tvn-l"${l[3]==="sous"?' style="padding-left:16px"':""}><span><b${l[3]==="sous"?' style="font-weight:600"':""}>${E(l[0])}</b> ${E(l[1]||"")}</span><b style="border-radius:6px;padding:0 6px;${v.repere?c(l[2]):""}">${l[2]==null?"":E(l[2])+" %"}</b></div>`).join("")}
 <div class="small" style="margin-top:4px">${v.repere!==false?"*5 % ou moins, c’est <b>peu</b> · 15 % ou plus, c’est <b>beaucoup</b>":""}${v.note?" "+E(v.note):""}</div>${v.ingredients?`<div class="small" style="margin-top:6px;border-top:2px solid #111;padding-top:4px"><b>Ingrédients :</b> ${E(v.ingredients)}</div>`:""}</div>`}
function visTexte(v){if(!v||typeof v==="string")return "";if(v.dit)return v.dit;switch(v.type){
 case"comparer":return v.tableaux.map(t=>(t.nom?t.nom+". ":"")+visTexte(Object.assign({type:"tableauNutritif"},t))).join(" Deuxième produit. ");
 case"tableauNutritif":return `${v.titre||"Valeur nutritive"}, ${v.portion||""}. Calories ${v.calories==null?"":v.calories}. `+(v.lignes||[]).map(l=>l[0]+" "+(l[1]||"")+(l[2]==null?"":", "+l[2]+" %")).join(". ")+(v.ingredients?". Ingrédients : "+v.ingredients:"");
 case"colonnes":return v.colonnes.map(c=>c.titre+" : "+c.texte).join(". ");case"recu":case"recuArrondi":return v.articles.map(a=>a[0]+" "+valU(a[1],U)).join(". ");
 case"grand":return String(v.html).replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ");default:return ""}}

/* ================= capsules ================= */
function capsule(el,keys,fin,finTxt){
 const sc=keys.filter(k=>CAPS[k]).flatMap(k=>CAPS[k].sc.map(s=>Object.assign({cap:CAPS[k].titre},s)));if(!sc.length){if(fin)fin();return}let i=0,auto=false;
 el.innerHTML=`<div class="cap"><div class="row sp small"><b id="cpT"></b><span id="cpN"></span></div><div class="bar"><i id="cpB"></i></div><div class="cap-v" id="cpV"></div><p class="cap-txt" id="cpX"></p>
 <div class="row ctr"><button id="cpP" aria-label="Précédent">◀</button><button class="say" id="cpS">🔊 Écouter</button><button class="truc" id="cpA">▶ Lecture avec la voix</button><button class="go" id="cpN2">Suivant ▶</button></div></div>`;
 const q=s=>el.querySelector(s);
 function show(){const s=sc[i];q("#cpT").textContent=s.cap;q("#cpN").textContent=(i+1)+" / "+sc.length;q("#cpB").style.width=((i+1)/sc.length*100)+"%";
  q("#cpV").innerHTML=vis(s.v);q("#cpX").textContent=s.t;q("#cpX").classList.remove("monte");void q("#cpX").offsetWidth;q("#cpX").classList.add("monte");
  q("#cpP").disabled=i==0;q("#cpN2").textContent=i==sc.length-1?(finTxt||"Terminé ✓"):"Suivant ▶";
  if(auto)dire(s.t,()=>{if(!auto)return;if(i<sc.length-1){setTimeout(()=>{if(auto){i++;show()}},700)}else auto=false})}
 q("#cpP").onclick=()=>{auto=false;try{speechSynthesis.cancel()}catch(e){}if(i>0){i--;show()}};
 q("#cpS").onclick=()=>{auto=false;dire(sc[i].t)};q("#cpA").onclick=()=>{auto=true;show()};
 q("#cpN2").onclick=()=>{auto=false;try{speechSynthesis.cancel()}catch(e){}if(i<sc.length-1){i++;show()}else if(fin)fin()};show()}

/* ================= état ================= */
const CLE="tournee-"+(CFG.id||"jeu");
let S=nouvel();
function nouvel(){return {prenom:"",i:0,rec:{},textes:{},vus:{},debut:null,fin:null,auto:{},reinv:{caps:[],panier:null,defi:null,creation:null},etape:"accueil",tps:0,partiel:false}}
function save(){try{localStorage.setItem(CLE,JSON.stringify(S))}catch(e){}}
function charge(){try{const s=JSON.parse(localStorage.getItem(CLE)||"null");if(s&&s.rec)return s}catch(e){}return null}
function majFin(on){const b=document.getElementById("fin");b.hidden=!(on&&Object.keys(S.rec).length>0)}
const nbFaits=()=>Q.filter(q=>S.rec[q.id]).length;
const dernierNiv=()=>{const f=Q.filter(q=>S.rec[q.id]);return LV[ST[(f.length?f[f.length-1]:Q[0]).st].lv].n};
const dureeMin=()=>Math.max(1,Math.round((S.tps||0)/60000));
function fete(){const c=["#C9733A","#E3BF6A","#F5C6C2","#CFE9D7","#DDF5F2","#8A6100"];for(let k=0;k<30;k++){const d=document.createElement("i");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=c[k%c.length];d.style.animationDuration=(1+Math.random()*1.2)+"s";d.style.animationDelay=Math.random()*.3+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
 const f=document.querySelector(".qfox");if(f){f.classList.remove("saute");void f.offsetWidth;f.classList.add("saute")}}

/* ================= accueil, carte, intro, station ================= */
function accueil(){majFin(false);
 const s=charge(),reprise=s&&s.debut&&s.i<Q.length,vuBilan=s&&s.fin;
 const txtM=`Tu fais une tournée ${CFG.carte&&CFG.carte.trajet?CFG.carte.trajet+" ":""}: ${ST.length} arrêts, ${Q.length} défis. À chaque niveau, ${CFG.mascotte&&CFG.mascotte.nom||"ton guide"} te montre ses trucs. Tu as 2 essais par défi. À la fin, tu télécharges ton bilan pour ${PROF}.`;
 app.innerHTML=`<div class="row" style="flex-wrap:nowrap;gap:16px;align-items:center;margin-top:10px"><div class="fox">${mascotte(150)}</div><div><p class="small" style="margin:0">${E(CFG.sousTitre||"")}</p><h1>${E(CFG.titre)}</h1><p style="margin:0">${E(CFG.accroche||"")} Environ ${CFG.duree||30} minutes.</p></div></div>
 <div class="card monte"><h3>Comment ça marche</h3><ul style="margin:6px 0;padding-left:22px"><li>Tu fais une tournée ${E(CFG.carte&&CFG.carte.trajet||"")} : ${ST.length} arrêts, ${Q.length} défis.</li><li>À chaque niveau, ${E(CFG.mascotte&&CFG.mascotte.nom||"ton guide")} te montre ses trucs. Tu peux les revoir pendant les défis.</li><li>Tu as 2 essais par défi. Après chaque réponse, tu vois l’explication étape par étape.</li><li>Tu peux t’arrêter quand tu veux et voir ton bilan.</li><li>À la fin, tu télécharges ton bilan en PDF pour ${E(PROF)}.</li></ul>${say(txtM)}</div>
 <div class="card monte" style="animation-delay:.1s"><label for="pn"><b>Ton prénom</b></label><div class="row" style="margin-top:6px"><input type="text" id="pn" autocomplete="given-name" maxlength="30" value="${E(s&&s.prenom||"")}" style="flex:1;min-width:200px"></div>
 <div class="row mt">${reprise?`<button class="go" id="rep">Reprendre où j’étais (défi ${s.i+1})</button>`:""}${vuBilan?`<button id="vbi">Revoir mon bilan</button>`:""}<button class="${reprise||vuBilan?"":"go"}" id="nv">${reprise||vuBilan?"Recommencer au début":"C’est parti !"}</button></div></div>
 <p class="small" style="text-align:center">Rien n’est envoyé sur Internet : tes réponses restent sur cet appareil jusqu’à ce que tu télécharges ton bilan.</p>`;
 const pn=document.getElementById("pn");
 document.getElementById("nv").onclick=()=>{S=nouvel();S.prenom=pn.value.trim();S.debut=Date.now();S.etape="carte";save();carte(-1,0)};
 if(reprise)document.getElementById("rep").onclick=()=>{S=s;if(pn.value.trim())S.prenom=pn.value.trim();save();reprendre()};
 if(vuBilan)document.getElementById("vbi").onclick=()=>{S=s;if(pn.value.trim())S.prenom=pn.value.trim();save();bilan()}}
function reprendre(){if(S.i>=Q.length){S.etape==="bilan"?bilan():autoeval();return}S.fin=null;S.partiel=false;save();const st=Q[S.i].st;if(!S.vus["L"+ST[st].lv])return intro(ST[st].lv);if(!S.vus["S"+st])return station(st);question()}
function arreter(direct){majFin(false);try{speechSynthesis.cancel()}catch(e){}
 const go=()=>{S.fin=Date.now();S.partiel=S.i<Q.length;S.etape="autoeval";save();autoeval()};if(direct)return go();
 const n=nbFaits();
 app.innerHTML=`<div class="row" style="flex-wrap:nowrap"><div class="fox">${mascotte(110)}</div><div><h2>Tu veux arrêter ici ?</h2><p style="margin:0">Tu as fait <b>${n} défi${n>1?"s":""} sur ${Q.length}</b> (niveau ${dernierNiv()}).</p></div></div>
 <div class="card"><p>C’est correct d’arrêter ! Ton bilan va montrer ce que tu as réussi. Les niveaux que tu n’as pas faits seront marqués « pas encore fait ».</p><p>Tu pourras continuer la tournée une autre fois, sur cet appareil.</p>${say("C’est correct d’arrêter ! Ton bilan va montrer ce que tu as réussi. Tu pourras continuer la tournée une autre fois.")}
 <div class="row mt"><button class="go" id="oui">Oui, voir mon bilan</button><button id="non">Non, je continue</button></div></div>`;
 document.getElementById("oui").onclick=go;document.getElementById("non").onclick=reprendre;haut()}
document.getElementById("fin").onclick=()=>arreter();
function positions(n){const par=4,rows=Math.ceil(n/par),P=[];for(let k=0;k<n;k++){const r=Math.floor(k/par),j=k%par,x=r%2==0?90+j*206:708-j*206;P.push([x,70+r*130])}return {P,h:70+(rows-1)*130+70}}
function carte(de,a){majFin(true);
 const {P,h}=positions(ST.length),finNiv=de>=0&&ST[de].lv!==ST[a].lv,nom=S.prenom?", "+E(S.prenom):"",C=CFG.carte||{};
 const pts=P.map(p=>p.join(",")).join(" ");
 const stops=P.map((p,k)=>{const lv=ST[k].lv,fait=k<a,ici=k==a;return `<g><circle cx="${p[0]}" cy="${p[1]}" r="${ici?26:21}" fill="${fait?LVHEX[lv][1]:LVHEX[lv][0]}" stroke="${LVHEX[lv][1]}" stroke-width="4"/><text x="${p[0]}" y="${p[1]+7}" text-anchor="middle" font-weight="900" font-size="19" fill="${fait?"#fff":"#4A4F55"}">${fait?"✓":k+1}</text><text x="${p[0]}" y="${p[1]-32}" text-anchor="middle" font-size="15" font-weight="800" fill="#4A4F55">${E(ST[k].s||ST[k].n)}</text></g>`}).join("");
 const ry=h>220?P[Math.min(P.length-1,4)][1]+65:h-20;
 const from=P[Math.max(de,0)],to=P[a];
 app.innerHTML=`<div class="row sp"><h2>La tournée${nom}</h2><span class="pill" style="background:${LV[ST[a].lv].c}">Niveau ${LV[ST[a].lv].n}</span></div>
 <div class="card" style="padding:10px"><svg class="map" viewBox="0 0 800 ${h}" role="img" aria-label="Carte de la tournée, arrêt ${a+1} sur ${ST.length}">
 ${C.riviere?`<path d="M0,${ry} C150,${ry-20} 260,${ry+18} 400,${ry} S650,${ry-22} 800,${ry+4}" fill="none" stroke="#CFE7F1" stroke-width="26" stroke-linecap="round" opacity=".8"/><text x="640" y="${ry+18}" font-size="14" fill="#6b8fa0" font-style="italic">${E(C.riviere)}</text>`:""}
 <polyline points="${pts}" fill="none" stroke="#D8C7BB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 12"/>
 ${C.depart?`<text x="${P[0][0]}" y="${P[0][1]+46}" text-anchor="middle" font-size="15" fill="#8a7f76" font-weight="800">${E(C.depart)}</text>`:""}${C.arrivee&&P.length>1?`<text x="${P[P.length-1][0]}" y="${P[P.length-1][1]+46}" text-anchor="middle" font-size="15" fill="#8a7f76" font-weight="800">${E(C.arrivee)}</text>`:""}
 ${stops}<g id="tok" style="transform:translate(${from[0]+12}px,${from[1]-10}px)"><g transform="scale(.26)">${MASCOTTE.replace(/<svg[^>]*>/,"").replace("</svg>","")}</g></g></svg></div>
 ${finNiv?`<div class="card monte" style="background:${LV[ST[de].lv].c}"><h3 style="margin:0">Bravo ! Tu as terminé le niveau ${LV[ST[de].lv].n}.</h3><p style="margin:4px 0 0">Tu peux continuer vers le niveau ${LV[ST[a].lv].n}, ou t’arrêter ici et voir ton bilan.</p></div>`:""}
 <div class="card monte"><p style="margin:0"><b>Prochain arrêt : ${E(ST[a].n)}</b>${ST[a].l?" · "+E(ST[a].l):""}</p><div class="row mt"><button class="go" id="go">Continuer ▶</button>${finNiv?`<button id="stop">Terminer ici et voir mon bilan</button>`:""}</div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const t=document.getElementById("tok");if(t)t.style.transform=`translate(${to[0]+12}px,${to[1]-10}px)`}));
 document.getElementById("go").onclick=()=>{const lv=ST[a].lv;if(!S.vus["L"+lv])intro(lv);else station(a)};
 if(finNiv)document.getElementById("stop").onclick=()=>arreter(true);haut()}
function intro(lv){majFin(true);

  if(etape==0)corps=`<h3>1. Choisis la forme de ta question</h3><select id="fq" style="width:100%">${Object.keys(FQ).map(k=>`<option value="${k}" ${D.forme===k?"selected":""}>${FQ[k]}</option>`).join("")}</select>${C.consigne?`<p class="small">${E(C.consigne)}</p>`:""}`;
  if(etape==1){corps=`<h3>2. Écris ta question</h3><textarea id="cq" style="min-height:90px" placeholder="Ma question">${E(D.question)}</textarea>${D.forme==="qcm"?`<p class="consigne">Les choix de réponse (coche la bonne) :</p>${D.choix.map((c,k)=>`<div class="row" style="margin:6px 0"><input type="radio" name="bn" value="${k}" ${D.bonne===k?"checked":""} style="width:24px;height:24px" aria-label="Bonne réponse"><input type="text" id="ch${k}" value="${E(c)}" placeholder="Choix ${k+1}" style="flex:1;font-size:19px"></div>`).join("")}${D.choix.length<4?`<button class="lien" id="ac">＋ Ajouter un choix</button>`:""}`:""}`;pret=okQ()}
  if(etape==2){corps=`<h3>3. La bonne réponse</h3>${D.forme==="vf"?`<div class="row"><label><input type="radio" name="vv" value="1" ${D.vf?"checked":""}> <b>Vrai</b></label><label><input type="radio" name="vv" value="0" ${D.vf?"":"checked"}> <b>Faux</b></label></div>`:D.forme==="courte"?`<textarea id="cr" style="min-height:60px" placeholder="La bonne réponse">${E(D.reponse)}</textarea>`:`<p>Bonne réponse : <b>${E(D.choix[D.bonne]||"")}</b></p>`}<p class="consigne">Pourquoi c’est la bonne réponse ?</p><textarea id="cw" style="min-height:80px">${E(D.pourquoi)}</textarea>`;pret=okR()}
  if(etape==3)corps=`<h3>4. Télécharge ta question</h3><p>Ta question devient un PDF en format paysage : page 1, la question pour la classe; page 2, la réponse.</p>${S.prenom?"":`<label><b>Ton prénom</b> <input type="text" id="dpn" maxlength="30" style="font-size:19px"></label>`}<div class="row mt"><button class="go" id="dpdf">⬇ Télécharger ma question (PDF)</button></div><p class="small" id="dpm" style="color:var(--mal)"></p><div id="pdfok2"></div>`,pret=!!D.telecharge;
  if(etape==4)corps=`<h3>5. Publie ta question dans Teams</h3>${etapesTeams("Question")}<p class="mt"><b>${E(PROF)} va vérifier ta réponse.</b> Bravo !</p>`;
  app.innerHTML=`<div class="row sp"><h2>${E(C.titre||"Crée ta question")}</h2>${retour()}</div>${nav}<div class="card monte">${corps}<div class="row sp mt"><button id="pv" ${etape==0?"disabled":""}>◀ Précédent</button>${etape<4?`<button class="go" id="sv" ${pret?"":"disabled"}>Suivant ▶</button>`:`<button class="go" id="fn">Terminé ✓</button>`}</div></div>`;
  const $=id=>document.getElementById(id),lire=()=>{if($("cq"))D.question=$("cq").value;D.choix.forEach((c,k)=>{if($("ch"+k))D.choix[k]=$("ch"+k).value});const bn=app.querySelector('input[name=bn]:checked');if(bn)D.bonne=+bn.value;const vv=app.querySelector('input[name=vv]:checked');if(vv)D.vf=vv.value==="1";if($("cr"))D.reponse=$("cr").value;if($("cw"))D.pourquoi=$("cw").value;garde()};
  const maj=()=>{lire();if($("sv"))$("sv").disabled=!(etape==1?okQ():etape==2?okR():true)};
  $("rt").onclick=()=>{lire();bilan()};$("pv").onclick=()=>{lire();etape--;vue();haut()};if($("sv"))$("sv").onclick=()=>{lire();etape++;vue();haut()};if($("fn"))$("fn").onclick=bilan;
  if($("fq"))$("fq").onchange=()=>{D.forme=$("fq").value;garde()};app.querySelectorAll("input,textarea").forEach(i=>{i.oninput=maj;i.onchange=maj});
  if($("ac"))$("ac").onclick=()=>{lire();D.choix.push("");vue()};
  if(etape==3)$("dpdf").onclick=()=>{const pn=$("dpn");if(pn){const x=pn.value.trim();if(x.length<2){$("dpm").textContent="Écris ton prénom avant de télécharger.";pn.focus();return}S.prenom=x;save()}
   $("dpm").textContent="";creaPdf(D);D.telecharge=true;S.reinv.creation={question:D.question,reponse:D.forme==="vf"?(D.vf?"Vrai":"Faux"):D.forme==="qcm"?D.choix[D.bonne]:D.reponse,pourquoi:D.pourquoi};garde();$("sv").disabled=false}}
 vue();haut()}
/* ================= PDF : mise en page HTML (style du jeu) -> image -> PDF ================= */
function pdfTxt(s){return String(s).replace(/<[^>]+>/g,"").replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/œ/g,"oe").replace(/Œ/g,"Oe").replace(/≈/g,"env.").replace(/→/g,">").replace(/[−–—]/g,"-").replace(/…/g,"...").replace(/[  ]/g," ").replace(/✓/g,"").replace(/[^\x00-\xFF]/g,"")}
const PX={portrait:[816,1056],landscape:[1056,816]};
const dot=e=>{const c=getComputedStyle(document.documentElement).getPropertyValue("--or").trim()||"#C9733A";
 if(e===1)return `<svg viewBox="0 0 20 20" width="15" height="15"><circle cx="10" cy="10" r="7.5" fill="${c}" stroke="${c}" stroke-width="3"/></svg>`;
 if(e===2)return `<svg viewBox="0 0 20 20" width="15" height="15"><path d="M10,2.5 a7.5,7.5 0 0 0 0,15 z" fill="${c}"/><circle cx="10" cy="10" r="7.5" fill="none" stroke="${c}" stroke-width="3"/></svg>`;
 if(e===3)return `<svg viewBox="0 0 20 20" width="15" height="15"><circle cx="10" cy="10" r="7.5" fill="#fff" stroke="${c}" stroke-width="3"/></svg>`;
 if(e===4)return `<svg viewBox="0 0 20 20" width="15" height="15"><path d="M4,16 l1,-4 l8,-8 l3,3 l-8,8 z" fill="#8a7f76"/></svg>`;
 return `<svg viewBox="0 0 20 20" width="15" height="15"><circle cx="10" cy="10" r="7.5" fill="#fff" stroke="#C9BDB2" stroke-width="2" stroke-dasharray="3 3"/></svg>`};
const RESU=["Pas encore fait","Réussi du 1er coup","Réussi avec de l’aide","À revoir","Réponse écrite"];
async function fabriquerPdf(spec,orient,nom,boite){
 const st=document.getElementById(boite);if(st)st.innerHTML=`<p class="small">Préparation du PDF…</p>`;
 if(!window.jspdf||!window.html2canvas){alert("Le module PDF ne s’est pas chargé. Recharge la page.");return}
 const [w,h]=PX[orient],hote=document.createElement("div");hote.style.cssText="position:fixed;left:-30000px;top:0";document.body.appendChild(hote);const pages=[];
 const nouvelle=()=>{const p=document.createElement("div");p.className="pdfp";p.style.width=w+"px";p.style.height=h+"px";p.innerHTML=spec.entete(pages.length)+`<div class="pdfb"></div><div class="pdff"></div>`;hote.appendChild(p);pages.push(p);return p.querySelector(".pdfb")};
 let corps=nouvelle();
 for(const b of spec.blocs){const t=document.createElement("div");t.innerHTML=b.trim();const el=t.firstElementChild;if(!el)continue;
  if(el.classList.contains("saut")&&corps.children.length)corps=nouvelle();corps.appendChild(el);
  if(corps.scrollHeight>corps.clientHeight+1&&corps.children.length>1){el.remove();corps=nouvelle();corps.appendChild(el)}}
 pages.forEach((p,i)=>p.querySelector(".pdff").innerHTML=spec.pied(i,pages.length));
 try{await document.fonts.ready}catch(e){}
 const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"letter",orientation:orient}),mw=orient==="portrait"?215.9:279.4,mh=orient==="portrait"?279.4:215.9;
 for(let i=0;i<pages.length;i++){const cv=await html2canvas(pages[i],{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});if(i)d.addPage("letter",orient);d.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,mw,mh)}
 hote.remove();sauver(d,nom,boite)}
const nomFichier=()=>S.prenom.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9-]+/g,"-");
function enteteBilan(k){const now=new Date(),date=now.toLocaleDateString("fr-CA",{day:"numeric",month:"long",year:"numeric"}),dur=S.tps?dureeMin():null;
 if(k)return `<div class="pdfh petit">${mascotte(40)}<b>${E(CFG.titre)} · bilan de ${E(S.prenom)}</b><span class="d">${E(date)}</span></div>`;
 return `<div class="pdfh">${mascotte(70)}<div><h1>Mon bilan</h1><div class="s">${E(CFG.titre)} · ${E([CFG.cours,CFG.matiere].filter(Boolean).join(" · "))} · pour ${E(PROF)}</div></div><div class="d"><div class="pn">${E(S.prenom)}</div><div class="s">${E(date)}${dur?` · ${dur} min sur les défis`:""}</div></div></div>`}
function pdf(){const c=cotes(),B=[];
 if(S.i<Q.length)B.push(`<div class="pban">Tournée partielle : ${nbFaits()} défis faits sur ${Q.length} (dernier niveau travaillé : ${E(dernierNiv())}). Ce qui n’a pas été fait est « non évalué ».</div>`);
 if(CFG.intention)B.push(`<div class="pint"><b>Intention :</b> ${E(CFG.intention)}</div>`);
 B.push(`<div><h2 class="ps">Grille d’observation <span class="small">(la case encadrée est la cote proposée par le jeu)</span></h2><div class="pg"><div class="hd"></div>${ECH.map((e,k)=>`<div class="hd">${k+1} · ${E(e)}</div>`).join("")}</div></div>`);
 Object.keys(ELN).forEach(el=>B.push(`<div><div class="pg"><div class="n">${E(ELN[el])}${c[el]?"":`<br><span class="nf">non évalué</span>`}</div>${DESC[el].map((x,k)=>`<div class="${c[el]===k+1?"on":""}">${c[el]===k+1?`<span class="bdg">✓ ${E(ECH[k])}</span><br>`:""}${E(x)}</div>`).join("")}</div>${c[el]?`<div class="pe2">➜ <b>${c[el]===1?"Pour aller plus loin":"Prochaine étape"} :</b> ${E(prochaine(el,c[el]))}</div>`:`<div class="pe2"> </div>`}</div>`));
 B.push(`<div class="pnote">Cote : 1er essai sans aide = 1 point · avec le truc = 0,75 · 2e essai = 0,6 · 2e essai avec le truc = 0,5 · à revoir = 0. Moyenne par élément : 0,85 et plus = 1 · 0,6 = 2 · 0,35 = 3 · moins = 4. ${E(PROF)} peut ajuster la cote.</div>`);
 B.push(`<div><h2 class="ps">Résultats par niveau</h2>${NIVS.map(lv=>{const qs=Q.filter(q=>ST[q.st].lv===lv&&q.type!=="texte"),n=[1,2,3,0].map(e=>qs.filter(q=>etat(q)===e).length);return `<div class="pl"><span class="pill" style="background:${LV[lv].c};min-width:90px;text-align:center">${E(LV[lv].n)}</span><span class="pdots">${qs.map(q=>dot(etat(q))).join("")}</span><span class="small">${n[0]} du 1er coup · ${n[1]} avec aide · ${n[2]} à revoir${n[3]?" · "+n[3]+" pas faits":""}</span></div>`}).join("")}
  <div class="small" style="margin-top:4px">${dot(1)} réussi du 1er coup &nbsp; ${dot(2)} avec de l’aide &nbsp; ${dot(3)} à revoir &nbsp; ${dot(0)} pas encore fait</div></div>`);
 if(AV.length)B.push(`<div><h2 class="ps">Mon autoévaluation</h2>${AV.map(([k,t])=>`<div class="pav"><span>${E(t)}</span><span>${AVO.map((o,j)=>`<span class="ch ${S.auto[k]===j?"on":""}">${E(o)}</span>`).join("")}</span></div>`).join("")}</div>`);
 B.push(`<div class="saut"><h2 class="ps">Détail des défis</h2><div class="pt h"><div>N°</div><div>Lieu</div><div>Défi</div><div>Réponse</div><div>Résultat</div></div></div>`);
 Q.forEach((q,k)=>{const r=S.rec[q.id],e=etat(q);B.push(`<div class="pt"><div><span class="pc" style="background:${LV[ST[q.st].lv].c}">${k+1}</span></div><div>${E(ST[q.st].n)}</div><div>${E(q.court)}</div><div>${r?E(r.rep):"—"}</div><div class="rs">${dot(e)} ${RESU[e]}${r&&r.h?"<br><span class='small'>avec le truc</span>":""}</div></div>`)});
 const tx=Q.filter(q=>q.type==="texte");if(tx.length){B.push(`<div><h2 class="ps">Mes réponses écrites</h2></div>`);tx.forEach(q=>B.push(`<div class="pw"><b>${q.titre}</b><p>${E(S.textes[q.id]||"(pas de réponse)")}</p></div>`))}
 fabriquerPdf({entete:enteteBilan,blocs:B,pied:(i,n)=>`<span>${E(CFG.cours||"")} · ${E(CFG.titre)}</span><span>page ${i+1} sur ${n}</span>`},"portrait",`Bilan-${CFG.fichier||"jeu"}_${nomFichier()}_${new Date().toISOString().slice(0,10)}.pdf`,"pdfok")}
const enteteDefi=(t,s)=>k=>`<div class="pdfh grand">${mascotte(90)}<div><h1>${E(k?t[1]:t[0])}</h1><div class="s">${E(k?s[1]:s[0])}</div></div></div>`;
function defiPdf(D){const c=corrige(D),bud=FORMES[D.forme].budget;
 const p1=`<div class="dpg"><div class="drc">${recu(D.items,D.taxes?"+ taxes (environ 15 %)":"",U)}</div>${bud?`<div class="dbu"><div class="hand" style="font-size:30px">Tu as</div><div class="dmt">${fm(D.b)}</div>${billets(Math.round(D.b))}</div>`:""}</div>
  <div class="dq"><div class="hand">${E(FORMES[D.forme].q)}</div><div>Estime sans calculatrice : arrondis, additionne${D.taxes?", ajoute les taxes":""}${bud?", compare avec ton argent":""}.</div></div>`;
 const p2=`<div class="saut"><div class="dcr">${recuArr(D.items)}<ol>${c.L.map(x=>`<li>${E(x)}</li>`).join("")}</ol></div><div class="dv ${c.ok?"bon":""}">${E(c.v)}</div>${D.rep&&D.rep.trim()?`<div class="pw" style="font-size:16px"><b>Réponse de ${E(S.prenom)} :</b> ${E(D.rep.trim())}</div>`:""}</div>`;
 fabriquerPdf({entete:enteteDefi(["Le défi de "+S.prenom,"Corrigé du défi de "+S.prenom],[D.lieu,"À montrer après que la classe a répondu"]),blocs:[`<div class="plein">${p1}</div>`,p2.replace('class="saut"','class="saut plein"')],pied:(i,n)=>`<span>${E(CFG.titre)} · défi créé par ${E(S.prenom)}</span><span>${i?"Corrigé":"Défi"}</span>`},"landscape",`Defi-${nomFichier()}.pdf`,"pdfok2")}
function creaPdf(D){const ch=D.choix.filter(c=>c.trim()),rep=D.forme==="vf"?(D.vf?"Vrai":"Faux"):D.forme==="qcm"?String.fromCharCode(65+ch.indexOf(D.choix[D.bonne]))+") "+D.choix[D.bonne]:D.reponse;
 const p1=`<div><div class="cq">${E(D.question)}</div>${D.forme==="qcm"?ch.map((c,k)=>`<div class="cch"><span class="cl">${String.fromCharCode(65+k)}</span>${E(c)}</div>`).join(""):D.forme==="vf"?`<div class="cvf"><span style="background:#E3F3E8">VRAI</span><span style="background:#FBEDE4">FAUX</span></div>`:`<div class="cch" style="min-height:90px;color:#b5aaa0">Ta réponse : ……………………………………</div>`}</div>`;
 const p2=`<div class="saut"><div class="cq" style="font-size:22px;font-style:italic">${E(D.question)}</div><div class="dv bon">Bonne réponse : ${E(rep)}</div><div class="pw" style="font-size:18px"><b>Pourquoi :</b> ${E(D.pourquoi)}</div></div>`;
 fabriquerPdf({entete:enteteDefi(["La question de "+S.prenom,"Réponse de la question de "+S.prenom],[FQ[D.forme],"À montrer après que la classe a répondu"]),blocs:[p1.replace('<div>','<div class="plein">'),p2.replace('class="saut"','class="saut plein"')],pied:(i,n)=>`<span>${E(CFG.titre)} · question créée par ${E(S.prenom)}</span><span>${i?"Réponse":"Question"}</span>`},"landscape",`Question-${nomFichier()}.pdf`,"pdfok2")}

function repTxt(q){switch(q.type){case"droite":return rond(q.p)+(U?" "+U:"");case"tri":return q.bins.map((b,j)=>b+" : "+q.items.filter(i=>i[1]===j).map(i=>i[0]).join(", ")).join(" | ");
 case"jetons":return q.items.map(i=>i[0]+" "+rond(i[1])).join(", ");case"qcm":return q.opts[q.rep];case"num":case"curseur":return "accepté de "+fmU(q.okMin,q.u)+" à "+fmU(q.okMax,q.u);
 case"assez":return q.rep?"Assez":"Pas assez";case"vf":return q.rep?"Vrai":"Faux";case"ordre":return q.steps.join(" > ");case"erreur":return q.bad.map(b=>q.lignes[b][0]).join(" ou ");default:return "réponse libre"}}
function enseignant(){majFin(false);
 const types=[...new Set(Q.map(q=>q.type))];
 app.innerHTML=`<div class="row" style="flex-wrap:nowrap"><div>${mascotte(100)}</div><div><p class="small" style="margin:0">Espace enseignant · ce lien n’est pas affiché aux élèves</p><h1 style="font-size:40px">${E(CFG.titre)} · ${E(PROF)}</h1></div></div>
 ${CFG.intention?`<div class="card"><h3>Intention pédagogique</h3><p>${E(CFG.intention)}</p></div>`:""}
 <div class="card"><h3>En bref</h3><ul style="padding-left:22px;margin:6px 0"><li>${Q.length} défis dans ${ST.length} lieux, sur ${NIVS.length} niveaux : ${CFG.niveaux.map(n=>E(n.nom)+" ("+E(n.description||"")+")").join(", ")}. Environ ${CFG.duree||30} minutes.</li>
 <li>Au début de chaque niveau, une capsule animée présente les trucs. Dans chaque défi, le bouton « Le truc » sert d’indice (il est noté dans le bilan).</li>
 <li>2 essais par défi, puis l’explication étape par étape. La voix se fait seulement au clic.</li>
 <li>Modalités utilisées : ${types.join(", ")}.</li>
 <li>Le bouton « Terminer et voir mon bilan » est toujours visible. Le bilan PDF exige le prénom, indique « tournée partielle » au besoin et « non évalué » pour ce qui n’a pas été fait.</li>
 <li>Rien n’est envoyé en ligne : l’élève vous remet le PDF. Le travail est sauvegardé sur l’appareil et peut être repris.</li></ul></div>
 <div class="card"><h3>Grille et cote</h3><table class="t"><tr><th>Élément</th>${ECH.map((e,k)=>`<th>${k+1} · ${E(e)}</th>`).join("")}</tr>${CFG.elements.map(e=>`<tr><td><b>${E(e.nom)}</b></td>${e.descripteurs.map(x=>`<td>${E(x)}</td>`).join("")}</tr>`).join("")}</table>
 <p class="small">Chaque défi vaut 1 (1<sup>er</sup> essai sans aide), 0,75 (avec le truc), 0,6 (2<sup>e</sup> essai), 0,5 (2<sup>e</sup> essai avec le truc) ou 0. Moyenne par élément : 0,85 et plus = 1 · 0,6 = 2 · 0,35 = 3 · moins = 4.</p></div>
 ${Object.keys(CAPS).length?`<div class="card"><h3>Projeter une capsule</h3><div class="row">${Object.keys(CAPS).map(k=>`<button data-k="${k}">${E(CAPS[k].titre)}</button>`).join("")}</div><div id="cp" class="mt"></div></div>`:""}
 <div class="card"><h3>Corrigé</h3><table class="t"><tr><th>N°</th><th>Lieu</th><th>Défi</th><th>Élément</th><th>Réponse</th></tr>${Q.map((q,k)=>`<tr><td>${k+1}</td><td>${E(ST[q.st].n)}</td><td>${E(q.court)}</td><td>${E(ELN[q.el])}</td><td>${E(repTxt(q))}</td></tr>`).join("")}</table></div>
 ${RE.defi||RE.creation?`<div class="card"><h3>Lien direct vers le défi supplémentaire</h3><p>À donner aux élèves qui veulent créer un défi sans refaire la tournée :</p><p><b>${E(location.origin+location.pathname+(RE.defi?"?mode=defi":"?mode=question"))}</b></p></div>`:""}
 <div class="row ctr"><a href="?" style="font-weight:800;color:var(--or)">Ouvrir le jeu comme un élève</a></div>`;
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>capsule(document.getElementById("cp"),[b.dataset.k]))}

/* ================= départ ================= */
const DIRECT=/mode=defi/.test(location.search)&&RE.defi?"defi":/mode=question/.test(location.search)&&RE.creation?"creation":null;
if(new RegExp("mode=("+(CFG.cleEnseignant||"enseignant")+"|enseignant)").test(location.search))enseignant();else if(DIRECT){const s0=charge();if(s0)S=s0;DIRECT==="defi"?defi():creation()}else accueil();
</script>
