<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diapason — le labo où le son devient visible</title>
  <meta name="description" content="Le carnet de route d’un album, pour la classe : voix en direct, tessiture du duo, studio, atelier de paroles, carnet partagé.">
  <meta name="theme-color" content="#efe8da">
  <meta property="og:title" content="Diapason — le labo où le son devient visible">
  <meta property="og:description" content="Chante, frappe, compose : chaque vibration se dessine en direct.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Diapason, accueil">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M10 3v12a6 6 0 0 0 12 0V3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/><path d="M16 21v8" stroke="currentColor" stroke-width="3"/></svg>
      <span>Diapason</span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/" data-id="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/></svg><b>Parcours</b></a>
      <a href="#/miroir" data-id="explorer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0"/></svg><b>Explorer</b></a>
      <a href="#/studio" data-id="studio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><circle cx="8.5" cy="12" r="2.5"/><circle cx="15.5" cy="12" r="2.5"/></svg><b>Studio</b></a>
      <a href="#/paroles" data-id="paroles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg><b>Paroles</b></a>
      <a href="#/carnet" data-id="carnet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M9 8h6M9 12h6"/></svg><b>Carnet</b><i class="badge" hidden></i></a>
    </nav>
    <div class="tools">
      <button class="mic-pill" id="micBtn" type="button" aria-pressed="false">
        <span class="mic-dot"></span><span class="mic-label">Micro</span>
      </button>
      <button class="icon-btn" id="pistesBtn" type="button" title="Pistes pédagogiques" aria-label="Pistes pédagogiques"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
      <button class="icon-btn" id="defiBtn" type="button" title="Défi surprise" aria-label="Défi surprise"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.2" class="fill"/><circle cx="15" cy="15" r="1.2" class="fill"/><circle cx="15" cy="9" r="1.2" class="fill"/><circle cx="9" cy="15" r="1.2" class="fill"/></svg></button>
      <button class="icon-btn" id="projBtn" type="button" title="Mode projecteur (texte agrandi)" aria-label="Mode projecteur" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="drawer-inner">
      <div class="drawer-head">
        <div><p class="eyebrow">Pour l’enseignant·e</p><h2 id="drawerTitle">Pistes pédagogiques</h2></div>
        <button class="icon-btn" id="drawerClose" type="button" aria-label="Fermer">✕</button>
      </div>
      <div id="drawerBody"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <p class="eyebrow" id="modalEyebrow">Défi surprise</p>
      <h2 id="modalTitle"></h2>
      <div class="modal-actions">
        <button class="btn" id="modalAgain" type="button">Un autre</button>
        <button class="btn primary" id="modalClose" type="button">On y va!</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
