1"},"p-couleurs":{nom:"Accords sans tierce : la couleur",duree:6,comment:["Joue Do \u2013 Sol \u2013 R\xE9 (quinte et neuvi\xE8me) au lieu de Do majeur.","Prom\xE8ne cette forme sur la gamme : un son ouvert, moderne.","Quelle chanson de nous deux vivrait l\xE0-dedans?"],src:"Levine 1989 \xB7 voicings ouverts"},"p-basse":{nom:"Une main gauche qui tient tout",duree:6,comment:["P\xE9dale : la m\xEAme basse quatre mesures, la main droite change au-dessus.","La basse descend d\u2019un pas par mesure : Do, Si, La, Sol.","Un ostinato de trois notes, r\xE9p\xE9t\xE9 jusqu\u2019\xE0 devenir un groove."],src:"Burger 2022 \xB7 Norgaard 2017"},"p-reharmo":{nom:"Une note, quatre accords",duree:8,comment:["Prends une seule note de la m\xE9lodie de Zaza : Mi.","Quatre accords qui la contiennent : Do, Lam, Mim, Famaj7.","La m\xEAme m\xE9lodie sur chacun : la couleur change, l\u2019\xE9motion aussi."],src:"Levine 1989 \xB7 r\xE9harmonisation"},"e-penta":{nom:"Pentatonique sans fausse note",duree:5,comment:["Tonalit\xE9 du jour, gamme pentatonique seulement.","Frog sur les notes de la pentatonique (ou les touches noires).","Zaza chante des voyelles par-dessus, puis la guitare rejoint."],src:"Chac\xF3n-L\xF3pez 2021 \xB7 Norgaard 2017"},"e-echo":{nom:"\xC9cho rythmique",duree:4,comment:["L\u2019un frappe ou joue une mesure, l\u2019autre la r\xE9p\xE8te exactement.","Apr\xE8s 8 \xE9changes, on inverse.","Puis on monte le tempo de 10 BPM."],src:"Edmund 2020 \xB7 Nikolaou 2023"},"e-gamme":{nom:"Gamme au m\xE9tronome",duree:5,comment:["La gamme de la tonalit\xE9 du jour, en noires puis en croches.","Ensemble, au m\xE9tronome, mouvements conjoints.","\xC9coutez les attaques : tombent-elles en m\xEAme temps?"],src:"Rotjan 2020 \xB7 Zhou 2025"},"e-regard":{nom:"Avec, puis sans se regarder",duree:5,comment:["Une boucle simple en se regardant.","La m\xEAme boucle dos \xE0 dos.","Qu\u2019est-ce qui a chang\xE9? Qui a pris le lead?"],src:"Bishop 2019"},"e-corps":{nom:"Corps et souffle",duree:3,c loge",["Sur l\u2019accueil, <b>Notre cycle</b> : la lune dans sa vraie phase, entour\xE9e de ses quatre temps, qui sont nos quatre gestes. <b>Semer</b> (les jours de la nouvelle lune) = cr\xE9er ; <b>faire grandir</b> (les deux semaines o\xF9 elle grossit) = fa\xE7onner ; <b>faire entendre</b> (les jours de la pleine lune) = produire ; <b>laisser aller</b> (la derni\xE8re semaine, quand elle d\xE9cro\xEEt) = trier et relire. Six lunes \u2248 nos six mois : chaque cycle est un tour complet du processus.","Pour chaque temps : ce qu\u2019il appelle, jusqu\u2019\xE0 quand, et ses outils (le relais, nos chansons, les prises, le mur\u2026). Et ce que le cycle a d\xE9j\xE0 donn\xE9 : id\xE9es sem\xE9es, id\xE9es qui ont grandi, prises entendues."]],["Nos intentions, sem\xE9es puis relues",["Chacun <b>s\xE8me</b> son intention du cycle, \xE0 la nouvelle lune (ou en cours de route). <b>La derni\xE8re semaine du cycle</b>, quand la lune d\xE9cro\xEEt, on la <b>relit</b> : a-t-elle \xE9t\xE9 tenue, transform\xE9e, ou l\xE2ch\xE9e sans regret ?"]],["Ce qu\u2019on se demande, au rythme de la lune",["Dans le relais, \xAB Ton intention \xBB devient <b>\xAB Ce que tu demandes \xE0\u2026 \xBB</b> (ce n\u2019est pas la m\xEAme chose que l\u2019intention du cycle). La lune sugg\xE8re quelques demandes (\u263E) : cr\xE9er \xE0 la nouvelle lune, d\xE9velopper quand elle grossit, \xE9couter \xE0 la pleine lune, trier quand elle d\xE9cro\xEEt."]]]},{v:"0.12",quand:"2026-10-26",titre:"La grille, et le plein \xE9cran",items:[["L\u2019oreille \xE9crit la grille",["Apr\xE8s l\u2019\xE9coute, <b>la grille par mesures</b>, comme une feuille d\u2019accords de musicien : 4 temps par mesure, \xAB % \xBB quand une mesure se r\xE9p\xE8te, et la boucle rep\xE9r\xE9e (\u2016: R\xE9m | Sol7 | Do | % :\u2016 \xD73). Le tempo de la grille se recale tout seul sur les changements d\u2019accords.","Touche une mesure pour l\u2019entendre. <b>Copier la grille</b> ou <b>\u2B07 la grille en texte</b>. Marche aussi sur un bout pris dans le filet."]],["Nos chansons s\u2019exportent",["Studio \u2192 Nos chansons : <b>\u2B07 La partition (MIDI)</b>, accords au piano et basse, au tempo du studio (les mesures tombent juste dans ton logiciel), et <b>\u2B07 La grille (texte)</b>, partie par partie."]],["Le vrai plein \xE9cran",["Un nouveau bouton en haut (les quatre coins) : la barre du navigateur dispara\xEEt. Le bouton \xAB Aa \xBB \xE0 c\xF4t\xE9, c\u2019est le grand texte pour jouer loin de l\u2019\xE9cran.","Sur t\xE9l\xE9phone : ajoute FLIP \xE0 l\u2019\xE9cran d\u2019accueil (Partager \u2192 Sur l\u2019\xE9cran d\u2019accueil) ; il s\u2019ouvre comme une app, sans barre, avec la flamme comme ic\xF4ne."]],["Plus direct",["Dans Nos nouvelles, chaque \xE9l\xE9ment m\xE8ne droit \xE0 lui : la fiche de l\u2019id\xE9e s\u2019ouvre au mur, la page du journal brille.","Notre vision devient un manifeste : la phrase qu\u2019on veut faire ressentir en grand, nos tonalit\xE9s sur un clavier, nos instruments c\xF4te \xE0 c\xF4te, nos r\xE9f\xE9rences et leur pourquoi.","Une t\xE2che pour chacun dans \xAB Par o\xF9 commencer \xBB : <b>dire pourquoi nos inspirations nous inspirent</b>."]]]},{v:"0.11",quand:"2026-10-26",titre:"La cath\xE9drale",items:[["Quelques nombres, tout un orchestre",["Labo \u2192 <b>La cath\xE9drale</b>. Une cl\xE9 de vo\xFBte (4 : 5 : 6 : 7, ou les disques que tu as fait tourner) est jou\xE9e \xE0 trois vitesses en m\xEAme temps : tr\xE8s lente, elle donne <b>la forme</b> (des parties de dur\xE9es 4, 5, 6, 7) ; moyenne, <b>le rythme</b> (4 contre 5 contre 6 contre 7, aux timbales, pizzicati, harpe, c\xE9lesta) ; rapide, <b>l\u2019harmonie</b> (le m\xEAme rapport entre les fr\xE9quences, en intonation juste, ce que le piano ne peut pas jouer).","Le labo b\xE2tit la cath\xE9drale ; vous d\xE9cidez <b>o\xF9 mettre la lumi\xE8re</b> : la famille qui chante chaque partie (cordes, bois, cuivres, ch\u0153ur, harpe, c\xE9lesta, ou presque rien), et un curseur du tout-rythme au tout-harmonie.","Puis : \u25B6 \xE9couter, <b>\u2B07 WAV</b>, <b>\u2B07 MIDI</b> (une famille par piste, \xE0 reprendre dans ton logiciel), ou garder au mur."]],["Un orchestre dans l\u2019app",["Onze nouvelles familles de sons enregistr\xE9s (FluidR3, licence MIT) : cordes, pizzicati, harpe, cor, cuivres, fl\xFBte, clarinette, hautbois, ch\u0153ur, timbales, c\xE9lesta. \xC0 entendre dans l\u2019arbre."]],["La tresse nourrit",["Sur le plan, ce que l\u2019autre t\u2019a lanc\xE9 et qui attend ta r\xE9ponse devient <b>la prochaine chose \xE0 faire</b>. Et Nos deux \xE2mes tire une piste de ce qui circule le plus entre vous."]],["Plus clair",["La pastille sur Plan m\xE8ne droit \xE0 Nos nouvelles, et l\u2019accueil les montre tout en haut.","\xAB Sur cette page \xBB est maintenant une liste en colonne, dans le mandat ; plus bas, un petit bouton la rouvre. Les cases du mandat sont plus compactes."]]]},{v:"0.10",quand:"2026-10-26",titre:"Notre \xE9lan",items:[["La tresse",["Une nouvelle page, <b>Notre \xE9lan</b> (sur l\u2019accueil, et depuis Nos nouvelles) : nos deux fils dans le temps, braise et m\xFBre. Chaque cr\xE9ation est un n\u0153ud sur son fil ; chaque r\xE9ponse, un lien d\u2019or d\u2019un fil \xE0 l\u2019autre.","Plus on \xE9change un jour, plus les fils se rapprochent ; pendant une s\xE9ance \xE0 deux, ils se croisent : plus vous jouez ensemble, plus ils se tressent. Les jours calmes, ils respirent.","Touche un n\u0153ud ou un lien : il raconte (\xAB Frog a mis de la musique sur \xAB Arcane majeur \xBB de Zaza, le lendemain \xBB). Et la page dit en mots qui lance, qui r\xE9pond, en combien de temps, ce qui circule le plus et ce qui attend, sans h\xE2te. Pas de score."]]]},{v:"0.9",quand:"2026-10-26",titre:"Tout ce que je t\u2019envoie, au m\xEAme endroit",items:[["Nos nouvelles",["Une pastille sur <b>Plan</b> compte ce que l\u2019autre a ajout\xE9 et que tu n\u2019as pas encore vu. L\u2019accueil m\xE8ne \xE0 <b>Nos nouvelles</b> : tout, jour par jour, avec deux cases. <b>Vu</b>, et <b>J\u2019ai fait \xE7a</b> quand on demandait quelque chose.","De l\u2019autre c\xF4t\xE9, on voit ce que l\u2019autre a vu et fait de nos envois. M\xEAme chose dans le relais, sous chaque envoi."]],["Le relais en mots",["Une carte de mots (une arcane, des paroles) se r\xE9pond enfin : <b>\u25CF De la musique sur ces mots</b> (les mots restent sous tes yeux pendant que tu joues), <b>\u270E R\xE9pondre en mots</b>, ou <b>Placer ces mots sur une pi\xE8ce</b>."]],["Le mur, \xE9pur\xE9",["Un champ, et cinq gestes en ic\xF4nes : m\xE9mo vocal, fichier audio, image, bravo, bilan. Les filtres et le projet se cachent sous <b>Filtrer</b> ; les r\xE9glages, l\u2019invitation et le lexique sous \u2699.","<b>Cr\xE9er un morceau</b>, m\xEAme quand il n\u2019y en a aucun : vue Morceaux \u2192 \xAB Un nouveau morceau \xBB. Il na\xEEt avec un couplet et un refrain au studio, et chaque id\xE9e du mur peut le rejoindre. Un morceau du mur et une chanson du studio, c\u2019est maintenant la m\xEAme chose."]],["Nos couleurs",["<b>Braise</b> pour Zaza (le feu de FLIP, la pointe de la fl\xE8che), <b>m\xFBre</b> pour Frog (la nuit du studio). Lisibles, et distinctes m\xEAme pour un daltonien."]],["Plus stable",["S\xE9ance, \xE9tape 4 : la page ne saute plus \xE0 chaque choix de grille, et les cartes ne d\xE9bordent plus au t\xE9l\xE9phone.","Le filet a un vrai bouton <b>\u23FB Arr\xEAter le filet</b>."]]]},{v:"0.8",quand:"2026-10-26",titre:"Les mots justes",items:[["Le mot ouvert",["Partout o\xF9 l\u2019on \xE9crit (journal, paroles, Placer, relais\u2026), <b>double-clique un mot</b> : ses syllabes, ses <b>rimes class\xE9es</b> de la plus riche \xE0 la plus simple (avec le nombre de syllabes de chacune, et un filtre \xAB m\xEAme nombre de syllabes \xBB), et ses <b>synonymes par sens</b>, des plus courants aux plus rares.","Touche un synonyme : il remplace le mot (Ctrl+Z pour revenir). Touche une rime : elle est copi\xE9e, pr\xEAte \xE0 finir une ligne.","Les synonymes viennent maintenant du dictionnaire libre de LibreOffice (myThes, 36 000 mots), <b>gard\xE9 dans l\u2019app</b> : ils marchent m\xEAme sans Internet."]],["Nos inspirations, pr\xE9cis\xE9ment",["\xC9tape 1 \u2192 Mes styles : pour chaque artiste ou morceau, <b>ce que tu aimes dedans</b> (la rythmique, la voix, le texte, le son, l\u2019ambiance\u2026), une pr\xE9cision en mots, et <b>le moment exact</b> (\xAB \xE0 2:14 \xBB) : le lien YouTube s\u2019ouvre pile l\xE0. Jusqu\u2019\xE0 six inspirations.","Le portrait dit <b>ce qu\u2019on cherche tous les deux</b> dans une chanson, et Nos deux \xE2mes en tire des pistes pour commencer (\xAB Le groove d\u2019abord \xBB, \xAB La voix devant \xBB\u2026)."]]]},{v:"0.7",quand:"2026-10-26",titre:"Rien de ce que tu joues ne se perd",items:[["Le filet",["Un nouveau bouton en haut, \xE0 c\xF4t\xE9 de l\u2019ampoule : <b>le filet</b>. Tendu, il garde toujours la <b>derni\xE8re minute</b> (ou 3, ou 5, au choix dans Mon mat\xE9riel) de ce qui joue : le son de l\u2019app, tes entr\xE9es audio, les notes de tes claviers MIDI.","Un beau moment vient de passer ? Touche le filet : la minute se fige. Chaque source a sa ligne, les notes MIDI aussi. <b>Glisse pour choisir le bout</b> (le silence avant et apr\xE8s est d\xE9j\xE0 coup\xE9), coche les sources \xE0 m\xE9langer, \xE9coute.","Puis : <b>Garder au mur</b>, <b>L\u2019oreille</b> (elle trouve les accords du bout), <b>\u2B07 WAV</b> pour le son, <b>\u2B07 MIDI</b> pour les notes, \xE0 ouvrir dans ton logiciel.","Rien ne quitte l\u2019ordinateur tant que tu ne gardes pas le bout. Le filet se retend tout seul \xE0 ta prochaine visite. L\u2019<b>anneau d\u2019or</b> autour du bouton se remplit : plein, le filet a toute sa dur\xE9e ; avant, il affiche depuis combien de temps il \xE9coute."]],["Mon mat\xE9riel",["Studio \u2192 <b>Mon mat\xE9riel et le filet</b> : ton studio redessin\xE9, vu d\u2019en haut. <b>D\xE9tecter mon mat\xE9riel</b> trouve tes entr\xE9es audio et tes claviers MIDI ; la Xone:4D, le SV-1 ou ce qui n\u2019est pas branch\xE9 \xE0 l\u2019ordi s\u2019ajoutent \xE0 la main, \xAB branch\xE9s \xE0 \xBB l\u2019appareil qui les re\xE7oit.","Une <b>case par appareil</b> : actif ou pas aujourd\u2019hui. Les c\xE2bles s\u2019allument, les t\xE9moins clignotent quand les notes passent, les niveaux bougent quand le son entre.","Glisse les appareils pour les placer comme dans ta pi\xE8ce : l\u2019app s\u2019en souvient. Un clavier MIDI muet peut <b>sonner au piano</b> d\u2019un clic."]]]},{v:"0.6",quand:"2026-10-26",titre:"Plus lisible, plus \xE0 toi",items:[["Le studio t\u2019\xE9coute mieux",["<b>Touche un accord</b> de la grille pour le changer sur place : sa note, sa couleur, sa dur\xE9e. \u25B6 pour l\u2019entendre, + pour en ajouter un apr\xE8s.","Le clavier : <b>coche ce que tu veux voir</b> (l\u2019accord qui joue, la pentatonique, la gamme, les couleurs jazz, les notes blues). La l\xE9gende montre chaque couleur sur une touche blanche <i>et</i> sur une touche noire : le rose fonc\xE9, c\u2019est la pentatonique pos\xE9e sur une noire.","Quand tu changes la <b>tonalit\xE9</b>, le clavier allume la note maison et son accord, et te le fait entendre. Un point d\u2019or marque la tonique."]],["Moins de d\xE9filement",["En haut de chaque page, trois cases courtes : <b>\xC7a sert \xE0 \xB7 Tu peux \xB7 \xC7a nourrit</b>, en points, avec une petite image. Repliables d\u2019un clic.","<b>Sur cette page</b> reste coll\xE9 en haut : un clic et tu sautes \xE0 la section.","Le menu \u271A Plus du mur ne passe plus derri\xE8re les autres \xE9l\xE9ments."]],["L\u2019arbre se lit au doigt",["<b>Touche un point</b> de l\u2019arbre : sa fiche s\u2019ouvre (ce que fait le fichier dans ses propres mots, d\u2019o\xF9 il vient, quand il est n\xE9 et a \xE9t\xE9 retouch\xE9). Les sons s\u2019\xE9coutent de l\xE0.","Dans la g\xE9n\xE9alogie, chaque point ouvre l\u2019\xE9tape : ce qu\u2019elle a fait, combien de fichiers et de lignes. \u2190 \u2192 pour remonter le fil."]]]},{v:"0.5",quand:"2026-10-25",titre:"Tout \xE7a, pour toi",items:[["Tes accords \xE0 toi",["Studio \u2192 <b>\u270E Mes propres accords</b> : choisis chaque accord, sa couleur (maj7, sus2, m9\u2026) et sa dur\xE9e (1 temps \xE0 2 mesures). Tout change en direct, pendant que \xE7a joue.","<b>Taper le tempo</b> : tape le bouton au rythme, le labo trouve les BPM.","Studio \u2192 <b>Nos chansons</b> : monte une toune enti\xE8re, avec intro, couplet, refrain et pont, chacun avec ses accords, dans l\u2019ordre que tu veux (Couplet 2 = le m\xEAme couplet). \u25B6 Toute la chanson.","Le clavier en couleurs, avec sa l\xE9gende : l\u2019accord qui joue (s\xFBr \xE0 100 %), la pentatonique, le reste de la gamme, les couleurs jazz et les notes blues."]],["L\u2019oreille trouve tes accords",["Enregistre un bout de ton clavier au micro, ou d\xE9pose un fichier : L\u2019oreille te donne la suite d\u2019accords, temps par temps. Un bouton l\u2019envoie au studio pour improviser dessus.","Branch\xE9 en MIDI, Studio \u2192 Mon instrument les lit en direct, encore plus juste.","Sur une pi\xE8ce, elle dit maintenant <b>ce qui brille d\xE9j\xE0</b> et <b>ce qui est \xE0 retravailler</b> (l\u2019\xE9nergie qui retombe, une partie sans relief).","Sur une voix seule : les meilleures notes et celles \xE0 travailler, gard\xE9es dans le profil."]],["Plus clair, partout",["Les mots de musique sont soulign\xE9s en pointill\xE9 : passe dessus (ou touche-les) pour une explication simple. Les onglets du menu ont aussi leur aper\xE7u.","L\u2019accueil commence par <b>Par o\xF9 commencer</b> : trois gestes, dans l\u2019ordre.","<b>Cr\xE9er \u2192 Fa\xE7onner \u2192 Produire</b> : on voit o\xF9 en est notre musique, et quels outils servent \xE0 quel moment.","S\xE9ance : les grilles ont des noms clairs (\xAB Vamp : deux accords en boucle \xBB\u2026), notre grille du studio y est propos\xE9e, et chaque exercice a son <b>Concr\xE8tement</b>, souvent avec un exemple \xE0 entendre."]],["Rien ne se perd",["Les prises du studio se gardent au mur d\u2019un clic : l\u2019autre les entend, et elles comptent dans le plan.","\xC9crire \u2192 <b>Nos id\xE9es pour le labo</b> : note ce que tu voudrais changer ou ajouter dans l\u2019app.","Les essais d\u2019hier sont effac\xE9s ; nos deux portraits sont gard\xE9s."]],["Tu m\u2019as demand\xE9 d\u2019o\xF9 venaient les sons",["<b>L\u2019arbre de l\u2019architecte</b> (lien sur l\u2019accueil) : toute la structure de Diapason Labo, dossiers et fichiers, en un grand arbre. Et en dessous, d\u2019o\xF9 vient chaque son : la batterie est fabriqu\xE9e en direct, le piano est enregistr\xE9, ta musique est la tienne. \u25B6 pour entendre chaque son.","Et tu peux <b>remplacer chaque son de batterie par le tien</b> : \u25CF Mon son (tu frappes, le labo garde le coup) ou un fichier. Il joue partout, pour nous deux : Studio \u2192 Beat \u2192 Nos sons de batterie."]],["Pour nous deux",["<b>Nos deux \xE2mes</b> : l\u2019arc et le triskel, ce que nos deux \xE9tapes 1 donnent ensemble, nos frottements f\xE9conds, et huit pistes hors sentier tir\xE9es de nos propres mots.","<b>Placer mes paroles</b> : sur Projet 1 ou Joy Walk, o\xF9 poser les accents, combien de syllabes, quelle note chanter."]]]}],em=e=>`diapason:maj:version ${e}:${q.id}`});ve();Ae();Kt();Ce();fe();var Hs=864e5,Ti=new Set(["note","texte","audio","essai","paroles"]),Nn=e=>e.data&&Number.isInteger(e.data.stage)?e.data.stage:e.type==="paroles"?2:0,ph=e=>e.type==="paroles"?e.title||"Sans titre":e.data?.song||"",ta=()=>q.meta?.plan?.start?new Date(`${q.meta.plan.start}T12:00`).getTime():null;function bt(){let e=ta();return e?Math.max(1,Math.min(6,Math.floor((Date.now()-e)/(30.44*Hs))+1)):0}function aa(){let e=q.entries.filter(n=>Ti.has(n.type)),t=new Map,a=[];e.forEach(n=>{let r=ph(n);r?t.set(r,Math.max(t.get(r)??0,Nn(n))):a.push(Nn(n))});let s=[...t.values(),...a],o=q.entries.filter(n=>n.type==="paroles"&&(n.data?.sections||[]).filter(r=>r.text.trim . Solide : elle donne la puissance."],[/septièmes?/i,"Septi\xE8me","Une note ajout\xE9e \xE0 l\u2019accord, qui le colore : plus jazz, plus soul, plus r\xEAveur."],[/\bmaj7\b/i,"maj7","Un accord majeur avec une septi\xE8me en plus : r\xEAveur, doux, un peu flottant."],[/\bsus[24]\b/i,"sus2 / sus4","Un accord \xAB suspendu \xBB, sans tierce : ni joyeux ni triste, comme en attente."],[/\bmajeurs?\b/i,"Majeur","Une couleur lumineuse, ouverte, souvent joyeuse."],[/\bmineurs?\b/i,"Mineur","Une couleur plus sombre, plus intime, souvent m\xE9lancolique."],[/\briffs?\b/i,"Riff","Une courte phrase musicale qui revient en boucle et qu\u2019on reconna\xEEt tout de suite."],[/\bmumble\b/i,"Mumble","Chanter des sons sans vrais mots sur la musique, pour trouver la m\xE9lodie et le rythme. Les mots viennent apr\xE8s."],[/prosodie/i,"Prosodie","L\u2019accord entre les mots et la musique : les syllabes appuy\xE9es sur les temps forts. Sinon, le texte \xAB boite \xBB."],[/polyrythm(ie|e)s?/i,"Polyrythmie","Deux rythmes diff\xE9rents en m\xEAme temps (3 contre 2, par exemple). \xC7a cr\xE9e un tissu qui tourne."],[/\bMIDI\b/,"MIDI","Le c\xE2ble ou l\u2019USB qui envoie les touches jou\xE9es au clavier vers l\u2019ordinateur. L\u2019app sait alors exactement quelles notes, sans micro."],[/\bnappes?\b/i,"Nappe","Un son long et doux tenu en fond, qui enveloppe la chanson."],[/pédales?/i,"P\xE9dale","Une note de basse qui ne bouge pas pendant que les accords changent par-dessus."],[/justesse/i,"Justesse","Chanter exactement la bonne note, ni un peu trop haut, ni un peu trop bas."],[/\bharmoni(e|es|que)\b/i,"Harmonie","Les notes jou\xE9es ensemble, les accords, qui accompagnent la m\xE9lodie."],[/\btimbres?\b/i,"Timbre","La couleur d\u2019un son : pourquoi un piano et une voix sur la m\xEAme note ne sonnent pas pareil."],[/\boctaves?\b/i,"Octave","La m\xEAme note, plus aigu\xEB ou plus grave. Do3 et Do4 sont \xE0 une octave."],[/demi-tons?/i,"Demi-ton","Le plus petit \xE9cart du piano : d\
