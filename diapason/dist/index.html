inte",name:"Quinte / h\xE9miole",ratios:[2,3],label:"2 : 3",rhythm:"Le \xAB 3 contre 2 \xBB des musiques africaines, du flamenco et de la valse.",pitch:"Une quinte juste : Do et Sol. Le son des chants de puissance."},{id:"quarte",name:"Quarte",ratios:[3,4],label:"3 : 4",rhythm:"Polyrythme 4 contre 3 : \xE7a tourne, \xE7a d\xE9route.",pitch:"Une quarte : le d\xE9but de \xAB \xD4 Canada \xBB et de nombreux hymnes."},{id:"maj",name:"Accord majeur",ratios:[4,5,6],label:"4 : 5 : 6",rhythm:"Trois rythmes qui ne se retrouvent qu\u2019une fois par cycle.",pitch:"Un accord majeur \xAB pur \xBB : lumineux, stable."},{id:"min",name:"Accord mineur",ratios:[10,12,15],label:"10 : 12 : 15",rhythm:"Un polyrythme complexe : ils se retrouvent rarement.",pitch:"Un accord mineur : plus sombre, plus tendu."},{id:"triton",name:"Triton",ratios:[5,7],label:"5 : 7",rhythm:"Un 5 contre 7 : presque impossible \xE0 taper.",pitch:"Le \xAB diabolus in musica \xBB : instable, il veut bouger."}],Ke={home:{intro:"Diapason, c\u2019est un labo : on y observe, on y teste des hypoth\xE8ses, on y cr\xE9e. Chaque module ouvre une question plus grande que la musique.",questions:["Si tu pouvais voir le son, \xE0 quoi ressemblerait le silence?","Qu\u2019est-ce qui rend une voix unique : la hauteur, le timbre, ou ce qu\u2019elle raconte?","Est-ce que la musique, c\u2019est des maths qu\u2019on peut danser?"],liens:["Musique \u2014 Inventer, Interpr\xE9ter, Appr\xE9cier","CCN \u2014 Innover et faire preuve de cr\xE9ativit\xE9 avec le num\xE9rique"],hors:"Commence la p\xE9riode sans rien dire : projette le Miroir, chante une note, et laisse les \xE9l\xE8ves deviner ce qui se passe."},miroir:{intro:"Le Miroir rend visible une chose invisible : la hauteur du son. C\u2019est la porte d\u2019entr\xE9e id\xE9ale pour apprivoiser sa voix sans jugement.",questions:["Quand tu parles, ta voix monte-t-elle \xE0 la fin d\u2019une question? V\xE9rifie!","Peux-tu dessiner une montagne, un escalier, une vague\u2026 avec ta voix?","Pourquoi la ligne tremble-t-elle un peu m\xEAme quand tu crois tenir la note?","Siffle, puis chante la m\xEAme note : est-ce la m\xEAme hauteur \xE0 l\u2019\xE9cran?"],defis:["Dessine la lettre M avec ta voix.","Tiens une ligne parfaitement droite pendant 5 secondes.","Reproduis la m\xE9lodie de la sonnerie de l\u2019\xE9cole."],liens:["Musique \u2014 Interpr\xE9ter (justesse, contr\xF4le du souffle)","Science et technologie \u2014 fr\xE9quence et hauteur du son","Fran\xE7ais \u2014 intonation \xE0 l\u2019oral"],hors:"Fais lire le m\xEAme vers par trois \xE9l\xE8ves : col\xE8re, joie, peur. Comparez les dessins. L\u2019\xE9motion a une forme!"},tessiture:{intro:"L\u2019Empreinte mesure l\u2019\xE9tendue confortable d\u2019une voix, puis superpose celles du groupe pour trouver la zone o\xF9 tout le monde peut chanter ensemble.",questions:["Pourquoi les voix changent-elles \xE0 l\u2019adolescence (la mue)?","Si la zone commune de la classe est petite, que peut-on faire pour chanter ensemble quand m\xEAme?","Ton \xE9tendue est-elle la m\xEAme le matin et l\u2019apr\xE8s-midi? Teste!","Pourquoi dit-on qu\u2019un instrument a un \xAB diapason \xBB?"],defis:["Trouve une chanson connue qui tient enti\xE8rement dans la zone commune du groupe.","Calcule ton \xE9tendue en demi-tons, puis en octaves (fraction!)."],liens:["Musique \u2014 Interpr\xE9ter (choix de tonalit\xE9)","Math\xE9matique \u2014 intervalles, fractions, rapports","\xC9ducation \xE0 la sant\xE9 \u2014 hygi\xE8ne vocale"],hors:"Construis une \xAB carte m\xE9t\xE9o vocale \xBB du groupe chaque mois : la mue devient un ph\xE9nom\xE8ne scientifique qu\u2019on observe, pas une g\xEAne."},gym:{intro:"Le Gym vocal transforme l\u2019\xE9chauffement en jeu : des exercices transpos\xE9s \xE0 ta voix, avec une r\xE9troaction visuelle imm\xE9diate.",questions:["Pourquoi commence-t-on un \xE9chauffement par le grave et le doux?","Ton score est-il meilleur quand tu \xE9coutes d\u2019abord, ou quand tu chantes tout de suite?","Quelle note te donne le plus de difficult\xE9? Pourquoi celle-l\xE0, selon toi?"],defis:["Atteins 80 % sur l\u2019Escalier de 5.","Fais le Grand saut les yeux ferm\xE9s, puis compare ton score.","Invente ton propre exercice (5 notes) et fais-le chanter \xE0 un ou une camarade."],liens:["Musique \u2014 Interpr\xE9ter (justesse, posture, respiration)","\xC9ducation physique et \xE0 la sant\xE9 \u2014 respiration, posture","CCN \u2014 D\xE9velopper sa pens\xE9e critique envers le num\xE9rique (que mesure vraiment le score?)"],hors:"D\xE9bat : un logiciel peut-il juger si on chante \xAB bien \xBB? Qu\u2019est-ce qu\u2019il ne voit pas?"},labo:{intro:"Le module le plus surprenant : un rythme qui acc\xE9l\xE8re au-del\xE0 de ~20 battements par seconde cesse d\u2019\xEAtre un rythme et devient une note. Les m\xEAmes rapports donnent des polyrythmes\u2026 ou des accords.",questions:["\xC0 partir de combien de battements par seconde ton oreille entend-elle une note plut\xF4t qu\u2019un rythme?","Pourquoi le rapport 2 : 3 sonne-t-il \xAB bien \xBB autant en rythme qu\u2019en harmonie?","Le cin\xE9ma montre 24 images par seconde : y a-t-il un lien avec ce seuil?","Un accord, est-ce trois rythmes trop rapides pour \xEAtre compt\xE9s?"],defis:["Trouve \xE0 l\u2019oreille la vitesse exacte o\xF9 le rythme \xAB bascule \xBB en note. Comparez vos r\xE9ponses.","Tape le polyrythme 2 : 3 avec tes deux mains pendant 8 cycles.","Calcule : \xE0 60 BPM, combien de Hz? Et \xE0 240 BPM?","Construis 4 disques 4 : 5 : 6 : 7. Quel accord entends-tu? Coupe un disque \xE0 la fois : lequel change le plus la couleur?","Trouve un m\xE9lange dont la ligne blanche (la somme) se r\xE9p\xE8te le plus vite possible. Pourquoi?"],liens:["Math\xE9matique \u2014 rapports, proportions, fractions, fonctions exponentielles","Science et technologie \u2014 ondes, fr\xE9quence, perception","Musique \u2014 Appr\xE9cier (consonance, dissonance)"],hors:"Faites un \xAB polyrythme humain \xBB : un groupe tape 2, l\u2019autre 3. Puis expliquez que vos claviers font exactement \xE7a, 100 fois plus vite."},studio:{intro:"Le Studio est l\u2019endroit o\xF9 on invente : un beat, une suite d\u2019accords, une prise de voix, une pochette. Assez pour produire une vraie premi\xE8re chanson.",questions:["Pourquoi la m\xEAme suite d\u2019accords peut-elle sonner joyeuse ou triste selon o\xF9 elle commence?","Quelles notes sont \xAB s\xFBres \xBB pour improviser sur chaque accord? Pourquoi celles-l\xE0?","Qu\u2019est-ce qu\u2019une pochette dit de la musique avant m\xEAme qu\u2019on l\u2019\xE9coute?","En duo, qui d\xE9cide? Comment partager l\u2019espace sonore?","Regarde la constellation de ta m\xE9lodie : monte-t-elle, descend-elle, fait-elle des vagues? Qu\u2019est-ce que \xE7a raconte?"],defis:["Cr\xE9e un beat qui donne envie de marcher vite, puis un beat qui donne envie de dormir.","\xC9cris 4 lignes de texte qui tiennent sur la progression \xAB M\xE9lancolie \xBB.","Enregistre une prise, r\xE9\xE9coute, nomme UNE chose \xE0 am\xE9liorer et refais-la.","Sc\xE8ne en duo : la r\xE9ponse doit reprendre UNE id\xE9e de la question (m\xEAme rythme ou m\xEAme note de d\xE9part).","Tourne un clip de ta boucle, puis pr\xE9sente-le au groupe en une phrase : \xAB Ma chanson parle de\u2026 \xBB."],liens:["Musique \u2014 Inventer des pi\xE8ces vocales ou instrumentales","Musique \u2014 Appr\xE9cier ses r\xE9alisations et celles de ses camarades","CCN \u2014 Produire du contenu avec le num\xE9rique","Fran\xE7ais \u2014 \xE9criture cr\xE9ative (paroles)"],hors:"Lancez une \xAB maison de disques \xBB de classe : chaque duo produit un titre, une pochette et une phrase de pr\xE9sentation. \xC9coute collective en fin d\u2019\xE9tape."}};Ke.paroles={intro:"L\u2019atelier fait le pont entre le fran\xE7ais et la musique : on \xE9crit pour la voix. Les syllabes, le e muet et la rime deviennent des outils de cr\xE9ation, pas des r\xE8gles \xE0 r\xE9citer.",questions:["Pourquoi le e muet se chante-t-il parfois, et parfois non?","Un refrain qui marche : qu\u2019est-ce qui le rend facile \xE0 retenir?","Rime riche ou assonance : laquelle sonne le plus \xAB chanson \xBB? Le plus \xAB rap \xBB?","Que faire d\u2019un trou dans le texte : le combler tout de suite, ou le laisser m\xFBrir?"],defis:["\xC9cris un refrain de 4 lignes de 8 syllabes chacune, avec un sch\xE9ma AABB.","Remplace 3 mots par des synonymes plus imag\xE9s.","\xC9change ton couplet avec ton duo : chacun marque un passage [? incertain ?] chez l\u2019autre."],liens:["Fran\xE7ais \u2014 \xC9crire des textes vari\xE9s (po\xE9sie, chanson)","Musique \u2014 Inventer (texte et m\xE9lodie)","CCN \u2014 Collaborer \xE0 l\u2019aide du num\xE9rique"],hors:"Lisez le refrain \xE0 voix haute en tapant le rythme dans les mains : l\xE0 o\xF9 \xE7a accroche, il y a une syllabe de trop."};Ke.carnet={intro:"Le carnet garde la trace de la d\xE9marche : essais, prises, bilans, \xE9valuations. C\u2019est la m\xE9moire du duo, et une mati\xE8re riche pour l\u2019\xE9valuation de la comp\xE9tence.",questions:["Qu\u2019est-ce qu\u2019un essai rat\xE9 vous a appris cette semaine?","Relisez vos trois derniers bilans : qu\u2019est-ce qui revient?","Votre auto\xE9valuation et celle de votre partenaire se ressemblent-elles? Pourquoi?"],defis:["Faites un bilan de 3 minutes \xE0 la fin de chaque s\xE9ance, sans exception, pendant 2 semaines.","D\xE9posez un m\xE9mo vocal de 20 secondes : l\u2019id\xE9e la plus folle de la journ\xE9e."],liens:["Musique \u2014 Appr\xE9cier ses r\xE9alisations et celles de ses pairs","CCN \u2014 Collaborer \xE0 l\u2019aide du num\xE9rique","CCN \u2014 D\xE9velopper et mobiliser ses habilet\xE9s technologiques"],hors:"Projetez le carnet d\u2019un duo (avec son accord) et faites deviner aux autres la prochaine \xE9tape de leur chanson."};var Xa=["Chante ton pr\xE9nom sur 3 notes diff\xE9rentes. Le groupe doit les reproduire.","Fais une \xAB conversation \xBB avec ta voix sans aucun mot : seulement des montagnes et des vall\xE9es.","Trouve un son dans la classe qui a une hauteur pr\xE9cise. Mesure-le dans le Miroir!","Chante une note, puis la m\xEAme note une octave plus haut. Combien de fois plus rapide vibre-t-elle?","En 2 minutes : invente un beat qui repr\xE9sente ta journ\xE9e.","Fais deviner une \xE9motion au groupe en ne chantant qu\u2019une seule voyelle.","Trouve la vitesse du Labo qui correspond \xE0 ton rythme cardiaque.","Imite un animal avec ta voix : quelle note le Miroir d\xE9tecte-t-il?","Un ou une \xE9l\xE8ve chante une note, la classe doit tenir la m\xEAme note pendant 5 secondes en \xE9coutant.","Choisis une pochette g\xE9n\xE9r\xE9e au hasard et invente le titre de la chanson qui va avec."],Ye=[{id:"note",label:"Note",aide:"Une id\xE9e, un lien, une consigne, un mot pour ton duo.",placeholder:"Ex. : Id\xE9e de titre pour la chanson 2"},{id:"texte",label:"\xC9crit",aide:"Un brouillon, un po\xE8me, un bout de texte \xE0 proposer. Pour \xE9crire une chanson compl\xE8te, utilise l\u2019atelier de paroles.",placeholder:"Ex. : Premier jet du couplet"},{id:"audio",label:"Audio",aide:"Un m\xE9mo vocal du cellulaire, une prise d\u2019instrument, une id\xE9e de m\xE9lodie. Ton duo peut l\u2019\xE9couter tout de suite.",placeholder:"Ex. : Riff de guitare pour le refrain"},{id:"essai",label:"Essai",aide:"Ce que vous avez tent\xE9 : ce qui a march\xE9, ce qui n\u2019a pas march\xE9. Les essais rat\xE9s sont pr\xE9cieux.",placeholder:"Ex. : Refrain une octave plus haut"},{id:"bilan",label:"Bilan",aide:"\xC0 la fin de chaque s\xE9ance : 3 minutes, \xE0 deux, pour garder la trace et d\xE9cider de la suite.",placeholder:"Bilan du jour"},{id:"evaluation",label:"\xC9valuation",aide:"Auto\xE9valuation, \xE9valuation par le ou la partenaire ou par l\u2019enseignant\xB7e, sur les m\xEAmes crit\xE8res.",placeholder:"Ex. : \xC9valuation de mi-\xE9tape"}],Pt=["Qu\u2019avons-nous cr\xE9\xE9 ou appris aujourd\u2019hui?","Un moment o\xF9 on s\u2019est vraiment \xE9c
