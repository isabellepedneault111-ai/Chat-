rd 2017"},"e-echo":{nom:"\xC9cho rythmique",duree:4,comment:["L\u2019un frappe ou joue une mesure, l\u2019autre la r\xE9p\xE8te exactement.","Apr\xE8s 8 \xE9changes, on inverse.","Puis on monte le tempo de 10 BPM."],src:"Edmund 2020 \xB7 Nikolaou 2023"},"e-gamme":{nom:"Gamme au m\xE9tronome",duree:5,comment:["La gamme de la tonalit\xE9 du jour, en noires puis en croches.","Ensemble, au m\xE9tronome, mouvements conjoints.","\xC9coutez les attaques : tombent-elles en m\xEAme temps?"],src:"Rotjan 2020 \xB7 Zhou 2025"},"e-regard":{nom:"Avec, puis sans se regarder",duree:5,comment:["Une boucle simple en se regardant.","La m\xEAme boucle dos \xE0 dos.","Qu\u2019est-ce qui a chang\xE9? Qui a pris le lead?"],src:"Bishop 2019"},"e-corps":{nom:"Corps et souffle",duree:3,comment:["Une consigne de mouvement : balancer, marcher le tempo, respirer ensemble.","\xC9paules basses, m\xE2choire molle.","Le corps pr\xEAt avant les doigts et la voix."],src:"Siljam\xE4ki 2021 \xB7 MacGlone 2024"},"i-appel":{nom:"Appel-r\xE9ponse sur 2 mesures",duree:8,comment:["Zaza (voix ou guitare) lance 2 mesures.","Frog (piano) r\xE9pond sur 2 mesures.","Apr\xE8s 8 \xE9changes : on inverse les r\xF4les."],src:"Bertolani 2019 \xB7 Nikolaou 2023"},"i-nonrep":{nom:"Non-r\xE9p\xE9tition",duree:8,comment:["Chaque nouveau passage doit changer UN param\xE8tre : rythme, registre, texture, nuance.","Interdit de rejouer la m\xEAme chose.","Notez le param\xE8tre qui a le plus surpris."],src:"Bertolani 2019"},"i-eco":{nom:"\xC9conomie de mat\xE9riau",duree:8,comment:["Limite stricte : une note tenue, OU une cellule de 3 notes, OU un seul intervalle.","Tout le reste vient du rythme, du timbre, des effets.","Moins de choix = plus d\u2019\xE9coute."],src:"De Bruin 2019 \xB7 Sayers 2025"},"i-theme":{nom:"Impro sur un th\xE8me externe",duree:10,comment:["Choisissez un point de d\xE9part : une photo, un mot, un souvenir commun.","Jouez-le sans en parler.","Comparez ensuite : aviez-vous la m\xEAme image?"],src:"Price 2026 \xB7 Bertolani 2019"},"i-image":{nom:"Image et m\xE9taphore",duree:8,comment:["Une image concr\xE8te : \xAB une rue mouill\xE9e \xE0 3 h du matin \xBB.","Frog cherche le timbre et la texture dans les effets.","Zaza cherche la couleur de la voix et de la guitare."],src:"Biasutti 2017 \xB7 MacGlone 2024"},"i-degres":{nom:"Degr\xE9s 1, 2, 3, 5 sur I\u2013IV\u2013V\u2013I",duree:8,comment:["Grille I\u2013IV\u2013V\u2013I en boucle.","La voix (ou la main droite) se limite aux degr\xE9s 1, 2, 3 et 5.","Pr\xE9cision d\u2019abord, libert\xE9 ensuite."],src:"Clauhs 2021 \xB7 Burger 2022"},"i-libre":{nom:"Impro libre",duree:10,comment:["Sans plan, sans grille.","Enregistrez tout : vous trierez plus tard.","Laissez de l\u2019espace \xE0 l\u2019autre."],src:"Aslan 2016"},"i-preentendre":{nom:"Pr\xE9-entendre",duree:5,comment:["Humez ou chantez la ligne AVANT de la jouer.","Puis jouez-la telle que vous l\u2019avez entendue dans votre t\xEAte.","L\u2019oreille d\u2019abord, les doigts ensuite."],src:"Vilnite 2023"},"a-fragment":{nom:"Un fragment, trois variations",duree:15,comment:["Isolez 10 \xE0 30 secondes qui vous ont allum\xE9s.","Variation 1 : nuances. Variation 2 : accents. Variation 3 : densit\xE9 (plus plein, plus vide).","Enregistrez les trois, gardez la meilleure."],src:"Prichard 2021 \xB7 Bennett 2021 \xB7 Nikolaou 2023"},"a-syncope":{nom:"Le clavier en syncope",duree:8,comment:["La guitare tient la pulsation.","Frog place des accents syncop\xE9s \xE0 contretemps.","Deux couches qui se superposent au lieu de se doubler."],src:"Merch\xE1n-S\xE1nchez-Jara 2023"},"a-abab":{nom:"Forme A-B-A-B",duree:10,comment:["A : texture d\xE9pouill\xE9e, guitare et voix.","B : les textures et effets du clavier entrent, changement de registre.","Id\xE9al pour les premi\xE8res s\xE9ances."],src:"Spring 1995 \xB7 Bertolani 2019"},"a-pont":{nom:"Gabarit avec pont",duree:10,comment:["Intro \u2013 Couplet A \u2013 Couplet B \u2013 Pont \u2013 Outro.","Solo optionnel de 8 mesures apr\xE8s le pont, pas plus.","Le pont r\xE9v\xE8le les probl\xE8mes d\u2019entr\xE9es : c\u2019est voulu."],src:"Carter 2016 \xB7 Montemayor 2014"},"a-zones":{nom:"Zones fixes, zones libres",duree:8,comment:["Verrouillez le tempo et les transitions aux extr\xE9mit\xE9s.","Laissez une zone ouverte \xE0 l\u2019impro au milieu.","\xC9crivez sur le mur o\xF9 sont les zones."],src:"Geyer 2025"},"a-chunks":{nom:"Petits tron\xE7ons, ordre vari\xE9",duree:10,comment:["R\xE9p\xE9tez section par section, courtes.","Changez l\u2019ordre des sections chaque semaine.","Finissez par un passage complet."],src:"Carter 2016 \xB7 Veniel-Mart\xED 2026"},"c-entree":{nom:"Le signal d\u2019entr\xE9e",duree:5,comment:["D\xE9signez qui m\xE8ne chaque entr\xE9e.","Le leader fait un hochement de t\xEAte ample : il monte, puis ralentit.","L\u2019autre attaque pendant le ralenti du geste. R\xE9p\xE9tez 5 d\xE9parts."],src:"Bishop 2017 \xB7 Chang 2017"},"c-reperes":{nom:"Nos rep\xE8res convenus",duree:5,comment:["Notez les respirations, les points d\u2019orgue, les transitions.","Ce sont vos points de rendez-vous.","Aux transitions et aux notes tenues : regardez-vous."],src:"Ginsborg 2006 \xB7 Bishop 2019"},"f-passage":{nom:"Le passage en mode spectacle",duree:4,comment:["Un passage complet, sans s\u2019arr\xEAter, quoi qu\u2019il arrive.","Enregistrez-le.","Les conditions de sc\xE8ne ne sont pas celles de la r\xE9p\xE9tition : on s\u2019y entra\xEEne."],src:"Montemayor 2014 \xB7 Lapicus 2025"},"f-verbal":{nom:"Verbalisation guid\xE9e",duree:6,comment:["Ce qu\u2019on voulait (intention).","Ce qu\u2019on a entendu.","L\u2019\xE9cart, puis LA prochaine cible. Pas de \xAB j\u2019aime / j\u2019aime pas \xBB."],src:"Biasutti 2017 \xB7 Marino 2023"},"f-reecoute":{nom:"R\xE9\xE9coute de la prise",duree:5,comment:["R\xE9\xE9coutez la prise du jour.","Les attaques tombent-elles ensemble? L\u2019\xE9quilibre voix / guitare / clavier / effets?","Notez une seule chose \xE0 corriger."],src:"Biasutti 2015 \xB7 Kamb
