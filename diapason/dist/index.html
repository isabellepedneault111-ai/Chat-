ochaine session.",pool:["f-verbal"],src:"Biasutti 2018"}},mt=[{id:"duo60",label:"Session duo \xB7 60 min",phases:[["checkin",5],["echauffement",8],["impro",15],["developper",15],["structure",5],["prise",4],["debrief",8]]},{id:"duo90",label:"Session duo \xB7 90 min",phases:[["checkin",5],["echauffement",10],["impro",20],["developper",25],["structure",10],["prise",8],["debrief",12]]},{id:"solo",label:"Micro-session solo \xB7 25 min",phases:[["cible",2],["echauffement",5],["solo",13],["memo",5]]},{id:"ecoute",label:"\xC9coute commune \xB7 20 min",phases:[["reecoute",12],["tri",8]]}],oo=["Un groove","Un refrain","Une ambiance","Une transition","Les entr\xE9es ensemble","Le texte d\u2019un couplet","Un son d\u2019effet signature","La fin d\u2019un morceau"],Ye={"p-renv":{nom:"Renversements dans la voix de Zaza",duree:8,comment:["Do, Fa, Sol : joue chaque accord en position fondamentale.","Puis le renversement le plus proche du pr\xE9c\xE9dent : les doigts bougent le moins possible.","Garde la note du haut dans la tessiture de Zaza : c\u2019est l\xE0 que sa voix se posera."],src:"Piston 1941 \xB7 conduite des voix"},"p-harmo":{nom:"Harmoniser le yaourt de Zaza",duree:10,comment:["\xC9coute son dernier yaourt deux fois, sans jouer.","Trouve la note o\xF9 elle revient le plus : c\u2019est sa maison.","Un accord par mesure qui contient sa note longue. Enregistre, lance-le-lui au relais."],src:"Pattison 2009 \xB7 Burger 2022"},"p-comping":{nom:"Quatre fa\xE7ons d\u2019accompagner",duree:8,comment:["Blocs sur les temps : simple, solide.","Croches r\xE9guli\xE8res : la nappe qui avance.","Charleston 3-3-2 : le balancement.","Une seule attaque par mesure : laisse respirer la voix."],src:"Levine 1989 \xB7 Clauhs 2021"},"p-couleurs":{nom:"Accords sans tierce : la couleur",duree:6,comment:["Joue Do \u2013 Sol \u2013 R\xE9 (quinte et neuvi\xE8me) au lieu de Do majeur.","Prom\xE8ne cette forme sur la gamme : un son ouvert, moderne.","Quelle chanson de nous deux vivrait l\xE0-dedans?"],src:"Levine 1989 \xB7 voicings ouverts"},"p-basse":{nom:"Une main gauche qui tient tout",duree:6,comment:["P\xE9dale : la m\xEAme basse quatre mesures, la main droite change au-dessus.","La basse descend d\u2019un pas par mesure : Do, Si, La, Sol.","Un ostinato de trois notes, r\xE9p\xE9t\xE9 jusqu\u2019\xE0 devenir un groove."],src:"Burger 2022 \xB7 Norgaard 2017"},"p-reharmo":{nom:"Une note, quatre accords",duree:8,comment:["Prends une seule note de la m\xE9lodie de Zaza : Mi.","Quatre accords qui la contiennent : Do, Lam, Mim, Famaj7.","La m\xEAme m\xE9lodie sur chacun : la couleur change, l\u2019\xE9motion aussi."],src:"Levine 1989 \xB7 r\xE9harmonisation"},"e-penta":{nom:"Pentatonique sans fausse note",duree:5,comment:["Tonalit\xE9 du jour, gamme pentatonique seulement.","Frog sur les notes de la pentatonique (ou les touches noires).","Zaza chante des voyelles par-dessus, puis la guitare rejoint."],src:"Chac\xF3n-L\xF3pez 2021 \xB7 Norgaard 2017"},"e-echo":{nom:"\xC9cho rythmique",duree:4,comment:["L\u2019un frappe ou joue une mesure, l\u2019autre la r\xE9p\xE8te exactement.","Apr\xE8s 8 \xE9changes, on inverse.","Puis on monte le tempo de 10 BPM."],src:"Edmund 2020 \xB7 Nikolaou 2023"},"e-gamme":{nom:"Gamme au m\xE9tronome",duree:5,comment:["La gamme de la tonalit\xE9 du jour, en noires puis en croches.","Ensemble, au m\xE9tronome, mouvements conjoints.","\xC9coutez les attaques : tombent-elles en m\xEAme temps?"],src:"Rotjan 2020 \xB7 Zhou 2025"},"e-regard":{nom:"Avec, puis sans se regarder",duree:5,comment:["Une boucle simple en se regardant.","La m\xEAme boucle dos \xE0 dos.","Qu\u2019est-ce qui a chang\xE9? Qui a pris le lead?"],src:"Bishop 2019"},"e-corps":{nom:"Corps et souffle",duree:3,comment:["Une consigne de mouvement : balancer, marcher le tempo, respirer ensemble.","\xC9paules basses, m\xE2choire molle.","Le corps pr\xEAt avant les doigts et la voix."],src:"Siljam\xE4ki 2021 \xB7 MacGlone 2024"},"i-appel":{nom:"Appel-r\xE9ponse sur 2 mesures",duree:8,comment:["Zaza (voix ou guitare) lance 2 mesures.","Frog (piano) r\xE9pond sur 2 mesures.","Apr\xE8s 8 \xE9changes : on inverse les r\xF4les."],src:"Bertolani 2019 \xB7 Nikolaou 2023"},"i-nonrep":{nom:"Non-r\xE9p\xE9tition",duree:8,comment:["Chaque nouveau passage doit changer UN param\xE8tre : rythme, registre, texture, nuance.","Interdit de rejouer la m\xEAme chose.","Notez le param\xE8tre qui a le plus surpris."],src:"Bertolani 2019"},"i-eco":{nom:"\xC9conomie de mat\xE9riau",duree:8,comment:["Limite stricte : une note tenue, OU une cellule de 3 notes, OU un seul intervalle.","Tout le reste vient du rythme, du timbre, des effets.","Moins de choix = plus d\u2019\xE9coute."],src:"De Bruin 2019 \xB7 Sayers 2025"},"i-theme":{nom:"Impro sur un th\xE8me externe",duree:10,comment:["Choisissez un point de d\xE9part : une photo, un mot, un souvenir commun.","Jouez-le sans en parler.","Comparez ensuite : aviez-vous la m\xEAme image?"],src:"Price 2026 \xB7 Bertolani 2019"},"i-image":{nom:"Image et m\xE9taphore",duree:8,comment:["Une image concr\xE8te : \xAB une rue mouill\xE9e \xE0 3 h du matin \xBB.","Frog cherche le timbre et la texture dans les effets.","Zaza cherche la couleur de la voix et de la guitare."],src:"Biasutti 2017 \xB7 MacGlone 2024"},"i-degres":{nom:"Degr\xE9s 1, 2, 3, 5 sur I\u2013IV\u2013V\u2013I",duree:8,comment:["Grille I\u2013IV\u2013V\u2013I en boucle.","La voix (ou la main droite) se limite aux degr\xE9s 1, 2, 3 et 5.","Pr\xE9cision d\u2019abord, libert\xE9 ensuite."],src:"Clauhs 2021 \xB7 Burger 2022"},"i-libre":{nom:"Impro libre",duree:10,comment:["Sans plan, sans grille.","Enregistrez tout : vous trierez plus tard.","Laissez de l\u2019espace \xE0 l\u2019autre."],src:"Aslan 2016"},"i-preentendre":{nom:"Pr\xE9-entendre",duree:5,comment:["Humez ou chantez la ligne AVANT de la jouer.","Puis jouez-la telle que vous l\u2019avez entendue dans votre t\xEAte.","L\u2019oreille d\u2019abord, les doigts ensuite."],src:"Vilnite 2023"},"a-fragment":{nom:"U
